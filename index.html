<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DreamWall</title>
<style>
:root{--accent:#c9a4ff;--accent2:#9ee8d5;--pink:#ffb8d7;--bg:#faf8fc;--card:#fff;--text:#30283a;--muted:#8e8498;--border:#e9e0ef;--soft:#f3edf8;--shadow:0 10px 35px rgba(91,67,110,.1)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.topbar{height:72px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 25px;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}.logo{font-size:28px;font-weight:900;letter-spacing:-1px;background:linear-gradient(90deg,var(--accent),#ff94be,var(--accent2));-webkit-background-clip:text;color:transparent}.search{width:min(390px,40vw);border:0;outline:0;background:#f3eff6;padding:12px 18px;border-radius:30px}.top-right{display:flex;align-items:center;gap:10px}.circle-button{width:42px;height:42px;border:0;border-radius:50%;background:var(--soft);font-size:19px}.mini-profile{width:42px;height:42px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);cursor:pointer}.layout{max-width:1250px;margin:auto;display:grid;grid-template-columns:210px minmax(0,650px) 250px;gap:28px;padding:28px 20px 50px}.sidebar{position:sticky;top:100px;height:max-content}.nav{display:flex;flex-direction:column;gap:6px}.nav button{border:0;background:transparent;padding:14px;text-align:left;border-radius:15px;font-weight:700;color:var(--text)}.nav button:hover,.nav button.active{background:#eee5f6;color:#8756bf}.nav-icon{display:inline-block;width:28px;font-size:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px}.stories{display:flex;gap:18px;overflow-x:auto;padding:4px 3px 22px}.story{width:75px;flex:0 0 75px;text-align:center;font-size:12px;font-weight:700}.story-ring{width:68px;height:68px;padding:3px;margin:auto auto 5px;border-radius:50%;background:#ddd}.story-ring.new{background:linear-gradient(135deg,var(--accent),#ff8fbb,var(--accent2));box-shadow:0 0 0 3px white,0 0 0 5px var(--accent)}.story-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid white}.empty{text-align:center;padding:80px 25px;color:var(--muted)}.empty-icon{font-size:55px;margin-bottom:15px}.empty h2{color:var(--text)}.primary{border:0;border-radius:14px;padding:12px 18px;color:white;font-weight:800;background:linear-gradient(135deg,var(--accent),#ff9ec4)}.secondary{border:1px solid var(--border);border-radius:14px;padding:11px 17px;background:white;font-weight:700}.post-header{display:flex;align-items:center;gap:11px;padding:15px}.avatar{width:43px;height:43px;object-fit:cover;border-radius:50%;border:2px solid var(--accent);cursor:pointer}.creator-info{flex:1}.creator-info strong{cursor:pointer}.creator-info small{display:block;color:var(--muted);margin-top:3px}.badge{display:inline-flex;align-items:center;justify-content:center;font-size:10px;width:17px;height:17px;border-radius:50%;margin-left:3px;color:white}.real-badge{background:#7a65e8}.ai-badge{background:#a46ed1}.post-menu{border:0;background:none;font-size:20px}.wallpaper{width:100%;aspect-ratio:9/14;min-height:390px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}.wallpaper-content{text-align:center;z-index:3;padding:25px;max-width:90%}.wallpaper-title{font-size:45px;line-height:.95;margin:0;font-weight:900}.wallpaper-subtitle{margin-top:13px;font-size:15px;opacity:.8}.bubble{position:absolute;border-radius:50%;background:rgba(255,255,255,.25)}.bubble.one{width:270px;height:270px;right:-90px;top:-60px}.bubble.two{width:200px;height:200px;left:-80px;bottom:-50px}.symbol{position:absolute;font-size:22px;z-index:2}.actions{display:flex;gap:13px;padding:12px 15px 5px}.actions button{border:0;background:none;font-size:24px}.liked{color:#ff599b}.post-body{padding:4px 15px 15px}.caption{margin-top:9px;line-height:1.45}.comment{font-size:14px;margin-top:8px}.comment-box{display:flex;border-top:1px solid var(--border);padding:10px 14px}.comment-box input{flex:1;border:0;outline:0}.comment-box button{border:0;background:none;color:#8756bf;font-weight:800}.side-card{background:white;border:1px solid var(--border);border-radius:20px;padding:18px;margin-bottom:18px}.side-card h3{margin-top:0}.profile-page{text-align:center}.banner{height:150px;border-radius:23px;background:linear-gradient(135deg,var(--accent),var(--pink),var(--accent2))}.large-avatar{width:110px;height:110px;object-fit:cover;border-radius:50%;border:6px solid white;margin-top:-55px}.profile-name{font-size:25px;font-weight:900;margin-top:8px}.username{color:var(--muted)}.bio{max-width:520px;margin:12px auto;line-height:1.5}.stats{display:flex;justify-content:center;gap:45px;margin:22px}.stat strong{display:block;font-size:20px}.stat span{color:var(--muted);font-size:12px}.profile-buttons{display:flex;justify-content:center;gap:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:25px}.grid-item{aspect-ratio:1;border-radius:12px;overflow:hidden;cursor:pointer}.grid-item .wallpaper{height:100%;min-height:0}.grid-item .wallpaper-title{font-size:20px}.modal-bg{display:none;position:fixed;inset:0;z-index:300;align-items:center;justify-content:center;padding:20px;background:rgba(35,24,45,.5);backdrop-filter:blur(7px)}.modal-bg.open{display:flex}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:white;border-radius:28px;padding:25px}.modal-header{display:flex;justify-content:space-between;align-items:center}.close{width:38px;height:38px;border:0;border-radius:50%;background:#f2ecf7;font-size:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.full{grid-column:1/-1}.field input,.field textarea,.field select{border:1px solid var(--border);border-radius:13px;padding:11px;outline:0}.field textarea{min-height:90px;resize:vertical}.creator-preview{max-width:270px;margin:20px auto;border-radius:20px;overflow:hidden}.creator-preview .wallpaper{min-height:400px}.creator-tools{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tool{border:1px solid var(--border);border-radius:17px;padding:15px}.tool h4{margin-top:0}.color{width:50px;height:40px;border:0;padding:0;background:none}.messages{display:grid;grid-template-columns:220px 1fr;height:580px;border:1px solid var(--border);border-radius:20px;overflow:hidden;background:white}.people{border-right:1px solid var(--border);overflow:auto;padding:8px}.person{padding:13px;border-radius:13px;cursor:pointer}.person:hover,.person.selected{background:#f1eafa}.chat{display:flex;flex-direction:column;height:100%}.chat-head{padding:17px;font-weight:800;border-bottom:1px solid var(--border)}.chat-messages{flex:1;padding:15px;overflow:auto}.chat-bubble{max-width:75%;width:max-content;background:#f0e9f5;padding:10px 14px;border-radius:17px;margin:8px 0}.chat-bubble.me{margin-left:auto;background:#d8c5f3}.chat-input{display:flex;padding:12px;border-top:1px solid var(--border)}.chat-input input{flex:1;border:0;outline:0;padding:10px}.ai-info{background:#f4ecfa;border-radius:14px;padding:11px;font-size:13px;color:#70517e;margin:12px 0}.toast{position:fixed;bottom:25px;left:50%;z-index:500;transform:translate(-50%,100px);background:#30283a;color:white;padding:13px 20px;border-radius:30px;transition:.3s}.toast.show{transform:translate(-50%,0)}@media(max-width:1000px){.layout{grid-template-columns:70px minmax(0,650px);justify-content:center}.right{display:none}.nav button span:not(.nav-icon){display:none}}@media(max-width:650px){.topbar{padding:0 12px}.search{display:none}.layout{display:block;padding:15px 10px 80px}.sidebar{position:fixed;bottom:0;left:0;right:0;top:auto;z-index:200;height:62px;width:auto;background:white;border-top:1px solid var(--border)}.nav{height:100%;flex-direction:row;align-items:center;justify-content:space-around}.nav button{padding:8px}.form-grid,.creator-tools{grid-template-columns:1fr}.full{grid-column:auto}.messages{grid-template-columns:1fr}.people{display:flex;border-right:0;border-bottom:1px solid var(--border);height:80px}}
</style>
</head>
<body>
<header class="topbar"><div class="logo">DreamWall</div><input id="search" class="search" placeholder="Search DreamWall..."><div class="top-right"><button class="circle-button" onclick="showMessages()">💬</button><button class="circle-button" onclick="openCreator()">＋</button><img id="miniProfile" class="mini-profile" onclick="showProfile()" alt="Profile"></div></header>
<div class="layout"><aside class="sidebar"><nav class="nav"><button onclick="showHome()" class="active"><span class="nav-icon">⌂</span><span>Home</span></button><button onclick="showExplore()"><span class="nav-icon">⌕</span><span>Explore</span></button><button onclick="openCreator()"><span class="nav-icon">＋</span><span>Create</span></button><button onclick="showMessages()"><span class="nav-icon">♡</span><span>Messages</span></button><button onclick="showProfile()"><span class="nav-icon">●</span><span>Profile</span></button></nav></aside><main id="main"></main><aside class="right"><div class="side-card"><h3>DreamWall</h3><p style="color:var(--muted);font-size:14px;line-height:1.5">Your feed starts empty. When real creators make wallpapers, they can appear here.</p></div><div class="side-card"><h3>Your account</h3><p id="sideAccount" style="color:var(--muted)">You haven't created your profile yet.</p><button class="primary" onclick="editAccount()">Edit Account</button></div></aside></div>
<div id="modalBg" class="modal-bg"><div id="modal" class="modal"></div></div><div id="toast" class="toast"></div>
<script>
let db=JSON.parse(localStorage.getItem('dreamwallDatabase'))||{account:{username:'',realName:'',password:'',avatar:'',bio:'',accent:'#c9a4ff',accent2:'#9ee8d5',isReal:true},posts:[],following:[],messages:[]};
const save=()=>localStorage.setItem('dreamwallDatabase',JSON.stringify(db));
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
const js=v=>String(v??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
const placeholder='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="#eee7f5"/><text x="50" y="58" text-anchor="middle" font-size="42">☁</text></svg>');
function theme(){document.documentElement.style.setProperty('--accent',db.account.accent||'#c9a4ff');document.documentElement.style.setProperty('--accent2',db.account.accent2||'#9ee8d5');document.getElementById('miniProfile').src=db.account.avatar||placeholder;document.getElementById('sideAccount').textContent=db.account.username?'@'+db.account.username:'You haven\'t created your profile yet.'}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function openModal(c){document.getElementById('modal').innerHTML=c;document.getElementById('modalBg').classList.add('open')}
function closeModal(){document.getElementById('modalBg').classList.remove('open')}
document.getElementById('modalBg').onclick=e=>{if(e.target===e.currentTarget)closeModal()};
function setActive(i){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));let b=document.querySelectorAll('.nav button')[i];if(b)b.classList.add('active')}
function showHome(){setActive(0);let m=document.getElementById('main');if(!db.posts.length){m.innerHTML='<div class="stories"><div class="story"><div class="story-ring"><img src="'+(db.account.avatar||placeholder)+'"></div>You</div></div><div class="card"><div class="empty"><div class="empty-icon">🌙</div><h2>Your DreamWall is waiting</h2><p>There aren\'t any wallpapers here yet. Create the first one!</p><br><button class="primary" onclick="openCreator()">＋ Create Wallpaper</button></div></div>';return}m.innerHTML='<div class="stories"><div class="story"><div class="story-ring"><img src="'+(db.account.avatar||placeholder)+'"></div>You</div>'+db.posts.map(p=>'<div class="story" onclick="openCreatorProfile(\''+js(p.creator)+'\')"><div class="story-ring '+(p.isNew?'new':'')+'"><img src="'+p.avatar+'"></div>'+esc(p.creator)+'</div>').join('')+'</div>'+db.posts.map(renderPost).join('');db.posts.forEach(p=>p.isNew=false);save()}
function renderPost(p){return '<article class="card"><div class="post-header"><img class="avatar" src="'+p.avatar+'" onclick="openCreatorProfile(\''+js(p.creator)+'\')"><div class="creator-info"><strong onclick="openCreatorProfile(\''+js(p.creator)+'\')">'+esc(p.creator)+(p.creatorType==='real'?'<span class="badge real-badge">✓</span>':'<span class="badge ai-badge">AI</span>')+'</strong><small>'+(p.creatorType==='real'?'Real creator':'AI creator')+'</small></div><button class="post-menu">•••</button></div>'+wallpaper(p)+'<div class="actions"><button class="'+(p.liked?'liked':'')+'" onclick="likePost('+p.id+')">'+(p.liked?'♥':'♡')+'</button><button onclick="focusComment('+p.id+')">💬</button><button onclick="sharePost('+p.id+')">⤴</button><button onclick="remix('+p.id+')">✦</button></div><div class="post-body"><strong>'+p.likes+' likes</strong><div class="caption"><strong>'+esc(p.creator)+'</strong> '+esc(p.caption)+'</div>'+p.comments.map(c=>'<div class="comment"><strong>'+esc(c.username)+'</strong> '+esc(c.text)+'</div>').join('')+'</div><div class="comment-box"><input id="comment-'+p.id+'" placeholder="Add a comment..."><button onclick="comment('+p.id+')">Post</button></div></article>'}
function wallpaper(p){return '<div class="wallpaper" style="background:linear-gradient(145deg,'+p.bg1+','+p.bg2+');color:'+p.text+'"><div class="bubble one"></div><div class="bubble two"></div><span class="symbol" style="top:15%;left:17%">'+esc(p.symbol)+'</span><span class="symbol" style="top:25%;right:18%">'+esc(p.symbol)+'</span><span class="symbol" style="bottom:18%;right:20%">'+esc(p.symbol)+'</span><span class="symbol" style="bottom:13%;left:18%">'+esc(p.symbol)+'</span><div class="wallpaper-content"><h2 class="wallpaper-title">'+esc(p.title)+'</h2><div class="wallpaper-subtitle">'+esc(p.subtitle)+'</div></div></div>'}
function likePost(id){let p=db.posts.find(x=>x.id===id);if(!p)return;p.liked=!p.liked;p.likes+=p.liked?1:-1;save();showHome()}
function comment(id){let i=document.getElementById('comment-'+id);if(!i||!i.value.trim())return;let p=db.posts.find(x=>x.id===id);p.comments.push({username:db.account.username||'DreamWall User',text:i.value.trim()});save();showHome();toast('Comment posted!')}
function focusComment(id){let i=document.getElementById('comment-'+id);if(i){i.focus();i.scrollIntoView({behavior:'smooth'})}}
function sharePost(id){let p=db.posts.find(x=>x.id===id);if(!p)return;let t='Check out "'+p.title+'" on DreamWall!';if(navigator.share)navigator.share({title:'DreamWall',text:t});else{navigator.clipboard?.writeText(t);toast('Share text copied!')}}
function remix(id){let p=db.posts.find(x=>x.id===id);if(p)openCreator(p)}
function editAccount(){openModal('<div class="modal-header"><h2>Edit Account</h2><button class="close" onclick="closeModal()">×</button></div><p style="color:var(--muted)">Your account is created here. There is no login screen.</p><div class="form-grid"><div class="field"><label>Username</label><input id="username" value="'+esc(db.account.username)+'" placeholder="Choose a username"></div><div class="field"><label>Real name</label><input id="realName" value="'+esc(db.account.realName)+'" placeholder="Your real name"></div><div class="field"><label>Password</label><input id="password" type="password" value="'+esc(db.account.password)+'" placeholder="Optional"></div><div class="field"><label>Profile picture URL</label><input id="avatar" value="'+esc(db.account.avatar)+'" placeholder="Paste an image URL"></div><div class="field full"><label>Bio</label><textarea id="bio" placeholder="Tell people about your wallpapers...">'+esc(db.account.bio)+'</textarea></div><div class="field"><label>Main color</label><input id="accent" class="color" type="color" value="'+db.account.accent+'"></div><div class="field"><label>Second color</label><input id="accent2" class="color" type="color" value="'+db.account.accent2+'"></div></div><button class="primary" onclick="saveAccount()">Save Account</button>')}
function saveAccount(){let u=document.getElementById('username').value.trim(),r=document.getElementById('realName').value.trim();if(!u||!r){toast('Enter a username and real name.');return}if(u.toLowerCase()===r.toLowerCase()){toast('Your username cannot be your real name.');return}let old=db.account.username;db.account.username=u;db.account.realName=r;db.account.password=document.getElementById('password').value;db.account.avatar=document.getElementById('avatar').value;db.account.bio=document.getElementById('bio').value;db.account.accent=document.getElementById('accent').value;db.account.accent2=document.getElementById('accent2').value;db.posts.forEach(p=>{if(p.creator===old){p.creator=u;p.avatar=db.account.avatar||placeholder}});save();theme();closeModal();showProfile();toast('Account saved!')}
function openCreator(prefill=null){let p=prefill||{title:'Dreamy',subtitle:'make your world beautiful',bg1:db.account.accent,bg2:db.account.accent2,text:'#4d3d59',symbol:'✦'};openModal('<div class="modal-header"><h2>Create Wallpaper ✨</h2><button class="close" onclick="closeModal()">×</button></div><div class="ai-info">🎨 DreamWall lets you design your own wallpaper. This creator does not generate images with AI.</div><div id="preview" class="creator-preview">'+wallpaper(p)+'</div><div class="creator-tools"><div class="tool"><h4>Text</h4><div class="field"><label>Title</label><input id="title" value="'+esc(p.title)+'" oninput="preview()"></div><div class="field"><label>Subtitle</label><input id="subtitle" value="'+esc(p.subtitle)+'" oninput="preview()"></div><div class="field"><label>Symbol</label><select id="symbol" onchange="preview()">'+['✦','♡','✧','★','☁','☾','🌸','🎀','🦋','🌙','✨','⭐','🌊','🍓','🌷','🫧'].map(s=>'<option '+(s===p.symbol?'selected':'')+'>'+s+'</option>').join('')+'</select></div></div><div class="tool"><h4>Colors</h4><div class="field"><label>Background 1</label><input id="bg1" class="color" type="color" value="'+p.bg1+'" oninput="preview()"></div><div class="field"><label>Background 2</label><input id="bg2" class="color" type="color" value="'+p.bg2+'" oninput="preview()"></div><div class="field"><label>Text color</label><input id="text" class="color" type="color" value="'+p.text+'" oninput="preview()"></div></div><div class="tool"><h4>Quick looks</h4><button class="secondary" onclick="stylePreset(\'cotton\')">Cotton Candy</button> <button class="secondary" onclick="stylePreset(\'ocean\')">Ocean</button> <button class="secondary" onclick="stylePreset(\'lavender\')">Lavender</button> <button class="secondary" onclick="stylePreset(\'mint\')">Mint</button> <button class="secondary" onclick="stylePreset(\'sunset\')">Sunset</button> <button class="secondary" onclick="stylePreset(\'night\')">Night</button></div><div class="tool"><h4>Publishing</h4><p style="color:var(--muted);font-size:14px">Your wallpaper appears only after you press Publish.</p></div></div><br><button class="primary" style="width:100%" onclick="publish()">Publish Wallpaper</button>')}
function preview(){let p={title:document.getElementById('title').value,subtitle:document.getElementById('subtitle').value,bg1:document.getElementById('bg1').value,bg2:document.getElementById('bg2').value,text:document.getElementById('text').value,symbol:document.getElementById('symbol').value};document.getElementById('preview').innerHTML=wallpaper(p)}
function stylePreset(t){let x={cotton:['#ffc9e1','#d7c8ff','#704f6b','♡'],ocean:['#98e5df','#b9cbff','#315a66','✧'],lavender:['#d8c7ff','#bfcfff','#51436e','✦'],mint:['#b7efd9','#c7eaff','#315c58','🌿'],sunset:['#ffc38e','#ffb4cc','#744d3b','☀'],night:['#35304e','#756ba8','#fff','☾']}[t];document.getElementById('bg1').value=x[0];document.getElementById('bg2').value=x[1];document.getElementById('text').value=x[2];document.getElementById('symbol').value=x[3];preview()}
function publish(){if(!db.account.username){closeModal();editAccount();toast('Create your account first.');return}let title=document.getElementById('title').value.trim();if(!title){toast('Give your wallpaper a title!');return}db.posts.unshift({id:Date.now(),creator:db.account.username,creatorType:'real',avatar:db.account.avatar||placeholder,title,subtitle:document.getElementById('subtitle').value,bg1:document.getElementById('bg1').value,bg2:document.getElementById('bg2').value,text:document.getElementById('text').value,symbol:document.getElementById('symbol').value,caption:'A wallpaper I made on DreamWall ✨',likes:0,liked:false,comments:[],isNew:true});save();closeModal();showHome();toast('Your wallpaper is live! ✨')}
function showExplore(){setActive(1);let m=document.getElementById('main');m.innerHTML=db.posts.length?'<h1>Explore</h1><div class="grid">'+db.posts.map(p=>'<div class="grid-item" onclick="openPost('+p.id+')">'+wallpaper(p)+'</div>').join('')+'</div>':'<div class="card"><div class="empty"><div class="empty-icon">🔎</div><h2>Explore is empty</h2><p>Real creators\' wallpapers will appear here after they are actually posted.</p></div></div>'}
function openPost(id){let p=db.posts.find(x=>x.id===id);if(!p)return;openModal('<div class="modal-header"><h2>'+esc(p.title)+'</h2><button class="close" onclick="closeModal()">×</button></div>'+wallpaper(p)+'<br><button class="primary" onclick="remix('+p.id+')">✦ Recreate this wallpaper</button>')}
function showProfile(){setActive(4);let mine=db.posts.filter(p=>p.creator===db.account.username);document.getElementById('main').innerHTML='<div class="profile-page"><div class="banner"></div><img class="large-avatar" src="'+(db.account.avatar||placeholder)+'"><div class="profile-name">'+esc(db.account.realName||'Your DreamWall Profile')+'</div><div class="username">'+(db.account.username?'@'+esc(db.account.username):'No username yet')+'</div><p class="bio">'+esc(db.account.bio||'Create your DreamWall profile ✨')+'</p><div class="stats"><div class="stat"><strong>'+mine.length+'</strong><span>Posts</span></div><div class="stat"><strong>'+db.following.length+'</strong><span>Following</span></div><div class="stat"><strong>Real</strong><span>Account</span></div></div><div class="profile-buttons"><button class="primary" onclick="editAccount()">Edit Account</button><button class="secondary" onclick="openCreator()">Create</button></div><div class="grid">'+(mine.length?mine.map(p=>'<div class="grid-item" onclick="openPost('+p.id+')">'+wallpaper(p)+'</div>').join(''):'<div style="grid-column:1/-1" class="empty"><div class="empty-icon">🎨</div><h2>No wallpapers yet</h2><p>Your creations will appear here.</p></div>')+'</div></div>'}
function openCreatorProfile(u){let p=db.posts.find(x=>x.creator===u);if(!p)return;let posts=db.posts.filter(x=>x.creator===u);openModal('<div class="modal-header"><h2>Creator</h2><button class="close" onclick="closeModal()">×</button></div><div class="profile-page"><img class="large-avatar" style="margin-top:5px" src="'+p.avatar+'"><div class="profile-name">'+esc(u)+(p.creatorType==='real'?'<span class="badge real-badge">✓</span>':'<span class="badge ai-badge">AI</span>')+'</div><div class="username">'+(p.creatorType==='real'?'Real creator':'AI creator')+'</div>'+(p.creatorType==='real'?'<div class="profile-buttons"><button class="primary" onclick="follow(\''+js(u)+'\')">Follow</button><button class="secondary" onclick="messageCreator(\''+js(u)+'\')">Message</button></div>':'<div class="ai-info">🤖 This is an AI creator. AI creators cannot receive messages.</div>')+'<div class="grid">'+posts.map(x=>'<div class="grid-item" onclick="openPost('+x.id+')">'+wallpaper(x)+'</div>').join('')+'</div></div>')}
function follow(u){if(!db.following.includes(u)){db.following.push(u);toast('Following!')}else{db.following=db.following.filter(x=>x!==u);toast('Unfollowed')}save()}
function messageCreator(u){let p=db.posts.find(x=>x.creator===u);if(!p||p.creatorType!=='real'){toast('You can only message real creators.');return}if(!db.messages.find(x=>x.username===u))db.messages.push({username:u,messages:[]});save();closeModal();showMessages()}
function showMessages(){setActive(3);let m=document.getElementById('main');if(!db.messages.length){m.innerHTML='<h1>Messages</h1><div class="card"><div class="empty"><div class="empty-icon">💌</div><h2>No messages yet</h2><p>When you message a real creator, conversations appear here.</p></div></div>';return}m.innerHTML='<h1>Messages</h1><div class="messages"><div class="people">'+db.messages.map((c,i)=>'<div class="person '+(i===0?'selected':'')+'" onclick="selectChat('+i+')"><strong>'+esc(c.username)+'</strong></div>').join('')+'</div><div id="chatArea">'+chatHTML(0)+'</div></div>'}
function chatHTML(i){let c=db.messages[i];return '<div class="chat"><div class="chat-head">'+esc(c.username)+'</div><div class="chat-messages">'+(c.messages.length?c.messages.map(x=>'<div class="chat-bubble '+(x.from==='me'?'me':'')+'">'+esc(x.text)+'</div>').join(''):'<div class="empty">Start the conversation!</div>')+'</div><div class="chat-input"><input id="messageInput" placeholder="Message about wallpapers..."><button class="primary" onclick="sendMessage('+i+')">Send</button></div></div>'}
function selectChat(i){document.getElementById('chatArea').innerHTML=chatHTML(i)}
function sendMessage(i){let x=document.getElementById('messageInput');if(!x||!x.value.trim())return;db.messages[i].messages.push({from:'me',text:x.value.trim()});save();selectChat(i)}
document.getElementById('search').addEventListener('input',function(){let q=this.value.toLowerCase().trim();if(!q){showHome();return}let r=db.posts.filter(p=>p.title.toLowerCase().includes(q)||p.creator.toLowerCase().includes(q)||p.caption.toLowerCase().includes(q));document.getElementById('main').innerHTML=r.length?r.map(renderPost).join(''):'<div class="card"><div class="empty"><div class="empty-icon">🔎</div><h2>No results</h2><p>Nothing has been posted that matches "'+esc(q)+'".</p></div></div>'});
theme();showHome();
</script>
</body>
</html>
