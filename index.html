<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DreamWall</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:#493957;

    background:
        radial-gradient(
            circle at 10% 10%,
            #eadbff 0,
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 90%,
            #d8fff3 0,
            transparent 30%
        ),
        #fffaff;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

.page{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:25px;
}

.card{
    width:100%;
    max-width:480px;

    background:white;

    border:1px solid #eadff1;
    border-radius:28px;

    padding:32px;

    box-shadow:
        0 20px 60px
        rgba(70,40,90,.12);
}

.logo{
    text-align:center;

    font-size:40px;
    font-weight:900;

    background:
        linear-gradient(
            90deg,
            #b58aff,
            #ff9fc5,
            #83ddc5
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}

.tagline{
    text-align:center;

    color:#887a91;

    margin-top:8px;
    margin-bottom:28px;
}

h1{
    text-align:center;
    margin:10px 0 22px;
}

.field{
    width:100%;

    padding:15px;

    margin:7px 0;

    border:
        1px solid
        #ddd3e5;

    border-radius:14px;

    outline:none;

    background:white;

    color:#493957;
}

.field:focus{
    border-color:#b58aff;

    box-shadow:
        0 0 0 4px
        rgba(181,138,255,.12);
}

.primary{
    width:100%;

    padding:15px;

    margin-top:10px;

    border:0;

    border-radius:15px;

    color:white;

    font-weight:700;

    background:
        linear-gradient(
            100deg,
            #b58aff,
            #ff9fc5
        );
}

.secondary{
    width:100%;

    padding:13px;

    margin-top:10px;

    border:
        1px solid
        #eadff1;

    border-radius:15px;

    background:white;

    color:#493957;
}

.message{
    padding:14px;

    margin-top:15px;

    border-radius:14px;

    line-height:1.45;

    display:none;
}

.message.show{
    display:block;
}

.message.error{
    background:#fff0f3;
    color:#a13d58;
}

.message.success{
    background:#eafff7;
    color:#28745e;
}

.message.info{
    background:#f1edff;
    color:#654c91;
}

.small{
    font-size:13px;

    color:#8b7e93;

    text-align:center;

    margin-top:20px;

    line-height:1.5;
}

.back{
    background:none;

    border:0;

    color:#7655a0;

    padding:0;

    margin-bottom:12px;
}

.account{
    text-align:center;

    padding:18px;

    border-radius:16px;

    background:#faf7ff;

    margin-top:15px;
}

.loading{
    opacity:.6;

    pointer-events:none;
}

@media(max-width:520px){

    .page{
        padding:12px;
    }

    .card{
        padding:24px 18px;
    }

    .logo{
        font-size:34px;
    }
}
</style>
</head>

<body>

<div id="app"></div>

<script>

/* =========================================================
   DREAMWALL SUPABASE CONNECTION
   ========================================================= */

const SUPABASE_URL =
"https://kcybwrdtnlflevndmzfn.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_XhOq8P5tdMgjWDKZEvgsgg_hcALWg48";

let client = null;

let currentUser = null;


/* =========================================================
   START APPLICATION
   ========================================================= */

function start(){

    try{

        client =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );

    }catch(error){

        showErrorPage(
            "DreamWall could not connect to Supabase."
        );

        return;
    }

    checkSession();
}


/* =========================================================
   CHECK EXISTING SESSION
   ========================================================= */

async function checkSession(){

    try{

        const result =
            await client.auth.getSession();

        if(result.error){

            showLogin(
                result.error.message,
                "error"
            );

            return;
        }

        if(result.data.session){

            currentUser =
                result.data.session.user;

            showLoggedIn();

        }else{

            showLogin();

        }

    }catch(error){

        showLogin(
            "DreamWall could not check your login.",
            "error"
        );
    }
}


/* =========================================================
   LOGIN SCREEN
   ========================================================= */

function showLogin(
    message="",
    type=""
){

    document.getElementById("app").innerHTML=`

        <div class="page">

            <div class="card">

                <div class="logo">
                    DreamWall
                </div>

                <p class="tagline">
                    Your wallpaper world ✨
                </p>

                <h1>
                    Welcome back
                </h1>

                <form id="loginForm">

                    <input
                        id="loginEmail"
                        class="field"
                        type="email"
                        autocomplete="email"
                        placeholder="Email"
                        required
                    >

                    <input
                        id="loginPassword"
                        class="field"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Password"
                        required
                    >

                    <button
                        id="loginButton"
                        class="primary"
                        type="submit"
                    >
                        Sign in
                    </button>

                </form>

                <div
                    id="message"
                    class="message"
                ></div>

                <button
                    class="secondary"
                    onclick="showSignup()"
                >
                    Create a new account
                </button>

                <p class="small">
                    Your account is stored with
                    Supabase so you can use DreamWall
                    on different devices.
                </p>

            </div>

        </div>
    `;

    if(message){

        displayMessage(
            message,
            type
        );
    }

    document
        .getElementById("loginForm")
        .addEventListener(
            "submit",
            login
        );
}


/* =========================================================
   SIGNUP SCREEN
   ========================================================= */

function showSignup(
    message="",
    type=""
){

    document.getElementById("app").innerHTML=`

        <div class="page">

            <div class="card">

                <button
                    class="back"
                    onclick="showLogin()"
                >
                    ← Back to sign in
                </button>

                <div class="logo">
                    DreamWall
                </div>

                <p class="tagline">
                    Create your wallpaper world ✨
                </p>

                <h1>
                    Create account
                </h1>

                <form id="signupForm">

                    <input
                        id="realName"
                        class="field"
                        type="text"
                        autocomplete="name"
                        placeholder="Your real name"
                        required
                    >

                    <input
                        id="username"
                        class="field"
                        type="text"
                        autocomplete="username"
                        placeholder="Choose a username"
                        minlength="3"
                        maxlength="30"
                        required
                    >

                    <input
                        id="signupEmail"
                        class="field"
                        type="email"
                        autocomplete="email"
                        placeholder="Email"
                        required
                    >

                    <input
                        id="signupPassword"
                        class="field"
                        type="password"
                        autocomplete="new-password"
                        placeholder="Password (6+ characters)"
                        minlength="6"
                        required
                    >

                    <input
                        id="avatar"
                        class="field"
                        type="url"
                        placeholder="Profile picture URL (optional)"
                    >

                    <button
                        id="signupButton"
                        class="primary"
                        type="submit"
                    >
                        Create my DreamWall
                    </button>

                </form>

                <div
                    id="message"
                    class="message"
                ></div>

            </div>

        </div>
    `;

    if(message){

        displayMessage(
            message,
            type
        );
    }

    document
        .getElementById("signupForm")
        .addEventListener(
            "submit",
            signup
        );
}


/* =========================================================
   LOGIN
   ========================================================= */

async function login(event){

    event.preventDefault();

    const button =
        document.getElementById(
            "loginButton"
        );

    const email =
        document.getElementById(
            "loginEmail"
        ).value.trim();

    const password =
        document.getElementById(
            "loginPassword"
        ).value;

    if(!email || !password){

        displayMessage(
            "Please enter your email and password.",
            "error"
        );

        return;
    }

    button.textContent =
        "Signing in...";

    button.classList.add(
        "loading"
    );

    try{

        const result =
            await client.auth.signInWithPassword({

                email:email,

                password:password

            });

        if(result.error){

            handleAuthError(
                result.error
            );

            button.textContent =
                "Sign in";

            button.classList.remove(
                "loading"
            );

            return;
        }

        currentUser =
            result.data.user;

        showLoggedIn();

    }catch(error){

        displayMessage(
            "Something went wrong while signing in.",
            "error"
        );

        button.textContent =
            "Sign in";

        button.classList.remove(
            "loading"
        );
    }
}


/* =========================================================
   SIGN UP
   ========================================================= */

async function signup(event){

    event.preventDefault();

    const button =
        document.getElementById(
            "signupButton"
        );

    const realName =
        document.getElementById(
            "realName"
        ).value.trim();

    const username =
        document.getElementById(
            "username"
        ).value
        .trim()
        .toLowerCase()
        .replace(/\s+/g,"_");

    const email =
        document.getElementById(
            "signupEmail"
        ).value.trim();

    const password =
        document.getElementById(
            "signupPassword"
        ).value;

    const avatar =
        document.getElementById(
            "avatar"
        ).value.trim();

    if(username.length < 3){

        displayMessage(
            "Your username needs at least 3 characters.",
            "error"
        );

        return;
    }

    if(password.length < 6){

        displayMessage(
            "Your password needs at least 6 characters.",
            "error"
        );

        return;
    }

    button.textContent =
        "Checking username...";

    button.classList.add(
        "loading"
    );

    try{

        /*
         Check whether the username
         already exists.
        */

        const usernameCheck =
            await client
                .from("profiles")
                .select("id")
                .eq(
                    "username",
                    username
                )
                .maybeSingle();

        if(usernameCheck.error){

            displayMessage(
                "DreamWall couldn't check usernames. "+
                usernameCheck.error.message,
                "error"
            );

            resetSignupButton();

            return;
        }

        if(usernameCheck.data){

            displayMessage(
                "That username is already taken. Please choose another.",
                "error"
            );

            resetSignupButton();

            return;
        }

        button.textContent =
            "Creating account...";


        /*
         Create the Supabase
         authentication account.
        */

        const result =
            await client.auth.signUp({

                email:email,

                password:password

            });

        if(result.error){

            handleAuthError(
                result.error
            );

            resetSignupButton();

            return;
        }

        if(!result.data.user){

            displayMessage(
                "The account could not be created.",
                "error"
            );

            resetSignupButton();

            return;
        }

        currentUser =
            result.data.user;


        /*
         Email confirmation can mean
         there is no session yet.
        */

        if(!result.data.session){

            displayMessage(
                "Account created! 🎉 Check your email and confirm your email address. Then return to DreamWall and sign in.",
                "success"
            );

            button.textContent =
                "Account created!";

            button.classList.remove(
                "loading"
            );

            return;
        }


        /*
         Create public profile.
        */

        const profileResult =
            await client
                .from("profiles")
                .insert({

                    id:currentUser.id,

                    username:username,

                    real_name:realName,

                    avatar_url:avatar,

                    account_type:"real"

                });


        if(profileResult.error){

            displayMessage(
                "Your login was created, but your DreamWall profile could not be created. "+
                profileResult.error.message,
                "error"
            );

            resetSignupButton();

            return;
        }

        showLoggedIn();

    }catch(error){

        displayMessage(
            "Something unexpected happened. Please try again.",
            "error"
        );

        resetSignupButton();
    }
}


/* =========================================================
   RESET SIGNUP BUTTON
   ========================================================= */

function resetSignupButton(){

    const button =
        document.getElementById(
            "signupButton"
        );

    if(button){

        button.textContent =
            "Create my DreamWall";

        button.classList.remove(
            "loading"
        );
    }
}


/* =========================================================
   AUTH ERROR HANDLER
   ========================================================= */

function handleAuthError(error){

    const text =
        String(
            error?.message || ""
        ).toLowerCase();


    if(
        text.includes("already registered") ||
        text.includes("already been registered") ||
        text.includes("user already exists")
    ){

        displayMessage(
            "That email already has an account. Try signing in instead.",
            "error"
        );

        return;
    }


    if(
        text.includes("rate limit") ||
        text.includes("too many") ||
        text.includes("email rate")
    ){

        displayMessage(
            "Supabase has temporarily limited email requests. Please wait a little while before requesting another confirmation email.",
            "error"
        );

        return;
    }


    if(
        text.includes("email") &&
        text.includes("confirm")
    ){

        displayMessage(
            "Your email hasn't been confirmed yet. Check your email for the confirmation message.",
            "error"
        );

        return;
    }


    if(
        text.includes("invalid login") ||
        text.includes("invalid credentials") ||
        text.includes("invalid email or password")
    ){

        displayMessage(
            "That email and password don't match. Check them and try again.",
            "error"
        );

        return;
    }


    if(
        text.includes("password")
    ){

        displayMessage(
            error.message,
            "error"
        );

        return;
    }


    displayMessage(
        error.message ||
        "Something went wrong.",
        "error"
    );
}


/* =========================================================
   MESSAGE
   ========================================================= */

function displayMessage(
    text,
    type="info"
){

    const box =
        document.getElementById(
            "message"
        );

    if(!box) return;

    box.textContent =
        text;

    box.className =
        "message show "+
        (
            type==="success"
                ? "success"
                :
            type==="error"
                ? "error"
                :
                "info"
        );
}


/* =========================================================
   LOGGED IN SCREEN
   ========================================================= */

function showLoggedIn(){

    document.getElementById("app").innerHTML=`

        <div class="page">

            <div class="card">

                <div class="logo">
                    DreamWall
                </div>

                <h1>
                    You're in! 🎉
                </h1>

                <div class="account">

                    <b>
                        ✓ Successfully signed in
                    </b>

                    <p class="small">
                        ${escapeHTML(
                            currentUser.email || ""
                        )}
                    </p>

                </div>

                <br>

                <button
                    class="primary"
                    onclick="openProfile()"
                >
                    Continue to DreamWall
                </button>

                <button
                    class="secondary"
                    onclick="logout()"
                >
                    Sign out
                </button>

            </div>

        </div>
    `;
}


/* =========================================================
   PROFILE
   ========================================================= */

async function openProfile(){

    const result =
        await client
            .from("profiles")
            .select("*")
            .eq(
                "id",
                currentUser.id
            )
            .maybeSingle();

    if(result.error){

        displayMessage(
            result.error.message,
            "error"
        );

        return;
    }

    if(result.data){

        showMainApp(
            result.data
        );

        return;
    }


    /*
     If the profile doesn't exist,
     create it now.
    */

    showProfileSetup();
}


/* =========================================================
   PROFILE SETUP
   ========================================================= */

function showProfileSetup(){

    document.getElementById("app").innerHTML=`

        <div class="page">

            <div class="card">

                <div class="logo">
                    DreamWall
                </div>

                <h1>
                    Finish your profile ✨
                </h1>

                <form id="profileForm">

                    <input
                        id="profileName"
                        class="field"
                        placeholder="Your name"
                        required
                    >

                    <input
                        id="profileUsername"
                        class="field"
                        placeholder="Choose a username"
                        minlength="3"
                        maxlength="30"
                        required
                    >

                    <input
                        id="profileAvatar"
                        class="field"
                        type="url"
                        placeholder="Profile picture URL (optional)"
                    >

                    <button
                        class="primary"
                        type="submit"
                    >
                        Save profile
                    </button>

                </form>

                <div
                    id="message"
                    class="message"
                ></div>

            </div>

        </div>
    `;


    document
        .getElementById(
            "profileForm"
        )
        .addEventListener(
            "submit",
            saveProfile
        );
}


/* =========================================================
   SAVE PROFILE
   ========================================================= */

async function saveProfile(event){

    event.preventDefault();

    const name =
        document.getElementById(
            "profileName"
        ).value.trim();

    const username =
        document.getElementById(
            "profileUsername"
        ).value
        .trim()
        .toLowerCase()
        .replace(/\s+/g,"_");

    const avatar =
        document.getElementById(
            "profileAvatar"
        ).value.trim();


    /*
     Check username first.
    */

    const usernameCheck =
        await client
            .from("profiles")
            .select("id")
            .eq(
                "username",
                username
            )
            .maybeSingle();

    if(usernameCheck.error){

        displayMessage(
            usernameCheck.error.message,
            "error"
        );

        return;
    }

    if(usernameCheck.data){

        displayMessage(
            "That username is already taken.",
            "error"
        );

        return;
    }


    const result =
        await client
            .from("profiles")
            .insert({

                id:currentUser.id,

                real_name:name,

                username:username,

                avatar_url:avatar,

                account_type:"real"

            });


    if(result.error){

        displayMessage(
            result.error.message,
            "error"
        );

        return;
    }


    showMainApp({

        id:currentUser.id,

        real_name:name,

        username:username,

        avatar_url:avatar,

        account_type:"real"

    });
}


/* =========================================================
   MAIN APP
   ========================================================= */

function showMainApp(profile){

    document.getElementById("app").innerHTML=`

        <div class="page">

            <div class="card">

                <div class="logo">
                    DreamWall
                </div>

                <h1>
                    Welcome, @${escapeHTML(
                        profile.username
                    )}! ✨
                </h1>

                <div class="account">

                    <b>
                        ✓ Your account works!
                    </b>

                    <p class="small">
                        Email:
                        ${escapeHTML(
                            currentUser.email
                        )}
                    </p>

                    <p class="small">
                        Username:
                        @${escapeHTML(
                            profile.username
                        )}
                    </p>

                </div>

                <br>

                <button
                    class="primary"
                    onclick="alert('Your DreamWall feed will be added here next!')"
                >
                    Open DreamWall
                </button>

                <button
                    class="secondary"
                    onclick="logout()"
                >
                    Sign out
                </button>

            </div>

        </div>
    `;
}


/* =========================================================
   LOGOUT
   ========================================================= */

async function logout(){

    if(client){

        await client.auth.signOut();

    }

    currentUser=null;

    showLogin();
}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================================================
   START
   ========================================================= */

start();

</script>

</body>
</html>
