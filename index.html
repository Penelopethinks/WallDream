<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DreamWall</title>

<style>
:root{
  --lav:#c9a4ff;
  --mint:#9ee8d5;
  --pink:#ff9fc5;
  --blue:#a9c9ff;
  --bg:#faf8fc;
  --card:#ffffff;
  --text:#30283a;
  --muted:#8b8194;
  --line:#e8dfef;
  --danger:#e85b83;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow-x:hidden;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

/* TOP BAR */

.top{
  height:70px;
  position:sticky;
  top:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  padding:0 24px;
  background:#ffffffee;
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line);
}

.logo{
  font-size:28px;
  font-weight:900;
  letter-spacing:-1px;
  background:linear-gradient(
    90deg,
    var(--lav),
    var(--pink),
    var(--mint)
  );
  -webkit-background-clip:text;
  color:transparent;
}

.search{
  width:min(420px,40%);
  border:0;
  outline:0;
  background:#f2edf6;
  padding:12px 18px;
  border-radius:30px;
}

.topButtons{
  display:flex;
  gap:8px;
}

.iconButton{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:#f0eaf5;
  font-size:19px;
}

/* LAYOUT */

.layout{
  max-width:1250px;
  margin:auto;
  display:grid;
  grid-template-columns:190px minmax(0,650px) 240px;
  gap:25px;
  padding:25px 18px 80px;
}

.sidebar{
  position:sticky;
  top:95px;
  height:max-content;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.nav button{
  border:0;
  background:transparent;
  text-align:left;
  padding:14px;
  border-radius:15px;
  font-weight:800;
  color:var(--text);
}

.nav button:hover,
.nav button.active{
  background:#eee5f6;
  color:#8051b5;
}

/* CARDS */

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:23px;
  box-shadow:0 10px 35px #5b436e10;
  overflow:hidden;
  margin-bottom:18px;
}

.empty{
  text-align:center;
  padding:75px 25px;
  color:var(--muted);
}

.emptyIcon{
  font-size:60px;
}

.primary{
  border:0;
  border-radius:13px;
  padding:11px 17px;
  background:linear-gradient(
    135deg,
    var(--lav),
    var(--pink)
  );
  color:white;
  font-weight:800;
}

.secondary{
  border:1px solid var(--line);
  border-radius:13px;
  padding:10px 15px;
  background:white;
  color:var(--text);
  font-weight:700;
}

.danger{
  border:0;
  border-radius:11px;
  padding:8px 11px;
  background:#fff0f4;
  color:var(--danger);
  font-weight:800;
}

.muted{
  color:var(--muted);
}

/* AVATARS */

.avatar{
  width:46px;
  height:46px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid var(--lav);
  cursor:pointer;
}

.bigAvatar{
  width:105px;
  height:105px;
  border-radius:50%;
  object-fit:cover;
  border:6px solid white;
  margin-top:-52px;
}

/* STORIES */

.stories{
  display:flex;
  gap:17px;
  overflow-x:auto;
  padding:5px 2px 20px;
}

.story{
  min-width:70px;
  text-align:center;
  font-size:11px;
  font-weight:800;
}

.storyRing{
  width:64px;
  height:64px;
  padding:3px;
  border-radius:50%;
  margin:auto auto 5px;
  background:#ddd;
}

.storyRing.new{
  background:linear-gradient(
    135deg,
    var(--lav),
    var(--pink),
    var(--mint)
  );
}

.storyRing img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
  border:3px solid white;
}

/* POSTS */

.postHeader{
  display:flex;
  align-items:center;
  gap:11px;
  padding:14px;
}

.postInfo{
  flex:1;
}

.postInfo small{
  display:block;
  color:var(--muted);
  margin-top:3px;
}

.badge{
  display:inline-block;
  font-size:10px;
  color:white;
  border-radius:8px;
  padding:3px 6px;
  margin-left:6px;
  vertical-align:middle;
}

.realBadge{
  background:#7563e7;
}

.aiBadge{
  background:#a268c0;
}

.wallpaper{
  position:relative;
  aspect-ratio:9/14;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

.wallpaperContent{
  position:relative;
  z-index:5;
  text-align:center;
  padding:30px;
  max-width:90%;
}

.wallpaperTitle{
  font-size:50px;
  font-weight:900;
  line-height:.95;
  word-break:break-word;
}

.wallpaperSubtitle{
  margin-top:13px;
  font-size:15px;
  word-break:break-word;
}

.decor{
  position:absolute;
  z-index:3;
  user-select:none;
}

.glow{
  position:absolute;
  border-radius:50%;
  background:#ffffff40;
  filter:blur(3px);
}

.glow.one{
  width:280px;
  height:280px;
  top:-90px;
  right:-80px;
}

.glow.two{
  width:210px;
  height:210px;
  bottom:-80px;
  left:-70px;
}

.postActions{
  display:flex;
  gap:16px;
  padding:11px 15px;
}

.postActions button{
  border:0;
  background:none;
  font-size:23px;
}

.liked{
  color:#ff4f94;
}

.postBody{
  padding:0 15px 15px;
}

.comment{
  font-size:14px;
  margin-top:7px;
}

.commentBox{
  display:flex;
  border-top:1px solid var(--line);
  padding:10px 13px;
}

.commentBox input{
  flex:1;
  border:0;
  outline:0;
}

.commentBox button{
  border:0;
  background:none;
  color:#8051b5;
  font-weight:800;
}

/* RIGHT SIDEBAR */

.sideCard{
  background:white;
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  margin-bottom:15px;
}

/* PROFILE */

.profileBanner{
  height:160px;
  background:linear-gradient(
    135deg,
    var(--lav),
    var(--pink),
    var(--mint)
  );
}

.profileHeader{
  text-align:center;
  padding-bottom:20px;
}

.stats{
  display:flex;
  justify-content:center;
  gap:45px;
  margin:20px;
}

.stats strong{
  display:block;
  font-size:21px;
}

.stats span{
  color:var(--muted);
  font-size:10px;
}

.profileGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  padding:12px;
}

.profileGridItem{
  aspect-ratio:1;
  overflow:hidden;
  border-radius:11px;
}

.profileGridItem .wallpaper{
  height:100%;
  min-height:0;
}

.profileGridItem .wallpaperTitle{
  font-size:18px;
}

/* PEOPLE */

.peopleGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.person{
  display:flex;
  align-items:center;
  gap:11px;
  border:1px solid var(--line);
  border-radius:17px;
  padding:13px;
}

.personGrow{
  flex:1;
}

/* MODAL */

.modalBackground{
  position:fixed;
  inset:0;
  z-index:500;
  display:none;
  align-items:center;
  justify-content:center;
  background:#30203b88;
  padding:18px;
}

.modalBackground.open{
  display:flex;
}

.modal{
  width:min(900px,100%);
  max-height:94vh;
  overflow:auto;
  background:white;
  border-radius:26px;
  padding:24px;
}

.modalHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.close{
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#f0eaf5;
  font-size:20px;
}

/* FORM */

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin:10px 0;
}

.field label{
  font-size:12px;
  font-weight:800;
}

.field input,
.field textarea,
.field select{
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
  outline:none;
  background:white;
}

.field textarea{
  min-height:85px;
  resize:vertical;
}

.fields{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.full{
  grid-column:1/-1;
}

/* CREATOR */

.creatorTabs{
  display:flex;
  gap:7px;
  overflow-x:auto;
  margin-bottom:18px;
}

.creatorTabs button{
  border:0;
  background:#f1ebf6;
  border-radius:12px;
  padding:9px 13px;
  font-weight:800;
  white-space:nowrap;
}

.creatorTabs button.active{
  background:var(--lav);
  color:white;
}

.creatorPanel{
  display:none;
}

.creatorPanel.active{
  display:block;
}

.creatorLayout{
  display:grid;
  grid-template-columns:1fr 350px;
  gap:20px;
}

.creatorPreview{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:570px;
  background:#f2edf7;
  border-radius:20px;
  padding:20px;
}

.previewPhone{
  width:min(330px,90%);
  aspect-ratio:9/16;
  border-radius:27px;
  overflow:hidden;
  box-shadow:0 20px 50px #3b2c4a22;
}

.controlGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.paletteGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.paletteButton{
  height:58px;
  border:0;
  border-radius:13px;
  color:white;
  font-weight:800;
  text-shadow:0 1px 5px #0006;
}

.emojiGrid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
}

.emojiGrid button{
  border:1px solid var(--line);
  background:white;
  border-radius:10px;
  padding:7px;
  font-size:20px;
}

.range{
  width:100%;
}

/* MESSAGES */

.messageList{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.messagePerson{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  border:1px solid var(--line);
  border-radius:15px;
}

/* TOAST */

.toast{
  position:fixed;
  z-index:1000;
  bottom:25px;
  left:50%;
  transform:translate(-50%,120px);
  background:#30283a;
  color:white;
  padding:12px 19px;
  border-radius:25px;
  transition:.25s;
}

.toast.show{
  transform:translate(-50%,0);
}

/* MOBILE */

@media(max-width:1000px){

  .layout{
    grid-template-columns:70px minmax(0,680px);
    justify-content:center;
  }

  .right{
    display:none;
  }

  .nav button span:not(.icon){
    display:none;
  }
}

@media(max-width:700px){

  .top{
    padding:0 12px;
  }

  .search{
    display:none;
  }

  .layout{
    display:block;
    padding:15px 9px 80px;
  }

  .sidebar{
    position:fixed;
    z-index:200;
    bottom:0;
    left:0;
    right:0;
    top:auto;
    height:62px;
    background:white;
    border-top:1px solid var(--line);
  }

  .nav{
    height:100%;
    flex-direction:row;
    align-items:center;
    justify-content:space-around;
  }

  .nav button{
    padding:8px;
  }

  .creatorLayout{
    grid-template-columns:1fr;
  }

  .creatorPreview{
    min-height:450px;
  }

  .fields,
  .controlGrid,
  .peopleGrid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .modal{
    padding:16px;
  }
}
</style>
</head>

<body>

<header class="top">

  <div class="logo">
    DreamWall
  </div>

  <input
    id="search"
    class="search"
    placeholder="Search people and wallpapers..."
    oninput="searchDreamWall()"
  >

  <div class="topButtons">

    <button
      class="iconButton"
      onclick="messages()">
      💬
    </button>

    <button
      class="iconButton"
      onclick="openCreator()">
      ＋
    </button>

    <button
      class="iconButton"
      onclick="profile()">
      ●
    </button>

  </div>

</header>

<div class="layout">

  <aside class="sidebar">

    <nav class="nav">

      <button
        class="active"
        onclick="home()">
        <span class="icon">⌂</span>
        <span> Home</span>
      </button>

      <button onclick="people()">
        <span class="icon">👥</span>
        <span> People</span>
      </button>

      <button onclick="explore()">
        <span class="icon">⌕</span>
        <span> Explore</span>
      </button>

      <button onclick="openCreator()">
        <span class="icon">＋</span>
        <span> Create</span>
      </button>

      <button onclick="messages()">
        <span class="icon">💬</span>
        <span> Messages</span>
      </button>

      <button onclick="profile()">
        <span class="icon">●</span>
        <span> Profile</span>
      </button>

    </nav>

  </aside>

  <main id="main"></main>

  <aside class="right">

    <div class="sideCard">

      <b>DreamWall</b>

      <p class="muted">
        A wallpaper community where people can
        create, share, discover, and remix wallpapers.
      </p>

    </div>

    <div class="sideCard">

      <b>Your account</b>

      <p
        id="accountSide"
        class="muted">
        No profile yet.
      </p>

      <button
        class="primary"
        onclick="editProfile()">
        Edit profile
      </button>

    </div>

  </aside>

</div>

<div
  id="modalBackground"
  class="modalBackground">

  <div
    id="modal"
    class="modal">
  </div>

</div>

<div
  id="toast"
  class="toast">
</div>

<script>

/* =====================================================
   DREAMWALL DATA
===================================================== */

const STORAGE_KEY="dreamwall_clean_v2";

let app=JSON.parse(
  localStorage.getItem(STORAGE_KEY)||"null"
);

if(!app){

  app={
    me:null,
    people:[],
    posts:[],
    messages:[],
    drafts:[]
  };

  save();
}

function save(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(app)
  );
}

function uid(prefix="id"){

  return prefix+
    "_" +
    Date.now()+
    "_" +
    Math.random()
      .toString(36)
      .slice(2,8);
}

function escapeHTML(value){

  return String(value??"")
    .replace(/[&<>"']/g,function(char){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[char];

    });
}

function toast(message){

  const t=document.getElementById("toast");

  t.textContent=message;

  t.classList.add("show");

  setTimeout(()=>{
    t.classList.remove("show");
  },2200);
}

function closeModal(){

  document
    .getElementById("modalBackground")
    .classList.remove("open");
}

document
  .getElementById("modalBackground")
  .addEventListener(
    "click",
    e=>{
      if(e.target===e.currentTarget){
        closeModal();
      }
    }
  );

/* =====================================================
   PROFILE
===================================================== */

function editProfile(){

  const p=app.me||{

    id:uid("user"),

    username:"",

    realName:"",

    password:"",

    avatar:"",

    bio:"",

    accent:"#c9a4ff",

    accent2:"#9ee8d5",

    followers:0,

    following:0,

    type:"real"

  };

  showModal(`

    <div class="modalHeader">

      <h2>
        ${app.me
          ?"Edit profile"
          :"Create your DreamWall profile"}
      </h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>

    <p class="muted">
      Choose a unique username.
      Your username cannot be your real name.
    </p>

    <div class="fields">

      <div class="field">

        <label>
          Username
        </label>

        <input
          id="profileUsername"
          value="${escapeHTML(p.username)}"
          placeholder="dreamy_creator">

      </div>

      <div class="field">

        <label>
          Real name
        </label>

        <input
          id="profileRealName"
          value="${escapeHTML(p.realName)}"
          placeholder="Your name">

      </div>

      <div class="field">

        <label>
          Password
        </label>

        <input
          id="profilePassword"
          type="password"
          value="${escapeHTML(p.password)}"
          placeholder="Password">

      </div>

      <div class="field">

        <label>
          Profile picture URL
        </label>

        <input
          id="profileAvatar"
          value="${escapeHTML(p.avatar)}"
          placeholder="Paste an image URL">

      </div>

      <div class="field full">

        <label>
          Bio
        </label>

        <textarea
          id="profileBio"
          placeholder="Tell people about your wallpaper style...">${escapeHTML(p.bio)}</textarea>

      </div>

      <div class="field">

        <label>
          Main color
        </label>

        <input
          id="profileColor"
          type="color"
          value="${p.accent}">

      </div>

      <div class="field">

        <label>
          Second color
        </label>

        <input
          id="profileColor2"
          type="color"
          value="${p.accent2}">

      </div>

    </div>

    <br>

    <button
      class="primary"
      onclick="saveProfile()">

      ${app.me
        ?"Save changes"
        :"Create profile"}

    </button>

  `);
}

function saveProfile(){

  const username=
    document
      .getElementById("profileUsername")
      .value
      .trim();

  const realName=
    document
      .getElementById("profileRealName")
      .value
      .trim();

  const password=
    document
      .getElementById("profilePassword")
      .value;

  if(!username||!realName||!password){

    toast(
      "Please fill out all required fields."
    );

    return;
  }

  if(username.toLowerCase()===
     realName.toLowerCase()){

    toast(
      "Your username cannot be your real name."
    );

    return;
  }

  const duplicate=
    app.people.find(
      p=>
        p.username.toLowerCase()===
        username.toLowerCase()
        &&
        p.id!==app.me?.id
    );

  if(duplicate){

    toast(
      "That username is already taken."
    );

    return;
  }

  const person={

    id:app.me?.id||uid("user"),

    username,

    realName,

    password,

    avatar:
      document
        .getElementById("profileAvatar")
        .value
        .trim(),

    bio:
      document
        .getElementById("profileBio")
        .value
        .trim(),

    accent:
      document
        .getElementById("profileColor")
        .value,

    accent2:
      document
        .getElementById("profileColor2")
        .value,

    followers:app.me?.followers||0,

    following:app.me?.following||0,

    type:"real",

    new:false

  };

  const index=
    app.people.findIndex(
      p=>p.id===person.id
    );

  if(index>=0){

    app.people[index]=person;

  }else{

    app.people.push(person);

  }

  app.me=person;

  save();

  applyTheme();

  closeModal();

  toast("Profile saved!");

  profile();
}

function applyTheme(){

  if(!app.me)return;

  document.documentElement
    .style
    .setProperty(
      "--lav",
      app.me.accent
    );

  document.documentElement
    .style
    .setProperty(
      "--mint",
      app.me.accent2
    );
}

/* =====================================================
   AVATAR
===================================================== */

function avatarFor(person){

  if(person&&person.avatar){

    return escapeHTML(person.avatar);

  }

  return "data:image/svg+xml,"+
    encodeURIComponent(`

      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="100"
        height="100">

        <rect
          width="100"
          height="100"
          fill="#eee7f5"/>

        <text
          x="50"
          y="61"
          text-anchor="middle"
          font-size="42">
          ☁
        </text>

      </svg>

    `);
}

/* =====================================================
   HOME
===================================================== */

function home(){

  setActiveNav(0);

  applyTheme();

  const main=
    document.getElementById("main");

  let html=`

    <div class="stories">

      <div
        class="story"
        onclick="profile()">

        <div class="storyRing">

          <img
            src="${avatarFor(app.me)}">

        </div>

        You

      </div>

  `;

  app.people
    .filter(
      p=>p.id!==app.me?.id
    )
    .forEach(p=>{

      html+=`

        <div
          class="story"
          onclick="viewPerson('${p.id}')">

          <div
            class="storyRing ${p.new?"new":""}">

            <img
              src="${avatarFor(p)}">

          </div>

          ${escapeHTML(p.username)}

        </div>

      `;

    });

  html+=`
    </div>
  `;

/* =====================================================

===================================================== */

function renderWallpaper(post){

  return `

    <div
      class="wallpaper"
      style="
        background:${post.background};
        color:${post.color};
        filter:
          brightness(${post.brightness||100}%)
          contrast(${post.contrast||100}%)
          blur(${post.blur||0}px);
      "
    >

      <div class="glow one"></div>

      <div class="glow two"></div>

      ${
        (post.decorations||[])
          .map(
            d=>`

              <div
                class="decor"
                style="
                  left:${d.x}%;
                  top:${d.y}%;
                  font-size:${d.size}px;
                  opacity:${d.opacity};
                  color:${d.color};
                "
              >
                ${escapeHTML(d.symbol)}
              </div>

            `
          )
          .join("")
      }

      <div class="wallpaperContent">

        <div
          class="wallpaperTitle"
          style="
            font-family:${post.font||"Arial"};
            font-size:${post.titleSize||50}px;
          "
        >
          ${escapeHTML(post.title)}
        </div>

        <div
          class="wallpaperSubtitle"
          style="
            font-family:${post.font||"Arial"};
            font-size:${post.subtitleSize||15}px;
          "
        >
          ${escapeHTML(post.subtitle)}
        </div>

      </div>

    </div>

  `;
}

      <div class="postHeader">

/* =====================================================
   POST ACTIONS
===================================================== */

function likePost(id){

  const post=
    app.posts.find(
      p=>p.id===id
    );

  if(!post)return;

  if(post.liked){

    post.likes=
      Math.max(
        0,
        post.likes-1
      );

    post.liked=false;

  }else{

    post.likes++;

    post.liked=true;

  }

  save();

  home();
}

function commentPost(id){

  const input=
    document.getElementById(
      "comment-"+id
    );

  if(input){
    input.focus();
  }
}

function submitComment(id){

  if(!app.me){

    toast(
      "Create a profile first."
    );

    editProfile();

    return;
  }

  const input=
    document.getElementById(
      "comment-"+id
    );

  if(!input)return;

  const text=
    input.value.trim();

  if(!text)return;

  const post=
    app.posts.find(
      p=>p.id===id
    );

  if(!post)return;

  post.comments.push({

    user:app.me.username,

    text

  });

  save();

  home();
}

function deletePost(id){

  const post=
    app.posts.find(
      p=>p.id===id
    );

  if(
    !post||
    post.owner!==app.me?.id
  ){

    toast(
      "You can only delete your own wallpapers."
    );

    return;
  }

  if(
    !confirm(
      "Delete this wallpaper?"
    )
  ){

    return;
  }

  app.posts=
    app.posts.filter(
      p=>p.id!==id
    );

  save();

  toast(
    "Wallpaper deleted."
  );

  profile();
}

function sharePost(id){

  const post=
    app.posts.find(
      p=>p.id===id
    );

  if(!post)return;

  const shareText=
    "Check out this wallpaper on DreamWall: "+
    post.title;

  if(navigator.share){

    navigator.share({

      title:"DreamWall",

      text:shareText

    }).catch(()=>{});

  }else{

    if(
      navigator.clipboard
    ){

      navigator.clipboard
        .writeText(
          shareText
        );

    }

    toast(
      "Share text copied!"
    );

  }
}

function remixPost(id){

  const post=
    app.posts.find(
      p=>p.id===id
    );

  if(!post)return;

  openCreator(post);

  toast(
    "Wallpaper loaded for remixing!"
  );
}

          id="creator-text"
          class="creatorPanel">

          <h3>
            Text
          </h3>

          <div class="field">

            <label>
              Title
            </label>

            <input
              value="${escapeHTML(
                creatorState.title
              )}"
              oninput="
                creatorChange(
                  'title',
                  this.value
                )
              ">

          </div>

          <div class="field">

            <label>
              Subtitle
            </label>

            <textarea
              oninput="
                creatorChange(
                  'subtitle',
                  this.value
                )
              ">${escapeHTML(
                creatorState.subtitle
              )}</textarea>

          </div>

          <div class="controlGrid">

            <div class="field">

              <label>
                Title size
              </label>

              <input
                class="range"
                type="range"
                min="20"
                max="100"
                value="${creatorState.titleSize}"
                oninput="
                  creatorChange(
                    'titleSize',
                    this.value
                  )
                ">

            </div>

            <div class="field">

              <label>
                Subtitle size
              </label>

              <input
                class="range"
                type="range"
                min="8"
                max="35"
                value="${creatorState.subtitleSize}"
                oninput="
                  creatorChange(
                    'subtitleSize',
                    this.value
                  )
                ">

            </div>

            <div class="field">

              <label>
                Text color
              </label>

              <input
                type="color"
                value="${creatorState.textColor}"
                onchange="
                  creatorChange(
                    'textColor',
                    this.value
                  )
                ">

            </div>

            <div class="field">

              <label>
                Font
              </label>

              <select
                onchange="
                  creatorChange(
                    'font',
                    this.value
                  )
                ">

                <option>Arial</option>
                <option>Arial Black</option>
                <option>Georgia</option>
                <option>Trebuchet MS</option>
                <option>Courier New</option>
                <option>Verdana</option>
                <option>Times New Roman</option>

              </select>

            </div>

          </div>

        </div>

        <div
          id="creator-decor"
          class="creatorPanel">

          <h3>
            Decorations
          </h3>

          <p class="muted">
            Add as many decorations as you want.
          </p>

          <div class="emojiGrid">

            ${
              emojiList
                .map(
                  e=>`

                    <button
                      onclick="
                        addCreatorDecoration('${e}')
                      ">

                      ${e}

                    </button>

                  `
                )
                .join("")
            }

          </div>

          <div class="controlGrid">

            <div class="field">

              <label>
                Size
              </label>

              <input
                class="range"
                type="range"
                min="15"
                max="100"
                value="${creatorState.decorationSize}"
                oninput="
                  creatorChange(
                    'decorationSize',
                    this.value
                  )
                ">

            </div>

            <div class="field">

              <label>
                Opacity
              </label>

              <input
                class="range"
                type="range"
                min="10"
                max="100"
                value="${creatorState.decorationOpacity*100}"
                oninput="
                  creatorChange(
                    'decorationOpacity',
                    this.value/100
                  )
                ">

            </div>

            <div class="field">

              <label>
                Decoration color
              </label>

              <input
                type="color"
                value="${creatorState.decorationColor}"
                onchange="
                  creatorChange(
                    'decorationColor',
                    this.value
                  )
                ">

            </div>

          </div>

          <button
            class="secondary"
            onclick="
              creatorState.decorations=[];
              renderCreator()
            ">

            Clear decorations

          </button>

        </div>

        <div
          id="creator-effects"
          class="creatorPanel">

          <h3>
            Effects
          </h3>

          <div class="field">

            <label>
              Brightness
            </label>

            <input
              class="range"
              type="range"
              min="60"
              max="140"
              value="${creatorState.brightness}"
              oninput="
                creatorChange(
                  'brightness',
                  this.value
                )
              ">

          </div>

          <div class="field">

            <label>
              Contrast
            </label>

            <input
              class="range"
              type="range"
              min="70"
              max="140"
              value="${creatorState.contrast}"
              oninput="
                creatorChange(
                  'contrast',
                  this.value
                )
              ">

          </div>

          <div class="field">

            <label>
              Blur
            </label>

            <input
              class="range"
              type="range"
              min="0"
              max="8"
              value="${creatorState.blur}"
              oninput="
                creatorChange(
                  'blur',
                  this.value
                )
              ">

          </div>

          <div class="field">

            <label>
              Pattern
            </label>

            <select
              onchange="
                creatorChange(
                  'pattern',
                  this.value
                )
              ">

              <option value="none">
                None
              </option>

              <option value="dots">
                Dots
              </option>

              <option value="grid">
                Grid
              </option>

              <option value="stripes">
                Stripes
              </option>

              <option value="checker">
                Checkerboard
              </option>

              <option value="waves">
                Waves
              </option>

            </select>

          </div>

        </div>

        <div
          id="creator-layout"
          class="creatorPanel">

          <h3>
            Layout
          </h3>

          <div class="field">

            <label>
              Wallpaper shape
            </label>

            <select
              onchange="
                creatorChange(
                  'ratio',
                  this.value
                )
              ">

              <option value="9/16">
                Phone 9:16
              </option>

              <option value="3/4">
                Classic 3:4
              </option>

              <option value="1/1">
                Square
              </option>

            </select>

          </div>

          <p class="muted">
            You can create wallpapers with or
            without text.
          </p>

        </div>

      </div>

    </div>

    <hr
      style="
        border:0;
        border-top:1px solid var(--line);
        margin:22px 0
      ">

    <div
      style="
        display:flex;
        gap:10px;
        flex-wrap:wrap
      ">

      <button
        class="secondary"
        onclick="saveDraft()">

        💾 Save draft

      </button>

      <button
        class="primary"
        onclick="publishWallpaper()">

        Publish wallpaper

      </button>

    </div>

  `);

  renderCreator();
}

function paletteButton(
  name,
  a,
  b,
  c
){

  return `

    <button
      class="paletteButton"
      style="
        background:
          linear-gradient(
            135deg,
            ${a},
            ${b},
            ${c}
          )
      "
      onclick="
        creatorState.color1='${a}';
        creatorState.color2='${b}';
        creatorState.color3='${c}';
        renderCreator()
      ">

      ${name}

    </button>

  `;
}

function creatorTab(
  id,
  button
){

  document
    .querySelectorAll(".creatorPanel")
    .forEach(
      panel=>
        panel.classList.remove("active")
    );

  document
    .querySelectorAll(".creatorTabs button")
    .forEach(
      b=>
        b.classList.remove("active")
    );

  document
    .getElementById(
      "creator-"+id
    )
    .classList.add("active");

  button.classList.add("active");
}

function creatorChange(
  key,
  value
){

  creatorState[key]=value;

  renderCreator();
}

function addCreatorDecoration(
  symbol
){

  creatorState.decorations.push({

    symbol,

    x:
      Math.random()*75+8,

    y:
      Math.random()*75+8,

    size:
      Number(
        creatorState.decorationSize
      ),

    color:
      creatorState.decorationColor,

    opacity:
      Number(
        creatorState.decorationOpacity
      )

  });

  renderCreator();
}

function getCreatorBackground(){

  const s=creatorState;

  if(s.backgroundType==="solid"){

    return s.color1;

  }

  if(s.backgroundType==="radial"){

    return `
      radial-gradient(
        circle at 50% 35%,
        ${s.color1},
        ${s.color2},
        ${s.color3}
      )
    `;

  }

  if(s.backgroundType==="conic"){

    return `
      conic-gradient(
        from ${s.angle}deg,
        ${s.color1},
        ${s.color2},
        ${s.color3},
        ${s.color1}
      )
    `;

  }

  return `
    linear-gradient(
      ${s.angle}deg,
      ${s.color1},
      ${s.color2},
      ${s.color3}
    )
  `;
}

function getPattern(){

  const p=
    creatorState.pattern;

  if(p==="none")return "";

  if(p==="dots"){

    return `
      radial-gradient(
        rgba(255,255,255,.28) 2px,
        transparent 2px
      ) 0 0/18px 18px
    `;

  }

  if(p==="grid"){

    return `
      linear-gradient(
        rgba(255,255,255,.18) 1px,
        transparent 1px
      ),
      linear-gradient(
        90deg,
        rgba(255,255,255,.18) 1px,
        transparent 1px
      )
    `;

  }

  if(p==="stripes"){

    return `
      repeating-linear-gradient(
        135deg,
        rgba(255,255,255,.18) 0 10px,
        transparent 10px 22px
      )
    `;

  }

  if(p==="checker"){

    return `
      conic-gradient(
        rgba(255,255,255,.15) 25%,
        transparent 0 50%,
        rgba(255,255,255,.15) 0 75%,
        transparent 0
      ) 0 0/34px 34px
    `;

  }

  return `
    repeating-radial-gradient(
      ellipse at center,
      rgba(255,255,255,.12) 0 2px,
      transparent 2px 22px
    )
  `;
}

function renderCreator(){

  const preview=
    document.getElementById(
      "creatorPreview"
    );

  if(!preview)return;

  const background=
    getCreatorBackground();

  const pattern=
    getPattern();

  preview.style.backgroundImage=
    [
      pattern,
      background
    ]
    .filter(Boolean)
    .join(",");

  preview.style.filter=`

    brightness(
      ${creatorState.brightness}%
    )

    contrast(
      ${creatorState.contrast}%
    )

    blur(
      ${creatorState.blur}px
    )

  `;

  preview.style.aspectRatio=
    creatorState.ratio;

  preview.innerHTML=`

    <div class="glow one"></div>

    <div class="glow two"></div>

    ${
      creatorState.decorations
        .map(
          d=>`

            <div
              class="decor"
              style="
                left:${d.x}%;
                top:${d.y}%;
                font-size:${d.size}px;
                color:${d.color};
                opacity:${d.opacity};
              "
            >
              ${escapeHTML(d.symbol)}
            </div>

          `
        )
        .join("")
    }

    <div class="wallpaperContent">

      <div
        class="wallpaperTitle"
        style="
          color:${creatorState.textColor};
          font-family:${creatorState.font};
          font-size:${creatorState.titleSize}px;
        "
      >

        ${escapeHTML(
          creatorState.title
        )}

      </div>

      <div
        class="wallpaperSubtitle"
        style="
          color:${creatorState.textColor};
          font-family:${creatorState.font};
          font-size:${creatorState.subtitleSize}px;
        "
      >

        ${escapeHTML(
          creatorState.subtitle
        )}

      </div>

    </div>

  `;
}

/* =====================================================
   PUBLISH
===================================================== */

function publishWallpaper(){

  if(!app.me){

    toast(
      "Create your profile first."
    );

    return;
  }

  const post={

    id:uid("post"),

    owner:app.me.id,

    creator:app.me.username,

    realName:app.me.realName,

    avatar:app.me.avatar,

    type:"real",

    title:creatorState.title,

    subtitle:creatorState.subtitle,

    caption:
      "A wallpaper I made on DreamWall ✨",

    background:
      getCreatorBackground(),

    color:
      creatorState.textColor,

    font:
      creatorState.font,

    titleSize:
      Number(
        creatorState.titleSize
      ),

    subtitleSize:
      Number(
        creatorState.subtitleSize
      ),

    decorations:
      JSON.parse(
        JSON.stringify(
          creatorState.decorations
        )
      ),

    brightness:
      Number(
        creatorState.brightness
      ),

    contrast:
      Number(
        creatorState.contrast
      ),

    blur:
      Number(
        creatorState.blur
      ),

    likes:0,

    liked:false,

    comments:[],

    createdAt:
      new Date().toISOString()

  };

  app.posts.push(post);

  app.me.new=true;

  save();

  closeModal();

  toast(
    "Your wallpaper is live!"
  );

  home();
}

function saveDraft(){

  app.drafts.push({

    id:uid("draft"),

    owner:
      app.me?.id,

    design:
      JSON.parse(
        JSON.stringify(
          creatorState
        )
      ),

    savedAt:
      new Date().toISOString()

  });

  save();

  toast(
    "Draft saved!"
  );
}

/* =====================================================
   NAV
===================================================== */

function setActiveNav(index){

  document
    .querySelectorAll(".nav button")
    .forEach(
      (button,i)=>{

        button.classList.toggle(
          "active",
          i===index
        );

      }
    );
}

function updateAccountSide(){

  const element=
    document.getElementById(
      "accountSide"
    );

  if(!element)return;

  element.textContent=
    app.me
    ?
    "@"+app.me.username
    :
    "No profile yet.";
}

function showModal(html){

  document
    .getElementById("modal")
    .innerHTML=html;

  document
    .getElementById("modalBackground")
    .classList.add("open");
}

/* =====================================================
   START
===================================================== */

applyTheme();

home();

</script>
