<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DreamWall</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#40334d;background:linear-gradient(135deg,#fbf8ff,#effff9);min-height:100vh}button,input{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:10;background:#fffefeeF;border-bottom:1px solid #eadff1}.nav{max-width:1150px;margin:auto;min-height:64px;display:flex;align-items:center;gap:10px;padding:10px 16px}.brand{font-size:27px;font-weight:900;background:linear-gradient(90deg,#9b76ff,#ff8fbd,#79d9bf);-webkit-background-clip:text;color:transparent}.search{flex:1;max-width:330px;border:1px solid #e4d9eb;border-radius:22px;padding:10px 14px}.navbtn,.sidebtn{border:0;background:transparent;border-radius:12px;padding:10px;font-weight:700;color:#40334d}.navbtn:hover,.sidebtn:hover{background:#f3ecfa}.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#d9c5ff,#b9f1e0);font-weight:800;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.layout{max-width:1150px;margin:auto;display:grid;grid-template-columns:210px minmax(0,650px) 230px;gap:20px;padding:22px 16px}.panel,.post,.composer{background:#fff;border:1px solid #eadff1;border-radius:20px;box-shadow:0 10px 35px #4b2d5f0f}.panel{padding:14px;height:max-content}.sidebtn{width:100%;text-align:left}.sideprofile,.person{display:flex;align-items:center;gap:10px}.grow{flex:1}.muted{color:#8b7d95}.tiny{font-size:12px}.feedhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.stories{display:flex;gap:14px;overflow:auto;margin-bottom:10px}.story{text-align:center;min-width:68px;font-size:12px}.ring{padding:3px;border-radius:50%;background:linear-gradient(135deg,#ff78b4,#9b76ff,#65d9bd);width:62px;margin:auto}.ring .avatar{width:56px;height:56px;border:3px solid white}.post{overflow:hidden;margin-bottom:18px}.posthead{display:flex;align-items:center;gap:10px;padding:13px}.postuser{flex:1}.wall{aspect-ratio:1;display:grid;place-items:center;position:relative;overflow:hidden;text-align:center;padding:30px}.wallinner{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:1}.walltitle{font-weight:900;line-height:1.05;white-space:pre-wrap;word-break:break-word}.wallsub{margin-top:10px;white-space:pre-wrap}.decor{position:absolute;pointer-events:none}.postbody{padding:12px 15px}.actions{display:flex;gap:7px}.iconbtn{border:0;background:transparent;font-size:22px}.liked{color:#e85a91}.commentform{display:flex;gap:7px;margin-top:9px}.commentform input{flex:1;border:1px solid #eadff1;border-radius:18px;padding:9px}.commentform button,.primary{border:0;border-radius:12px;padding:10px 14px;background:linear-gradient(100deg,#9b76ff,#ff8fbd);color:white;font-weight:800}.secondary{border:1px solid #eadff1;border-radius:12px;padding:10px 14px;background:white;color:#40334d;font-weight:700}.composer{padding:18px}.field,.select,.textarea{width:100%;padding:11px;border:1px solid #e4d9eb;border-radius:12px;margin:5px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.label{font-size:12px;font-weight:800;margin-top:10px}.color{width:48px;height:40px}.range{width:100%}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.empty{text-align:center;padding:45px 20px;color:#8b7d95}.message{padding:12px;border-radius:12px;margin-top:10px}.error{background:#fff0f3;color:#a13d58}.success{background:#eafff7;color:#28745e}.modal{position:fixed;inset:0;background:#24182f88;display:grid;place-items:center;padding:18px;z-index:50}.modalbox{background:#fff;border-radius:20px;padding:20px;width:min(700px,100%);max-height:90vh;overflow:auto}.close{float:right;border:0;border-radius:50%;width:32px;height:32px}.chat{height:400px;overflow:auto;background:#faf8fc;padding:12px;border-radius:14px}.bubble{max-width:75%;padding:9px 12px;border-radius:15px;margin:7px 0}.mine{margin-left:auto;background:#e8ddff}.theirs{background:white;border:1px solid #eadff1}.toast{position:fixed;right:18px;bottom:18px;background:#40334d;color:white;padding:12px 16px;border-radius:12px;z-index:100}.profilehero{display:flex;gap:20px;align-items:center;padding:20px}.bigavatar{width:90px;height:90px;border-radius:50%;display:grid;place-items:center;background:#eadfff;font-size:28px;font-weight:900;overflow:hidden}.bigavatar img{width:100%;height:100%;object-fit:cover}.profileinfo{flex:1}.profileposts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 20px 20px}.profilethumb{aspect-ratio:1;overflow:hidden;border-radius:8px}.profilethumb .wall{height:100%}
@media(max-width:900px){.layout{grid-template-columns:1fr}.left,.right{display:none}.search{max-width:none}.wall{aspect-ratio:4/5}}
</style>
</head>
<body><div id="app"></div>
<script>
const SUPABASE_URL='https://kcybwrdtnlflevndmzfn.supabase.co';const SUPABASE_KEY='sb_publishable_XhOq8P5tdMgjWDKZEvgsgg_hcALWg48';const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let user=null,profile=null,people=[],posts=[],liked=new Set(),following=new Set(),pageName='home';
const esc=x=>String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const ini=p=>(p?.username||p?.real_name||'?').slice(0,1).toUpperCase();function av(p,b=false){let c=b?'bigavatar':'avatar';return p?.avatar_url?`<div class="${c}"><img src="${esc(p.avatar_url)}"></div>`:`<div class="${c}">${esc(ini(p))}</div>`}function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2500)}
function login(){document.getElementById('app').innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;padding:20px"><div class="panel" style="width:min(440px,100%);padding:30px"><div class="brand" style="font-size:40px;text-align:center">DreamWall</div><p class="muted" style="text-align:center">Create. Share. Dream. ✨</p><div id="auth"></div></div></div>`;authUI('login')}
function authUI(m){let s=m==='signup';document.getElementById('auth').innerHTML=`<h2 style="text-align:center">${s?'Create your account':'Welcome back'}</h2>${s?`<input id="name" class="field" placeholder="Your name"><input id="uname" class="field" placeholder="Username">`:''}<input id="email" class="field" type="email" placeholder="Email"><input id="pass" class="field" type="password" placeholder="Password"><button class="primary" style="width:100%;margin-top:8px" onclick="doAuth('${m}')">${s?'Create account':'Sign in'}</button><div id="authmsg"></div><button class="secondary" style="width:100%;margin-top:8px" onclick="authUI('${s?'login':'signup'}')">${s?'Already have an account? Sign in':'Create a new account'}</button>`}function authmsg(t,g=false){document.getElementById('authmsg').innerHTML=`<div class="message ${g?'success':'error'}">${esc(t)}</div>`}
async function doAuth(m){let email=document.getElementById('email').value.trim(),password=document.getElementById('pass').value;if(!email||!password)return authmsg('Enter your email and password.');if(m==='signup'){let name=document.getElementById('name').value.trim(),uname=document.getElementById('uname').value.trim().toLowerCase().replace(/\s+/g,'_');if(uname.length<3)return authmsg('Username needs at least 3 characters.');let q=await db.from('profiles').select('id').eq('username',uname).maybeSingle();if(q.error)return authmsg(q.error.message);if(q.data)return authmsg('That username is already taken.');let r=await db.auth.signUp({email,password});if(r.error)return authmsg(r.error.message);if(!r.data.session)return authmsg('Account created. If email confirmation is enabled, confirm your email, then sign in.',true);user=r.data.user;let p=await db.from('profiles').insert({id:user.id,username:uname,real_name:name,account_type:'real'});if(p.error)return authmsg(p.error.message);profile={id:user.id,username:uname,real_name:name,account_type:'real'};await load();render()}else{let r=await db.auth.signInWithPassword({email,password});if(r.error)return authmsg(r.error.message);user=r.data.user;await loadProfile();if(!profile)await fallback();await load();render()}}
async function loadProfile(){let r=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();profile=r.data}async function fallback(){let username='dreamer_'+user.id.slice(0,6);let r=await db.from('profiles').insert({id:user.id,username,real_name:'Dreamer',account_type:'real'});if(!r.error)profile={id:user.id,username,real_name:'Dreamer',account_type:'real'}}async function load(){let [p,w,l,f]=await Promise.all([db.from('profiles').select('*').order('created_at',{ascending:false}),db.from('wallpapers').select('*').order('created_at',{ascending:false}),db.from('likes').select('wallpaper_id').eq('user_id',user.id),db.from('follows').select('following_id').eq('follower_id',user.id)]);people=p.data||[];posts=w.data||[];liked=new Set((l.data||[]).map(x=>x.wallpaper_id));following=new Set((f.data||[]).map(x=>x.following_id))}
function nav(){return `<header class="top"><div class="nav"><div class="brand">DreamWall</div><input class="search" placeholder="Search creators" oninput="search(this.value)"><button class="navbtn" onclick="go('home')">Home</button><button class="navbtn" onclick="go('create')">＋ Create</button><button class="navbtn" onclick="go('people')">People</button><button class="navbtn" onclick="go('messages')">Messages</button><button class="navbtn" onclick="go('profile')">${av(profile)}</button></div></header>`}
function render(){document.getElementById('app').innerHTML=nav()+`<div class="layout"><aside class="left panel"><div class="sideprofile">${av(profile)}<div><b>@${esc(profile?.username)}</b><div class="tiny muted">${esc(profile?.real_name||'')}</div></div></div><hr><button class="sidebtn" onclick="go('home')">🏠 Home</button><button class="sidebtn" onclick="go('create')">🎨 Create wallpaper</button><button class="sidebtn" onclick="go('people')">👥 People</button><button class="sidebtn" onclick="go('messages')">💬 Messages</button><button class="sidebtn" onclick="go('profile')">👤 My profile</button><button class="sidebtn" onclick="logout()">↪ Sign out</button></aside><main id="main"></main><aside class="right panel"><b>Creators on DreamWall</b><div id="suggestions"></div></aside></div>`;go(pageName)}
async function go(n){pageName=n;await load();let m=document.getElementById('main');if(!m)return;if(n==='home')m.innerHTML=home();if(n==='create')m.innerHTML=create();if(n==='people')m.innerHTML=peoplePage();if(n==='profile')m.innerHTML=profilePage(profile);if(n==='messages')m.innerHTML=messagesPage();suggestions()}
function home(){let stories=people.filter(p=>p.id!==user.id).slice(0,12).map(p=>`<div class="story" onclick="openProfile('${p.id}')"><div class="ring">${av(p)}</div>@${esc(p.username)}</div>`).join('');return `<div class="feedhead"><div><h2 style="margin:0">Home</h2><span class="muted tiny">Real DreamWall posts</span></div><button class="primary" onclick="go('create')">＋ New wallpaper</button></div><div class="stories">${stories}</div>${posts.length?posts.map(postCard).join(''):`<div class="panel empty">No wallpapers yet.<br><br><button class="primary" onclick="go('create')">Create the first one ✨</button></div>`}`}
function wall(p){let dec=(p.decorations||[]).map(d=>`<span class="decor" style="left:${d.x||10}%;top:${d.y||10}%;font-size:${d.size||40}px">${esc(d.v)}</span>`).join('');return `<div class="wall" style="background:${p.background||'linear-gradient(135deg,#d9c6ff,#baf2e1)'};color:${p.text_color||'#493957'};filter:brightness(${p.brightness||100}%) contrast(${p.contrast||100}%);font-family:${esc(p.font||'Arial')}">${dec}<div class="wallinner"><div class="walltitle" style="font-size:${p.title_size||52}px">${esc(p.title||'DreamWall')}</div><div class="wallsub">${esc(p.subtitle||'')}</div></div></div>`}
function postCard(p){let o=people.find(x=>x.id===p.user_id)||{username:'creator'};return `<article class="post"><div class="posthead"><div onclick="openProfile('${o.id}')">${av(o)}</div><div class="postuser"><b>@${esc(o.username)} ${o.account_type==='ai'?'🤖':''}</b><span class="tiny muted">${o.account_type==='ai'?'AI creator':'Creator'}</span></div>${p.user_id===user.id?`<button onclick="del('${p.id')}">⋯</button>`:''}</div>${wall(p)}<div class="postbody"><div class="actions"><button class="iconbtn ${liked.has(p.id)?'liked':''}" onclick="like('${p.id}')">${liked.has(p.id)?'♥':'♡'}</button><button class="iconbtn" onclick="comments('${p.id}')">💬</button><button class="iconbtn" onclick="recreate('${p.id}')">🔄</button><button class="iconbtn" onclick="share('${p.id}')">↗</button></div><div>${esc(p.caption||'')}</div><div id="c-${p.id}"></div></div></article>`}
function create(){let d={title:'Your DreamWall',subtitle:'Make something beautiful',background:'linear-gradient(135deg,#d9c6ff,#baf2e1)',text_color:'#493957',font:'Arial',title_size:52,brightness:100,contrast:100,decorations:[]};return `<div class="composer"><div class="feedhead"><h2>Create a wallpaper</h2><button class="secondary" onclick="go('home')">Cancel</button></div><div id="preview">${wall(d)}</div><div class="grid2"><input id="ct" class="field" value="Your DreamWall" placeholder="Title"><input id="cs" class="field" value="Make something beautiful" placeholder="Subtitle"></div><textarea id="cap" class="textarea" placeholder="Caption"></textarea><select id="bg" class="select" onchange="preview()"><option value="gradient1">Lavender + Mint</option><option value="gradient2">Pink + Peach</option><option value="gradient3">Sky + Purple</option><option value="dark">Midnight</option><option value="custom">My colors</option></select><div class="colorrow"><input id="c1" type="color" value="#d9c6ff"><input id="c2" type="color" value="#baf2e1"><input id="tc" type="color" value="#493957" onchange="preview()"></div><div class="grid2"><select id="font" class="select" onchange="preview()"><option>Arial</option><option>Georgia</option><option>Trebuchet MS</option><option>Courier New</option><option>Impact</option><option>Verdana</option></select><select id="deco" class="select" onchange="preview()"><option value="none">No decorations</option><option value="sparkles">✨ Sparkles</option><option value="hearts">♥ Hearts</option><option value="stars">★ Stars</option><option value="flowers">🌸 Flowers</option><option value="mix">✨ ♥ ★ 🌸 Mix</option></select></div><div class="grid2"><div><div class="label">Title size</div><input id="size" class="range" type="range" min="24" max="90" value="52" oninput="preview()"></div><div><div class="label">Brightness</div><input id="bright" class="range" type="range" min="70" max="130" value="100" oninput="preview()"></div></div><div class="toolbar"><button class="primary" onclick="publish()">Publish wallpaper</button><button class="secondary" onclick="randomize()">🎲 Surprise me</button></div></div>`}
function preview(){let b=document.getElementById('bg').value,back={gradient1:'linear-gradient(135deg,#d9c6ff,#baf2e1)',gradient2:'linear-gradient(135deg,#ffb4d5,#ffd5a8)',gradient3:'linear-gradient(135deg,#9fdcff,#d4c2ff)',dark:'linear-gradient(135deg,#222,#704b9b)'}[b]||`linear-gradient(135deg,${c1.value},${c2.value})`;let vals={title:ct.value,subtitle:cs.value,background:back,text_color:tc.value,font:font.value,title_size:+size.value,brightness:+bright.value,decorations:decos()};document.getElementById('preview').innerHTML=wall(vals)}
function decos(){let v=deco.value,map={sparkles:['✨','✦','✧'],hearts:['♥','♡','♥'],stars:['★','☆','✦'],flowers:['🌸','✿','❀'],mix:['✨','♥','★','🌸']};return v==='none'?[]:(map[v]||[]).map((x,i)=>({v:x,x:10+i*25,y:10+(i%3)*25,size:30}))}
function randomize(){let a=[['#ffd0e3','#c8b3ff'],['#b7f2e1','#b8d9ff'],['#ffe29a','#ff9fc5'],['#25233a','#7653a8']][Math.floor(Math.random()*4)];c1.value=a[0];c2.value=a[1];bg.value='custom';ct.value=['Dream Big','Good Vibes','Create Magic','Stay Dreamy'][Math.floor(Math.random()*4)];deco.value=['sparkles','hearts','stars','flowers','mix'][Math.floor(Math.random()*5)];preview()}
async function publish(){let b=bg.value,back={gradient1:'linear-gradient(135deg,#d9c6ff,#baf2e1)',gradient2:'linear-gradient(135deg,#ffb4d5,#ffd5a8)',gradient3:'linear-gradient(135deg,#9fdcff,#d4c2ff)',dark:'linear-gradient(135deg,#222,#704b9b)'}[b]||`linear-gradient(135deg,${c1.value},${c2.value})`;let p={user_id:user.id,title:ct.value,subtitle:cs.value,caption:cap.value,background:back,text_color:tc.value,font:font.value,title_size:+size.value,brightness:+bright.value,contrast:100,decorations:decos()};let r=await db.from('wallpapers').insert(p);if(r.error)return toast(r.error.message);toast('Published! ✨');go('home')}
async function like(id){let r=liked.has(id)?await db.from('likes').delete().eq('user_id',user.id).eq('wallpaper_id',id):await db.from('likes').insert({user_id:user.id,wallpaper_id:id});if(r.error)return toast(r.error.message);go('home')}
async function comments(id){let r=await db.from('comments').select('*').eq('wallpaper_id',id).order('created_at');let html=(r.data||[]).map(c=>{let p=people.find(x=>x.id===c.user_id);return `<div class="tiny"><b>@${esc(p?.username||'creator')}</b> ${esc(c.text)}</div>`}).join('');document.getElementById('c-'+id).innerHTML=html+`<div class="commentform"><input id="ci-${id}" placeholder="Add a comment"><button onclick="comment('${id}')">Post</button></div>`}
async function comment(id){let i=document.getElementById('ci-'+id),text=i.value.trim();if(!text)return;let r=await db.from('comments').insert({wallpaper_id:id,user_id:user.id,text});if(r.error)return toast(r.error.message);comments(id)}
async function del(id){if(!confirm('Delete this wallpaper?'))return;let r=await db.from('wallpapers').delete().eq('id',id);if(r.error)return toast(r.error.message);go('home')}
function recreate(id){let p=posts.find(x=>x.id===id);go('create').then(()=>setTimeout(()=>{ct.value=p.title+' — my version';cs.value=p.subtitle||'';tc.value=p.text_color||'#493957';font.value=p.font||'Arial';size.value=p.title_size||52;preview()},100))}function share(id){let u=location.href.split('#')[0]+'#wallpaper='+id;navigator.clipboard?.writeText(u);toast('Wallpaper link copied!')}
function peoplePage(){return `<div class="panel" style="padding:20px"><h2>People</h2><p class="muted">Everyone with a DreamWall profile appears here.</p>${people.map(p=>`<div class="person" style="padding:10px 0">${av(p)}<div class="grow"><b>@${esc(p.username)}</b><div class="tiny muted">${p.account_type==='ai'?'🤖 AI creator':'Real creator'}</div></div>${p.id!==user.id?`<button class="secondary" onclick="openProfile('${p.id}')">Profile</button>`:''}</div>`).join('')}</div>`}
function profilePage(p){let a=posts.filter(x=>x.user_id===p.id);return `<div class="panel"><div class="profilehero">${av(p,true)}<div class="profileinfo"><h2>@${esc(p.username)} ${p.account_type==='ai'?'🤖':''}</h2><div>${esc(p.real_name||'')}</div><p class="muted">${esc(p.bio||'')}</p><b>${a.length} posts</b></div></div><div class="profileposts">${a.map(x=>`<div class="profilethumb">${wall(x)}</div>`).join('')}</div></div>`}
function openProfile(id){let p=people.find(x=>x.id===id);if(p){pageName='profile';document.getElementById('main').innerHTML=profilePage(p)}}function messagesPage(){let a=people.filter(p=>p.id!==user.id&&p.account_type!=='ai');return `<div class="panel" style="padding:20px"><h2>Messages</h2><p class="muted">Message real creators about wallpapers.</p>${a.map(p=>`<div class="person" style="padding:10px 0">${av(p)}<div class="grow"><b>@${esc(p.username)}</b></div><button class="primary" onclick="chat('${p.id}')">Chat</button></div>`).join('')||'<div class="empty">No other real creators yet.</div>'}</div>`}
async function chat(id){let p=people.find(x=>x.id===id);if(!p||p.account_type==='ai')return;document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="chat"><div class="modalbox"><button class="close" onclick="document.getElementById('chat').remove()">×</button><h2>@${esc(p.username)}</h2><div id="chatbox" class="chat"></div><div class="commentform"><input id="msg" placeholder="Message about wallpapers..."><button class="primary" onclick="send('${id}')">Send</button></div></div></div>`);await loadChat(id)}async function loadChat(id){let r=await db.from('messages').select('*').or(`and(sender_id.eq.${user.id},receiver_id.eq.${id}),and(sender_id.eq.${id},receiver_id.eq.${user.id})`).order('created_at');let b=document.getElementById('chatbox');if(b)b.innerHTML=(r.data||[]).map(x=>`<div class="bubble ${x.sender_id===user.id?'mine':'theirs'}">${esc(x.text)}</div>`).join('')}async function send(id){let i=document.getElementById('msg'),t=i.value.trim();if(!t)return;let r=await db.from('messages').insert({sender_id:user.id,receiver_id:id,text:t});if(r.error)return toast(r.error.message);i.value='';loadChat(id)}function suggestions(){let e=document.getElementById('suggestions');if(e)e.innerHTML=people.filter(p=>p.id!==user.id).slice(0,6).map(p=>`<div class="person" style="padding:9px 0">${av(p)}<div class="grow"><b>@${esc(p.username)}</b><div class="tiny muted">${p.account_type==='ai'?'AI':'Creator'}</div></div></div>`).join('')}
function search(q){if(!q)return;pageName='people';let a=people.filter(p=>(p.username+' '+p.real_name).toLowerCase().includes(q.toLowerCase()));let m=document.getElementById('main');if(m)m.innerHTML=`<div class="panel" style="padding:20px"><h2>Search</h2>${a.map(p=>`<div class="person" style="padding:10px">${av(p)}<div class="grow"><b>@${esc(p.username)}</b></div><button class="secondary" onclick="openProfile('${p.id}')">Profile</button></div>`).join('')||'<div class="empty">No creators found.</div>'}`}
async function logout(){await db.auth.signOut();user=null;profile=null;login()}async function start(){let s=await db.auth.getSession();if(!s.data.session)return login();user=s.data.session.user;await loadProfile();if(!profile)await fallback();await load();render()}start();
</script></body></html>
