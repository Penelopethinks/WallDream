<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DreamWall</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--p:#c9a4ff;--q:#ff9fc5;--m:#9ee8d5;--ink:#493957;--line:#eadff1}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fffafd,#f7f3ff);color:var(--ink);font:15px Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{max-width:1100px;margin:auto;padding:16px}.top{position:sticky;top:0;z-index:10;background:#fffE;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:12px;flex-wrap:wrap}.logo{font-size:30px;font-weight:900;background:linear-gradient(90deg,var(--p),var(--q),var(--m));-webkit-background-clip:text;color:transparent}.nav{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}.btn{padding:10px 14px;border-radius:13px;background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:700}.primary{background:linear-gradient(100deg,var(--p),var(--q));color:#fff;border:0}.danger{background:#ffe5ec;color:#9b3554}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;margin:16px 0;box-shadow:0 8px 30px #57376b0d}.auth{max-width:470px;margin:9vh auto}.field{width:100%;padding:13px;border:1px solid #ddd2e4;border-radius:12px;margin:6px 0;outline:0}.muted{color:#8a7c91}.feed{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}.post{padding:0;overflow:hidden}.wall{min-height:400px;display:grid;place-items:center;text-align:center;padding:30px;background-size:cover;background-position:center}.wall h2{font-size:48px;line-height:1;margin:8px 0}.info{padding:14px}.row{display:flex;align-items:center;gap:10px}.grow{flex:1}.avatar{width:45px;height:45px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--p),var(--m));display:grid;place-items:center;font-weight:900}.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}.badge{font-size:10px;padding:5px 7px;border-radius:8px;background:#eee6ff}.ai{background:#e9e9e9}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.person{border:1px solid var(--line);border-radius:17px;padding:14px}.builder{display:grid;grid-template-columns:390px 1fr;gap:18px}.preview{min-height:540px;border-radius:23px;display:grid;place-items:center;text-align:center;padding:30px;background-size:cover;background-position:center}.empty{text-align:center;padding:55px 15px}@media(max-width:750px){.builder{grid-template-columns:1fr}.nav{width:100%;margin-left:0}}
</style></head>
<body><div id="app"></div>
<script>
const SUPABASE_URL='https://kcybwrdtnlflevndmzfn.supabase.co';
const SUPABASE_KEY='sb_publishable_XhOq8P5tdMgjWDKZEvgsgg_hcALWg48';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let session=null,me=null,profiles=[],walls=[];
const el=id=>document.getElementById(id);
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function msg(x){alert(x)}
function avatar(p){if(p&&p.avatar_url)return '<div class="avatar"><img src="'+esc(p.avatar_url)+'"></div>';return '<div class="avatar">'+esc(((p&&p.username)||'?')[0].toUpperCase())+'</div>'}
async function start(){try{var r=await db.auth.getSession();session=r.data.session;if(session){await loadMe();if(me)home();else profileForm()}else welcome()}catch(e){app.innerHTML='<div class="wrap"><div class="card auth"><h2>DreamWall could not start</h2><p>'+esc(e.message)+'</p></div></div>'}}
function welcome(){app.innerHTML='<div class="wrap"><div class="card auth"><div class="logo">DreamWall</div><h1>Your wall. Your world. ✨</h1><p class="muted">A wallpaper community with shared accounts.</p><button class="btn primary" onclick="authBox(\'signup\')">Create account</button> <button class="btn" onclick="authBox(\'login\')">Sign in</button></div></div>'}
function authBox(mode){app.innerHTML='<div class="wrap"><div class="card auth"><div class="logo">DreamWall</div><h2>'+(mode==='signup'?'Create your account':'Welcome back')+'</h2><form onsubmit="'+(mode==='signup'?'signup(event)':'login(event)')+'"><input class="field" id="email" type="email" placeholder="Email" required><input class="field" id="password" type="password" minlength="6" placeholder="Password" required><button class="btn primary">'+(mode==='signup'?'Create account':'Sign in')+'</button></form><br><button class="btn" onclick="authBox(\''+(mode==='signup'?'login':'signup')+'\')">'+(mode==='signup'?'I already have an account':'Create an account')+'</button></div></div>'}
async function signup(e){e.preventDefault();var r=await db.auth.signUp({email:el('email').value.trim(),password:el('password').value});if(r.error)return msg(r.error.message);if(!r.data.session){msg('Account created! Check your email to confirm it, then come back and sign in.');return}session=r.data.session;profileForm()}
async function login(e){e.preventDefault();var r=await db.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});if(r.error)return msg(r.error.message);session=r.data.session;await loadMe();if(me)home();else profileForm()}
async function loadMe(){if(!session)return;var r=await db.from('profiles').select('*').eq('id',session.user.id).maybeSingle();if(r.error){msg('Supabase profiles error: '+r.error.message);me=null;return}me=r.data||null}
function profileForm(){app.innerHTML='<div class="wrap"><div class="card auth"><div class="logo">DreamWall</div><h2>Finish your profile ✨</h2><p class="muted">Your username must be different from your real name.</p><input class="field" id="username" placeholder="Username"><input class="field" id="realname" placeholder="Real name"><input class="field" id="avatarurl" placeholder="Profile picture URL (optional)"><textarea class="field" id="bio" placeholder="Bio (optional)"></textarea><button class="btn primary" onclick="saveProfile()">Save profile</button> <button class="btn" onclick="logout()">Log out</button></div></div>'}
async function saveProfile(){var u=el('username').value.trim().toLowerCase().replace(/\s+/g,'_'),rname=el('realname').value.trim();if(!u||!rname)return msg('Enter your username and real name.');if(u.replace(/_/g,'')===rname.toLowerCase().replace(/\s+/g,''))return msg('Your username cannot be your real name.');var q=await db.from('profiles').select('id').ilike('username',u).neq('id',session.user.id).maybeSingle();if(q.error)return msg(q.error.message);if(q.data)return msg('That username is already taken. Choose another.');var row={id:session.user.id,username:u,real_name:rname,avatar_url:el('avatarurl').value.trim(),bio:el('bio').value.trim(),account_type:'real'};var r=await db.from('profiles').upsert(row,{onConflict:'id'});if(r.error)return msg(r.error.message);me=row;home()}
async function loadData(){var p=await db.from('profiles').select('*').order('created_at',{ascending:true});var w=await db.from('wallpapers').select('*').order('created_at',{ascending:false});if(p.error){msg('Profiles error: '+p.error.message);return false}if(w.error){msg('Wallpapers error: '+w.error.message);return false}profiles=p.data||[];walls=w.data||[];return true}
function header(){return '<header class="top"><div class="logo">DreamWall</div><div class="nav"><button class="btn" onclick="home()">🏠 Home</button><button class="btn" onclick="people()">👥 People</button><button class="btn primary" onclick="studio()">＋ Create</button><button class="btn" onclick="profileView(\''+session.user.id+'\')">👤 Profile</button><button class="btn" onclick="logout()">Log out</button></div></header>'}
async function home(){if(!await loadData())return;app.innerHTML='<div class="wrap">'+header()+'<div class="card"><h1>DreamWall ✨</h1><p class="muted">Real people. Real wallpapers. No pretend activity.</p></div><div class="feed">'+(walls.length?walls.map(post).join(''):'<div class="card empty"><h2>No wallpapers yet!</h2><p>Be the first creator.</p><button class="btn primary" onclick="studio()">Create a wallpaper</button></div>')+'</div></div>'}
function post(w){var p=profiles.find(function(x){return x.id===w.user_id})||{};var ai=p.account_type==='ai';var dec=Array.isArray(w.decorations)?w.decorations.join(' '):'';return '<article class="card post"><div class="wall" style="background:'+esc(w.background||'#fff')+';color:'+esc(w.text_color||'#493957')+';filter:brightness('+(w.brightness||100)+'%) contrast('+(w.contrast||100)+'%)"><div><div style="font-size:45px">'+esc(dec)+'</div><h2 style="font-family:'+esc(w.font||'Arial')+';font-size:'+(w.title_size||52)+'px">'+esc(w.title)+'</h2><p>'+esc(w.subtitle||'')+'</p></div></div><div class="info"><div class="row">'+avatar(p)+'<button class="btn" onclick="profileView(\''+p.id+'\')">@'+esc(p.username||'unknown')+'</button><span class="grow"></span><span class="badge '+(ai?'ai':'')+'">'+(ai?'🤖 AI CREATOR':'✓ REAL CREATOR')+'</span></div><p>'+esc(w.caption||'')+'</p><div class="actions"><button class="btn" onclick="like(\''+w.id+'\')">❤️ Like</button><button class="btn" onclick="comment(\''+w.id+'\')">💬 Comment</button><button class="btn" onclick="recreate(\''+w.id+'\')">🎨 Recreate</button>'+(w.user_id===session.user.id?'<button class="btn danger" onclick="delWall(\''+w.id+'\')">🗑️ Delete</button>':'')+'</div></div></article>'}
async function like(id){var q=await db.from('likes').select('*').eq('user_id',session.user.id).eq('wallpaper_id',id).maybeSingle();if(q.error)return msg(q.error.message);if(q.data)await db.from('likes').delete().eq('user_id',session.user.id).eq('wallpaper_id',id);else await db.from('likes').insert({user_id:session.user.id,wallpaper_id:id});msg(q.data?'Unliked':'Liked ❤️')}
async function comment(id){var t=prompt('Write a comment:');if(!t||!t.trim())return;var r=await db.from('comments').insert({wallpaper_id:id,user_id:session.user.id,text:t.trim()});if(r.error)return msg(r.error.message);msg('Comment posted! 💬')}
async function delWall(id){if(!confirm('Delete this wallpaper?'))return;var r=await db.from('wallpapers').delete().eq('id',id).eq('user_id',session.user.id);if(r.error)return msg(r.error.message);home()}
async function people(){if(!await loadData())return;app.innerHTML='<div class="wrap">'+header()+'<div class="card"><h1>People on DreamWall 👥</h1><p class="muted">Everyone shown here comes from the shared database.</p></div><div class="people">'+profiles.map(function(p){return '<div class="person"><div class="row">'+avatar(p)+'<div><b>@'+esc(p.username)+'</b><div class="muted">'+(p.account_type==='ai'?'🤖 AI creator':'✓ Real creator')+'</div></div></div><br><button class="btn" onclick="profileView(\''+p.id+'\')">View profile</button></div>'}).join('')+'</div></div>'}
async function profileView(id){if(!await loadData())return;var p=profiles.find(function(x){return x.id===id});if(!p)return;var ws=walls.filter(function(w){return w.user_id===id});app.innerHTML='<div class="wrap">'+header()+'<div class="card"><div class="row">'+avatar(p)+'<div><h2>@'+esc(p.username)+'</h2><p>'+esc(p.real_name)+'</p><span class="badge '+(p.account_type==='ai'?'ai':'')+'">'+(p.account_type==='ai'?'🤖 AI CREATOR':'✓ REAL CREATOR')+'</span></div></div><p>'+esc(p.bio||'')+'</p>'+(id!==session.user.id&&p.account_type!=='ai'?'<button class="btn primary" onclick="follow(\''+id+'\')">＋ Follow</button> <button class="btn" onclick="messageUser(\''+id+'\')">💌 Message</button>':'')+'</div><div class="feed">'+(ws.length?ws.map(post).join(''):'<div class="card empty">No wallpapers yet.</div>')+'</div></div>'}
async function follow(id){var q=await db.from('follows').select('*').eq('follower_id',session.user.id).eq('following_id',id).maybeSingle();if(q.error)return msg(q.error.message);if(q.data)await db.from('follows').delete().eq('follower_id',session.user.id).eq('following_id',id);else await db.from('follows').insert({follower_id:session.user.id,following_id:id});msg(q.data?'Unfollowed':'Following!')}
async function messageUser(id){var p=profiles.find(function(x){return x.id===id});if(!p||p.account_type==='ai')return msg('AI creators cannot receive messages.');var t=prompt('Message @'+p.username+':');if(!t||!t.trim())return;var r=await db.from('messages').insert({sender_id:session.user.id,receiver_id:id,text:t.trim()});if(r.error)return msg(r.error.message);msg('Message sent! 💌')}
function studio(old){var w=old||{};app.innerHTML='<div class="wrap">'+header()+'<div class="builder"><div class="card"><h1>Create a wallpaper 🎨</h1><input class="field" id="title" value="'+esc(w.title||'Dreamy')+'" placeholder="Title"><input class="field" id="sub" value="'+esc(w.subtitle||'Make your world beautiful')+'" placeholder="Subtitle"><textarea class="field" id="cap" placeholder="Caption">'+esc(w.caption||'')+'</textarea><input class="field" id="bg" value="'+esc(w.background||'linear-gradient(135deg,#c9a4ff,#9ee8d5)')+'" placeholder="CSS color, gradient, or image URL"><label>Text color <input id="color" type="color" value="'+(w.text_color||'#493957')+'"></label><select class="field" id="font"><option>Arial</option><option>Georgia</option><option>Verdana</option><option>Trebuchet MS</option><option>Courier New</option><option>Impact</option></select><label>Title size <input id="size" type="range" min="20" max="100" value="'+(w.title_size||52)+'"></label><input class="field" id="dec" value="'+esc(Array.isArray(w.decorations)?w.decorations.join(' '):'✨ 🌸 ☁️')+'" placeholder="Decorations"><label>Brightness <input id="bright" type="range" min="50" max="150" value="'+(w.brightness||100)+'"></label><label>Contrast <input id="contrast" type="range" min="50" max="150" value="'+(w.contrast||100)+'"></label><button class="btn primary" onclick="publish()">Publish wallpaper ✨</button></div><div class="card"><h2>Preview</h2><div id="preview" class="preview"></div></div></div></div>';['title','sub','bg','color','font','size','dec','bright','contrast'].forEach(function(id){el(id).addEventListener('input',preview)});preview()}
function preview(){var p=el('preview');if(!p)return;p.style.background=el('bg').value;p.style.color=el('color').value;p.style.filter='brightness('+el('bright').value+'%) contrast('+el('contrast').value+'%)';p.innerHTML='<div><div style="font-size:45px">'+esc(el('dec').value)+'</div><h2 style="font-family:'+esc(el('font').value)+';font-size:'+el('size').value+'px;margin:8px 0">'+esc(el('title').value)+'</h2><p>'+esc(el('sub').value)+'</p></div>'}
async function publish(){var r=await db.from('wallpapers').insert({user_id:session.user.id,title:el('title').value.trim(),subtitle:el('sub').value.trim(),caption:el('cap').value.trim(),background:el('bg').value.trim(),text_color:el('color').value,font:el('font').value,title_size:Number(el('size').value),decorations:el('dec').value.split(/\s+/).filter(Boolean),brightness:Number(el('bright').value),contrast:Number(el('contrast').value)});if(r.error)return msg('Could not publish: '+r.error.message);msg('Wallpaper published! ✨');home()}
function recreate(id){var w=walls.find(function(x){return x.id===id});if(w)studio(w)}
async function logout(){await db.auth.signOut();session=null;me=null;welcome()}
start();
</script></body></html>
