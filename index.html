<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DreamWall</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--lav:#c9a4ff;--mint:#9ee8d5;--pink:#ff9fc5;--blue:#a9c9ff;--bg:#faf8fc;--card:#fff;--text:#30283a;--muted:#8b8194;--line:#e8dfef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{height:68px;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#fffffff2;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.logo{font-size:28px;font-weight:900;background:linear-gradient(90deg,var(--lav),var(--pink),var(--mint));-webkit-background-clip:text;color:transparent}.search{width:min(420px,45%);border:0;background:#f0eaf5;border-radius:25px;padding:12px 17px;outline:0}.icons{display:flex;gap:7px}.icon{border:0;border-radius:50%;width:42px;height:42px;background:#f0eaf5}.layout{max-width:1200px;margin:auto;display:grid;grid-template-columns:180px minmax(0,680px) 220px;gap:22px;padding:22px 14px 80px}.side{position:sticky;top:90px;height:max-content}.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;background:transparent;padding:13px;border-radius:14px;text-align:left;font-weight:800}.nav button:hover,.nav button.active{background:#eee5f6;color:#8051b5}.card{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:17px;box-shadow:0 10px 30px #4b315b0c}.pad{padding:18px}.muted{color:var(--muted)}.primary,.secondary{border-radius:12px;padding:10px 15px;font-weight:800}.primary{border:0;color:#fff;background:linear-gradient(135deg,var(--lav),var(--pink))}.secondary{border:1px solid var(--line);background:#fff}.danger{border:0;border-radius:10px;padding:8px;background:#fff0f4;color:#d94f7a;font-weight:800}.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--lav);cursor:pointer}.bigavatar{width:105px;height:105px;border-radius:50%;object-fit:cover;border:6px solid white;margin-top:-52px}.stories{display:flex;gap:16px;overflow:auto;padding:2px 2px 18px}.story{min-width:67px;text-align:center;font-size:11px;font-weight:800}.ring{width:64px;height:64px;padding:3px;border-radius:50%;margin:auto auto 5px;background:linear-gradient(135deg,var(--lav),var(--pink),var(--mint))}.ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid white}.head{display:flex;align-items:center;gap:10px;padding:13px}.grow{flex:1}.badge{font-size:9px;color:white;padding:3px 6px;border-radius:7px}.real{background:#7563e7}.ai{background:#a268c0}.wall{position:relative;aspect-ratio:9/14;display:flex;align-items:center;justify-content:center;overflow:hidden}.wall .content{position:relative;z-index:3;text-align:center;max-width:88%;padding:25px}.title{font-weight:900;line-height:.95;word-break:break-word}.subtitle{margin-top:12px;word-break:break-word}.decor{position:absolute;z-index:2;user-select:none}.actions{display:flex;gap:16px;padding:9px 14px}.actions button{border:0;background:transparent;font-size:22px}.body{padding:0 14px 14px}.comment{margin-top:7px;font-size:14px}.commentbox{display:flex;border-top:1px solid var(--line);padding:9px}.commentbox input{flex:1;border:0;outline:0}.commentbox button{border:0;background:none;color:#8051b5;font-weight:800}.empty{text-align:center;padding:70px 20px;color:var(--muted)}.people{display:grid;grid-template-columns:1fr 1fr;gap:10px}.person{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:15px;padding:11px}.profilebanner{height:150px;background:linear-gradient(135deg,var(--lav),var(--pink),var(--mint))}.profile{text-align:center;padding-bottom:18px}.stats{display:flex;justify-content:center;gap:45px;margin:18px}.stats strong,.stats span{display:block}.stats span{font-size:10px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:10px}.grid .wall{aspect-ratio:1}.modalbg{display:none;position:fixed;inset:0;z-index:100;background:#30203b88;align-items:center;justify-content:center;padding:14px}.modalbg.open{display:flex}.modal{background:white;width:min(900px,100%);max-height:94vh;overflow:auto;border-radius:25px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#f0eaf5;border-radius:50%;width:38px;height:38px}.field{display:flex;flex-direction:column;gap:5px;margin:10px 0}.field label{font-size:12px;font-weight:800}.field input,.field textarea,.field select{border:1px solid var(--line);border-radius:11px;padding:10px;outline:0}.field textarea{min-height:80px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.tabs{display:flex;gap:6px;overflow:auto;margin:10px 0}.tabs button{border:0;background:#eee8f4;border-radius:10px;padding:9px 12px;font-weight:800;white-space:nowrap}.tabs button.active{background:var(--lav);color:white}.panel{display:none}.panel.active{display:block}.studio{display:grid;grid-template-columns:1fr 330px;gap:18px}.preview{background:#f1ebf6;border-radius:18px;padding:18px;display:flex;justify-content:center;align-items:center;min-height:540px}.phone{width:300px;overflow:hidden;border-radius:25px}.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.colors button{height:52px;border:0;border-radius:10px;color:white;font-weight:800;text-shadow:0 1px 5px #0007}.emojis{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.emojis button{border:1px solid var(--line);background:white;border-radius:8px;padding:6px;font-size:19px}.toast{position:fixed;z-index:300;bottom:20px;left:50%;transform:translate(-50%,100px);background:#30283a;color:white;padding:12px 18px;border-radius:25px;transition:.25s}.toast.show{transform:translate(-50%,0)}@media(max-width:950px){.layout{grid-template-columns:65px minmax(0,680px);justify-content:center}.right{display:none}.nav button span{display:none}}@media(max-width:700px){.top{padding:0 10px}.search{display:none}.layout{display:block;padding:12px 7px 75px}.side{position:fixed;left:0;right:0;bottom:0;top:auto;height:60px;background:white;border-top:1px solid var(--line);z-index:30}.nav{height:100%;flex-direction:row;justify-content:space-around}.nav button{padding:8px}.studio,.fields,.people{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head>
<body>
<header class="top"><div class="logo">DreamWall</div><input id="search" class="search" placeholder="Search DreamWall..." oninput="searchPeople()"><div class="icons"><button class="icon" onclick="messages()">💬</button><button class="icon" onclick="openStudio()">＋</button><button class="icon" onclick="profile()">👤</button></div></header>
<div class="layout"><aside class="side"><nav class="nav"><button onclick="home()">🏠 <span>Home</span></button><button onclick="people()">👥 <span>People</span></button><button onclick="explore()">🔎 <span>Explore</span></button><button onclick="openStudio()">＋ <span>Create</span></button><button onclick="messages()">💬 <span>Messages</span></button><button onclick="profile()">👤 <span>Profile</span></button></nav></aside><main id="main"></main><aside class="right"><div class="card pad"><b>DreamWall</b><p class="muted">Create, discover and share wallpapers with real creators.</p></div></aside></div>
<div id="modalbg" class="modalbg"><div id="modal" class="modal"></div></div><div id="toast" class="toast"></div>
<script>
const SB_URL='https://kcybwrdtnlflevndmzfn.supabase.co';
const SB_KEY='sb_publishable_XhOq8P5tdMgjWDKZEvgsgg_hcALWg48';
const db=supabase.createClient(SB_URL,SB_KEY);let user=null,me=null,design={bg:'linear',c1:'#ffc9e1',c2:'#d8c9ff',c3:'#bdeee1',angle:135,title:'Dreamy',subtitle:'make your world beautiful',text:'#493957',font:'Arial',ts:52,ss:16,decor:[],brightness:100,contrast:100,blur:0,image:''};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const av=p=>p?.avatar_url||'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="#eee7f5"/><text x="50" y="65" text-anchor="middle" font-size="45">☁</text></svg>');
const toast=m=>{let x=document.getElementById('toast');x.textContent=m;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)};
const modal=h=>{document.getElementById('modal').innerHTML=h;document.getElementById('modalbg').classList.add('open')};const close=()=>document.getElementById('modalbg').classList.remove('open');document.getElementById('modalbg').onclick=e=>{if(e.target.id==='modalbg')close()};
async function init(){let {data}=await db.auth.getSession();user=data.session?.user||null;if(user){await loadMe();me?home():editProfile()}else{welcome()}db.auth.onAuthStateChange(async(_,s)=>{user=s?.user||null;if(user){await loadMe();me?home():editProfile()}else{me=null;welcome()}})}
function welcome(){main.innerHTML='<div class="card"><div class="empty"><div style="font-size:60px">🌙</div><h1>Welcome to DreamWall</h1><p>One shared wallpaper community — your profile and posts can be seen on other devices.</p><button class="primary" onclick="auth(\'signup\')">Create account</button> <button class="secondary" onclick="auth(\'login\')">Sign in</button></div></div>'}
function auth(mode){modal(`<div class="modalhead"><h2>${mode==='signup'?'Create your account':'Sign in'}</h2><button class="close" onclick="close()">×</button></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="pass" type="password"></div><button class="primary" onclick="${mode==='signup'?'signup()':'login()'}">${mode==='signup'?'Create account':'Sign in'}</button><p class="muted">${mode==='signup'?'Already have an account?':'Need an account?'} <button style="border:0;background:none;color:#8051b5;font-weight:800" onclick="auth('${mode==='signup'?'login':'signup'}')">${mode==='signup'?'Sign in':'Create one'}</button></p>`)}
async function signup(){let email=document.getElementById('email').value.trim(),password=document.getElementById('pass').value;if(!email||password.length<6)return toast('Enter an email and a 6+ character password.');let {data,error}=await db.auth.signUp({email,password});if(error)return toast(error.message);if(!data.session){close();toast('Check your email to confirm your account.');}else{close();editProfile()}}
async function login(){let email=document.getElementById('email').value.trim(),password=document.getElementById('pass').value;let {error}=await db.auth.signInWithPassword({email,password});if(error)return toast(error.message);close()}
async function loadMe(){let {data,error}=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();if(error)return toast(error.message);me=data;if(me){document.documentElement.style.setProperty('--lav',me.accent);document.documentElement.style.setProperty('--mint',me.accent2)}}
function editProfile(){let p=me||{};modal(`<div class="modalhead"><h2>${me?'Edit profile':'Finish your profile'}</h2><button class="close" onclick="close()">×</button></div><p class="muted">Your username is public and must be unique. It cannot be your real name.</p><div class="fields"><div class="field"><label>Username</label><input id="un" value="${esc(p.username)}"></div><div class="field"><label>Real name</label><input id="rn" value="${esc(p.real_name)}"></div><div class="field full"><label>Profile picture URL</label><input id="av" value="${esc(p.avatar_url)}" placeholder="https://..."></div><div class="field full"><label>Bio</label><textarea id="bio">${esc(p.bio)}</textarea></div><div class="field"><label>Profile color</label><input id="ac" type="color" value="${p.accent||'#c9a4ff'}"></div><div class="field"><label>Second color</label><input id="ac2" type="color" value="${p.accent2||'#9ee8d5'}"></div></div><button class="primary" onclick="saveProfile()">Save profile</button>`)}
async function saveProfile(){let username=document.getElementById('un').value.trim(),real_name=document.getElementById('rn').value.trim();if(!username||!real_name)return toast('Username and real name are required.');if(username.toLowerCase()===real_name.toLowerCase())return toast('Username cannot be your real name.');let row={id:user.id,username,real_name,avatar_url:document.getElementById('av').value.trim(),bio:document.getElementById('bio').value.trim(),accent:document.getElementById('ac').value,accent2:document.getElementById('ac2').value,account_type:'real'};let {error}=await db.from('profiles').upsert(row,{onConflict:'id'});if(error)return toast(error.code==='23505'?'That username is already taken.':error.message);me=row;close();toast('Profile saved!');home()}
async function home(){if(!user)return welcome();if(!me)return editProfile();let {data:ps}=await db.from('profiles').select('*').order('created_at',{ascending:true});let {data:ws}=await db.from('wallpapers').select('*').order('created_at',{ascending:false});main.innerHTML=`<div class="stories">${(ps||[]).map(p=>`<div class="story" onclick="viewProfile('${p.id}')"><div class="ring"><img src="${av(p)}"></div>@${esc(p.username)}</div>`).join('')}</div>${(ws||[]).map(renderPost).join('')||'<div class="card"><div class="empty"><div style="font-size:55px">🎨</div><h2>No wallpapers yet</h2><button class="primary" onclick="openStudio()">Create the first one</button></div></div>'}`}
async function renderPost(w){let {data:p}=await db.from('profiles').select('*').eq('id',w.user_id).single();let {data:cs}=await db.from('comments').select('*,profiles(username)').eq('wallpaper_id',w.id).order('created_at');let {count}=await db.from('likes').select('*',{count:'exact',head:true}).eq('wallpaper_id',w.id);return `<article class="card"><div class="head"><img class="avatar" src="${av(p)}" onclick="viewProfile('${p.id}')"><div class="grow"><b>@${esc(p.username)} <span class="badge ${p.account_type==='ai'?'ai':'real'}">${p.account_type==='ai'?'AI':'✓ REAL'}</span></b><small class="muted">${esc(p.real_name)}</small></div>${w.user_id===user.id?`<button class="danger" onclick="delWall('${w.id}')">Delete</button>`:''}</div>${wall(w)}<div class="actions"><button onclick="like('${w.id}')">♡</button><button onclick="document.getElementById('c-${w.id}').focus()">💬</button><button onclick="share('${w.id}')">⤴</button><button onclick="remix('${w.id}')">✦</button></div><div class="body"><b>${count||0} likes</b><div class="comment"><b>@${esc(p.username)}</b> ${esc(w.caption||'')}</div>${(cs||[]).map(c=>`<div class="comment"><b>@${esc(c.profiles?.username||'')}</b> ${esc(c.text)}</div>`).join('')}</div><div class="commentbox"><input id="c-${w.id}" placeholder="Add a comment..." onkeydown="if(event.key==='Enter')comment('${w.id}')"><button onclick="comment('${w.id}')">Post</button></div></article>`}
function wall(w){return `<div class="wall" style="background:${esc(w.background)};color:${esc(w.text_color)};filter:brightness(${w.brightness||100}%) contrast(${w.contrast||100}%) blur(${w.blur||0}px)"><div class="content"><div class="title" style="font-family:${esc(w.font)};font-size:${w.title_size}px">${esc(w.title)}</div><div class="subtitle" style="font-family:${esc(w.font)};font-size:${w.subtitle_size}px">${esc(w.subtitle)}</div></div>${(w.decorations||[]).map(d=>`<div class="decor" style="left:${d.x}%;top:${d.y}%;font-size:${d.size}px;color:${d.color};opacity:${d.opacity}">${esc(d.symbol)}</div>`).join('')}</div>`}
async function like(id){let {data:old}=await db.from('likes').select('*').eq('user_id',user.id).eq('wallpaper_id',id).maybeSingle();if(old)await db.from('likes').delete().eq('user_id',user.id).eq('wallpaper_id',id);else await db.from('likes').insert({user_id:user.id,wallpaper_id:id});home()}
async function comment(id){let x=document.getElementById('c-'+id),text=x.value.trim();if(!text)return;let {error}=await db.from('comments').insert({wallpaper_id:id,user_id:user.id,text});if(error)return toast(error.message);x.value='';home()}
async function delWall(id){if(!confirm('Delete this wallpaper?'))return;let {error}=await db.from('wallpapers').delete().eq('id',id).eq('user_id',user.id);if(error)return toast(error.message);toast('Wallpaper deleted');home()}
async function share(id){let url=location.href.split('#')[0]+'#wallpaper-'+id;if(navigator.share){try{await navigator.share({title:'DreamWall',url})}catch(e){}}else{await navigator.clipboard.writeText(url);toast('Link copied')}}
async function remix(id){let {data}=await db.from('wallpapers').select('*').eq('id',id).single();if(!data)return;design.title=data.title;design.subtitle=data.subtitle;design.text=data.text_color;design.font=data.font;design.ts=data.title_size;design.ss=data.subtitle_size;design.decor=JSON.parse(JSON.stringify(data.decorations||[]));design.brightness=data.brightness;design.contrast=data.contrast;design.blur=data.blur;openStudio()}
async function people(){let {data}=await db.from('profiles').select('*').order('created_at',{ascending:false});main.innerHTML=`<div class="card pad"><h1>People 👥</h1><p class="muted">Everyone who signs up appears here.</p><div class="people">${(data||[]).map(p=>`<div class="person"><img class="avatar" src="${av(p)}" onclick="viewProfile('${p.id}')"><div class="grow"><b>@${esc(p.username)} <span class="badge ${p.account_type==='ai'?'ai':'real'}">${p.account_type==='ai'?'AI':'✓ REAL'}</span></b><div class="muted">${esc(p.real_name)}</div></div><button class="secondary" onclick="viewProfile('${p.id}')">View</button></div>`).join('')}</div></div>`}
async function searchPeople(){let q=document.getElementById('search').value.trim();if(!q)return home();let {data}=await db.from('profiles').select('*').ilike('username','%'+q+'%');main.innerHTML=`<div class="card pad"><h2>Search</h2>${(data||[]).map(p=>`<div class="person" style="margin:8px 0"><img class="avatar" src="${av(p)}"><div class="grow"><b>@${esc(p.username)}</b><div class="muted">${esc(p.real_name)}</div></div><button class="secondary" onclick="viewProfile('${p.id}')">View</button></div>`).join('')||'<p class="muted">No creators found.</p>'}</div>`}
async function viewProfile(id){let {data:p}=await db.from('profiles').select('*').eq('id',id).single();let {data:ws}=await db.from('wallpapers').select('*').eq('user_id',id).order('created_at',{ascending:false});let {count:followers}=await db.from('follows').select('*',{count:'exact',head:true}).eq('following_id',id);let {count:following}=await db.from('follows').select('*',{count:'exact',head:true}).eq('follower_id',id);main.innerHTML=`<div class="card"><div class="profilebanner" style="background:linear-gradient(135deg,${p.accent},${p.accent2},var(--pink))"></div><div class="profile"><img class="bigavatar" src="${av(p)}"><h1>${esc(p.real_name)} <span class="badge ${p.account_type==='ai'?'ai':'real'}">${p.account_type==='ai'?'AI':'✓ REAL CREATOR'}</span></h1><div class="muted">@${esc(p.username)}</div><p>${esc(p.bio||'Dreaming up wallpapers ✨')}</p><div class="stats"><div><strong>${ws?.length||0}</strong><span>WALLPAPERS</span></div><div><strong>${followers||0}</strong><span>FOLLOWERS</span></div><div><strong>${following||0}</strong><span>FOLLOWING</span></div></div>${id===user.id?'<button class="secondary" onclick="editProfile()">Edit profile</button> <button class="secondary" onclick="logout()">Sign out</button>':`<button class="primary" onclick="follow('${id}')">Follow</button>${p.account_type==='real'?` <button class="secondary" onclick="message('${id}')">Message</button>`:''}`}</div><div class="grid">${(ws||[]).map(w=>wall(w)).join('')||'<div class="empty" style="grid-column:1/-1">No wallpapers yet.</div>'}</div></div>`}
async function follow(id){let {data}=await db.from('follows').select('*').eq('follower_id',user.id).eq('following_id',id).maybeSingle();if(data)await db.from('follows').delete().eq('follower_id',user.id).eq('following_id',id);else await db.from('follows').insert({follower_id:user.id,following_id:id});viewProfile(id)}
async function messages(){let {data}=await db.from('profiles').select('*').neq('id',user.id).eq('account_type','real');main.innerHTML=`<div class="card pad"><h1>Messages 💬</h1><p class="muted">Only real creators can be messaged.</p>${(data||[]).map(p=>`<div class="person" style="margin:8px 0"><img class="avatar" src="${av(p)}"><div class="grow"><b>@${esc(p.username)}</b><div class="muted">${esc(p.real_name)}</div></div><button class="primary" onclick="message('${p.id}')">Message</button></div>`).join('')||'<div class="empty">No other real creators have signed up yet.</div>'}</div>`}
async function message(id){let {data:p}=await db.from('profiles').select('*').eq('id',id).single();modal(`<div class="modalhead"><h2>Message @${esc(p.username)}</h2><button class="close" onclick="close()">×</button></div><div class="field"><label>Message</label><textarea id="msg" placeholder="Talk about wallpapers..."></textarea></div><button class="primary" onclick="sendMsg('${id}')">Send</button>`)}
async function sendMsg(id){let text=document.getElementById('msg').value.trim();if(!text)return;let {error}=await db.from('messages').insert({sender_id:user.id,receiver_id:id,text});if(error)return toast(error.message);close();toast('Message sent!')}
async function logout(){await db.auth.signOut()}
async function explore(){let {data}=await db.from('wallpapers').select('*').order('created_at',{ascending:false});main.innerHTML='<div class="card pad"><h1>Explore ✨</h1><p class="muted">Newest wallpapers from the community.</p></div>'+(await Promise.all((data||[]).map(renderPost))).join('')}
function bg(){if(design.image)return `url(${design.image}) center/cover`;if(design.bg==='solid')return design.c1;if(design.bg==='radial')return `radial-gradient(circle,${design.c1},${design.c2},${design.c3})`;if(design.bg==='conic')return `conic-gradient(from ${design.angle}deg,${design.c1},${design.c2},${design.c3},${design.c1})`;return `linear-gradient(${design.angle}deg,${design.c1},${design.c2},${design.c3})`}
const emoji=['✦','✧','★','☆','♡','♥','☾','☀','☁','✨','⭐','🌙','🌸','🌷','🌼','🦋','🎀','🫧','🍓','🍒','🌊','🪩','💎','🪽','🕊️','🧸','🍬','☕','🌿','🍋','🍉','🌈','❀','✿','🌺','🩷'];
function openStudio(){modal(`<div class="modalhead"><div><h2>Wallpaper Studio ✨</h2><span class="muted">No AI creation — every design is made by you.</span></div><button class="close" onclick="close()">×</button></div><div class="studio"><div class="preview"><div class="phone"><div id="prev" class="wall"></div></div></div><div><div class="tabs"><button class="active" onclick="tab('bg',this)">Background</button><button onclick="tab('text',this)">Text</button><button onclick="tab('decor',this)">Decor</button><button onclick="tab('effects',this)">Effects</button></div><div id="p-bg" class="panel active"><div class="field"><label>Background type</label><select onchange="setD('bg',this.value)"><option value="linear">Gradient</option><option value="radial">Radial</option><option value="conic">Swirl</option><option value="solid">Solid</option><option value="image">Image URL</option></select></div><div class="fields"><div class="field"><label>Color 1</label><input type="color" value="${design.c1}" onchange="setD('c1',this.value)"></div><div class="field"><label>Color 2</label><input type="color" value="${design.c2}" onchange="setD('c2',this.value)"></div><div class="field"><label>Color 3</label><input type="color" value="${design.c3}" onchange="setD('c3',this.value)"></div><div class="field"><label>Angle</label><input type="range" min="0" max="360" value="${design.angle}" oninput="setD('angle',this.value)"></div><div class="field full"><label>Wallpaper image URL</label><input value="${esc(design.image)}" placeholder="https://...jpg" oninput="setD('image',this.value)"></div></div><h4>Palettes</h4><div class="colors"><button style="background:linear-gradient(135deg,#ffc9e1,#d8c9ff,#bdeee1)" onclick="pal('#ffc9e1','#d8c9ff','#bdeee1')">Cotton</button><button style="background:linear-gradient(135deg,#9ee8d5,#9fc9ff,#ded1ff)" onclick="pal('#9ee8d5','#9fc9ff','#ded1ff')">Ocean</button><button style="background:linear-gradient(135deg,#e0c9ff,#ffc2df,#c8d5ff)" onclick="pal('#e0c9ff','#ffc2df','#c8d5ff')">Lavender</button><button style="background:linear-gradient(135deg,#ffd39e,#ffadc9,#ffc9e1)" onclick="pal('#ffd39e','#ffadc9','#ffc9e1')">Sunset</button><button style="background:linear-gradient(135deg,#26304e,#756ba8,#b8a9ff)" onclick="pal('#26304e','#756ba8','#b8a9ff')">Night</button><button style="background:linear-gradient(135deg,#b7efd9,#d8fff1,#b9ddff)" onclick="pal('#b7efd9','#d8fff1','#b9ddff')">Mint</button></div></div><div id="p-text" class="panel"><div class="field"><label>Title</label><input value="${esc(design.title)}" oninput="setD('title',this.value)"></div><div class="field"><label>Subtitle</label><textarea oninput="setD('subtitle',this.value)">${esc(design.subtitle)}</textarea></div><div class="fields"><div class="field"><label>Text color</label><input type="color" value="${design.text}" onchange="setD('text',this.value)"></div><div class="field"><label>Font</label><select onchange="setD('font',this.value)"><option>Arial</option><option>Georgia</option><option>Verdana</option><option>Trebuchet MS</option><option>Courier New</option><option>Times New Roman</option></select></div><div class="field"><label>Title size</label><input type="range" min="20" max="100" value="${design.ts}" oninput="setD('ts',this.value)"></div><div class="field"><label>Subtitle size</label><input type="range" min="8" max="35" value="${design.ss}" oninput="setD('ss',this.value)"></div></div></div><div id="p-decor" class="panel"><div class="emojis">${emoji.map(e=>`<button onclick="addD('${e}')">${e}</button>`).join('')}</div><br><button class="secondary" onclick="design.decor=[];preview()">Clear decorations</button></div><div id="p-effects" class="panel"><div class="field"><label>Brightness</label><input type="range" min="60" max="140" value="${design.brightness}" oninput="setD('brightness',this.value)"></div><div class="field"><label>Contrast</label><input type="range" min="70" max="140" value="${design.contrast}" oninput="setD('contrast',this.value)"></div><div class="field"><label>Blur</label><input type="range" min="0" max="8" value="${design.blur}" oninput="setD('blur',this.value)"></div></div></div></div><button class="primary" onclick="publish()">Publish wallpaper</button>`);preview()}
function tab(n,b){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.getElementById('p-'+n).classList.add('active');b.classList.add('active')}
function setD(k,v){design[k]=v;preview()}function pal(a,b,c){design.c1=a;design.c2=b;design.c3=c;design.image='';preview()}function addD(s){design.decor.push({symbol:s,x:Math.random()*75+8,y:Math.random()*75+8,size:25+Math.random()*35,color:'#fff',opacity:.8});preview()}
function preview(){let x=document.getElementById('prev');if(!x)return;x.style.background=bg();x.style.color=design.text;x.style.filter=`brightness(${design.brightness}%) contrast(${design.contrast}%) blur(${design.blur}px)`;x.innerHTML=`<div class="content"><div class="title" style="font-family:${design.font};font-size:${design.ts}px">${esc(design.title)}</div><div class="subtitle" style="font-family:${design.font};font-size:${design.ss}px">${esc(design.subtitle)}</div></div>${design.decor.map(d=>`<div class="decor" style="left:${d.x}%;top:${d.y}%;font-size:${d.size}px;color:${d.color};opacity:${d.opacity}">${esc(d.symbol)}</div>`).join('')}`}
async function publish(){let {error}=await db.from('wallpapers').insert({user_id:user.id,title:design.title,subtitle:design.subtitle,caption:'A wallpaper I made on DreamWall ✨',background:bg(),text_color:design.text,font:design.font,title_size:Number(design.ts),subtitle_size:Number(design.ss),decorations:design.decor,brightness:Number(design.brightness),contrast:Number(design.contrast),blur:Number(design.blur)});if(error)return toast(error.message);close();toast('Published! ✨');home()}
function profile(){if(me)viewProfile(user.id);else editProfile()}
init();
</script></body></html>
