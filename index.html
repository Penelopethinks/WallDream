<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DreamWall</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fbf7ff,#effff9);color:#493957}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:5;background:#ffffffed;backdrop-filter:blur(12px);border-bottom:1px solid #eadff0}.nav{max-width:1100px;margin:auto;min-height:64px;display:flex;gap:10px;align-items:center;padding:10px 16px}.brand{font-size:27px;font-weight:900;background:linear-gradient(90deg,#9872ff,#ff8fbd,#69d8bc);-webkit-background-clip:text;color:transparent;white-space:nowrap}.search{flex:1;min-width:80px;border:1px solid #e2d8e8;border-radius:22px;padding:10px 14px}.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700;background:#eee5ff;color:#5f4088}.primary{background:linear-gradient(100deg,#9872ff,#ff8fbd);color:white}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#dccaff,#b9f0df);font-weight:800;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.layout{max-width:1100px;margin:auto;padding:22px 16px}.feed{max-width:650px;margin:auto}.card{background:white;border:1px solid #eadff0;border-radius:20px;box-shadow:0 8px 28px #5b396010;margin-bottom:18px;overflow:hidden}.head{display:flex;align-items:center;gap:10px;padding:13px}.grow{flex:1}.muted{color:#8c7d98;font-size:13px}.wall{min-height:390px;display:grid;place-items:center;position:relative;padding:35px;text-align:center;overflow:hidden}.wall>div{position:relative;z-index:1}.title{font-weight:900;line-height:1.05;white-space:pre-wrap;word-break:break-word}.sub{margin-top:12px;white-space:pre-wrap}.decor{position:absolute;z-index:0}.body{padding:12px 15px}.actions{display:flex;gap:8px}.icon{border:0;background:transparent;font-size:22px;padding:5px}.liked{color:#e65391}.comment{display:flex;gap:8px;margin-top:9px}.comment input{flex:1;border:1px solid #eadff0;border-radius:20px;padding:9px 12px}.comment button{border:0;border-radius:20px;padding:8px 13px;background:#eee5ff}.stories{display:flex;gap:12px;overflow:auto;padding:5px 2px 18px}.story{text-align:center;min-width:64px;font-size:11px}.ring{width:58px;height:58px;padding:3px;border-radius:50%;margin:auto;background:linear-gradient(135deg,#ff72b5,#9872ff,#69d8bc)}.ring .avatar{width:100%;height:100%;border:3px solid white}.create{padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{width:100%;padding:11px;border:1px solid #e2d8e8;border-radius:12px;margin:5px 0}.label{font-size:12px;font-weight:800;margin-top:9px}.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.color{width:52px;height:40px;padding:2px}.people{max-width:700px;margin:auto}.person{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid #eee5f0}.modal{position:fixed;inset:0;background:#24152b88;display:grid;place-items:center;padding:15px;z-index:20}.modalbox{width:min(700px,100%);max-height:90vh;overflow:auto;background:white;border-radius:20px;padding:18px}.close{float:right;border:0;border-radius:50%;width:32px;height:32px}.empty{text-align:center;padding:45px;color:#8c7d98}.toast{position:fixed;bottom:18px;right:18px;background:#493957;color:white;padding:12px 16px;border-radius:12px;z-index:50}@media(max-width:700px){.nav button{font-size:11px;padding:8px}.brand{font-size:22px}.grid{grid-template-columns:1fr}.wall{min-height:350px}}
</style>
</head>
<body><div id="app"></div>
<script>
const SUPABASE_URL='https://kcybwrdtnlflevndmzfn.supabase.co';
const SUPABASE_KEY='sb_publishable_XhOq8P5tdMgjWDKZEvgsgg_hcALWg48';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null,me=null,people=[],posts=[],liked=new Set();
const esc=x=>String(x??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
function toast(x){const d=document.createElement('div');d.className='toast';d.textContent=x;document.body.appendChild(d);setTimeout(()=>d.remove(),2500)}
function av(p){return p&&p.avatar_url?`<div class="avatar"><img src="${esc(p.avatar_url)}"></div>`:`<div class="avatar">${esc((p?.username||p?.real_name||'?')[0].toUpperCase())}</div>`}
async function start(){const s=await db.auth.getSession();if(!s.data.session){login();return}user=s.data.session.user;await load();render()}
async function load(){let a=await db.from('profiles').select('*').order('created_at',{ascending:false});people=a.data||[];me=people.find(x=>x.id===user.id)||null;let w=await db.from('wallpapers').select('*').order('created_at',{ascending:false});posts=w.data||[];let l=await db.from('likes').select('wallpaper_id').eq('user_id',user.id);liked=new Set((l.data||[]).map(x=>x.wallpaper_id));}
function login(){document.getElementById('app').innerHTML=`<main style="min-height:100vh;display:grid;place-items:center;padding:18px"><section class="card" style="width:min(430px,100%);padding:30px"><div class="brand" style="text-align:center;font-size:40px">DreamWall</div><p style="text-align:center;color:#8c7d98">Create. Share. Dream. ✨</p><div id="auth"></div></section></main>`;authForm(false)}
function authForm(sign){document.getElementById('auth').innerHTML=`<h2 style="text-align:center">${sign?'Create account':'Welcome back'}</h2>${sign?'<input id="name" class="field" placeholder="Your name"><input id="username" class="field" placeholder="Username">':''}<input id="email" class="field" type="email" placeholder="Email"><input id="password" class="field" type="password" placeholder="Password"><button class="btn primary" style="width:100%;margin-top:8px" onclick="auth(${sign})">${sign?'Create account':'Sign in'}</button><p id="msg" style="font-size:13px"></p><button class="btn" style="width:100%" onclick="authForm(${!sign})">${sign?'Already have an account? Sign in':'New here? Create an account'}</button>`}
async function auth(sign){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password)return msg('Enter your email and password.');if(sign){const name=document.getElementById('name').value.trim(),username=document.getElementById('username').value.trim().toLowerCase().replace(/\s+/g,'_');if(username.length<3)return msg('Username needs at least 3 characters.');let q=await db.from('profiles').select('id').eq('username',username).maybeSingle();if(q.data)return msg('That username is already taken.');if(q.error)return msg(q.error.message);let r=await db.auth.signUp({email,password});if(r.error)return msg(r.error.message);if(!r.data.session)return msg('Account created. If email confirmation is enabled, confirm the email and then sign in.');user=r.data.user;let p=await db.from('profiles').insert({id:user.id,username,real_name:name,account_type:'real'});if(p.error)return msg(p.error.message)}else{let r=await db.auth.signInWithPassword({email,password});if(r.error)return msg(r.error.message);user=r.data.user}await load();render()}
function msg(x){document.getElementById('msg').textContent=x;document.getElementById('msg').style.color='#a13d58'}
function nav(){return `<header class="top"><div class="nav"><div class="brand">DreamWall</div><input class="search" placeholder="Search creators" oninput="search(this.value)"><button class="btn" onclick="home()">Home</button><button class="btn" onclick="create()">＋ Create</button><button class="btn" onclick="showPeople()">People</button><button class="btn" onclick="showProfile(me.id)">${av(me)}</button></div></header>`}
function render(){home()}
function home(){document.getElementById('app').innerHTML=nav()+`<main class="layout"><div class="feed"><div class="stories">${people.slice(0,12).map(p=>`<div class="story" onclick="showProfile('${p.id}')"><div class="ring">${av(p)}</div>@${esc(p.username)}</div>`).join('')}</div>${posts.length?posts.map(postHTML).join(''):'<div class="card empty">No wallpapers yet.<br><br>Be the first person to create one! 🎨</div>'}</div></main>`}
function postHTML(p){const owner=people.find(x=>x.id===p.user_id)||{username:'Dreamer'};let bg=p.background||'#e7ddff';return `<article class="card"><div class="head" onclick="showProfile('${owner.id}')">${av(owner)}<div class="grow"><b>@${esc(owner.username)}</b><div class="muted">${owner.account_type==='ai'?'🤖 AI creator':'Real creator'}</div></div></div><div class="wall" style="background:${esc(bg)};color:${esc(p.text_color||'#493957')};font-family:${esc(p.font||'Arial')}">${(p.decorations||[]).map(d=>`<span class="decor" style="left:${d.x}%;top:${d.y}%;font-size:${d.size}px">${esc(d.v)}</span>`).join('')}<div><div class="title" style="font-size:${Math.min(p.title_size||52,65)}px">${esc(p.title||'DreamWall')}</div><div class="sub">${esc(p.subtitle||'')}</div></div></div><div class="body"><div class="actions"><button class="icon ${liked.has(p.id)?'liked':''}" onclick="likePost('${p.id}')">${liked.has(p.id)?'♥':'♡'}</button><button class="icon" onclick="comment('${p.id}')">💬</button><button class="icon" onclick="recreate('${p.id}')">↗</button>${p.user_id===user.id?`<button class="icon" onclick="deletePost('${p.id}')">🗑️</button>`:''}</div><b>${p.likes_count||0} likes</b><div>${esc(p.caption||'')}</div><div class="comment"><input id="c-${p.id}" placeholder="Add a comment..."><button onclick="addComment('${p.id}')">Post</button></div></div></article>`}
async function likePost(id){if(liked.has(id)){let r=await db.from('likes').delete().eq('wallpaper_id',id).eq('user_id',user.id);if(r.error)return toast(r.error.message);liked.delete(id)}else{let r=await db.from('likes').insert({wallpaper_id:id,user_id:user.id});if(r.error)return toast(r.error.message);liked.add(id)}await load();home()}
async function addComment(id){let e=document.getElementById('c-'+id),text=e.value.trim();if(!text)return;let r=await db.from('comments').insert({wallpaper_id:id,user_id:user.id,body:text});if(r.error)toast(r.error.message);else{e.value='';toast('Comment posted!')}}
async function deletePost(id){if(!confirm('Delete this wallpaper?'))return;let r=await db.from('wallpapers').delete().eq('id',id).eq('user_id',user.id);if(r.error)return toast(r.error.message);await load();home()}
function create(seed=null){let p=seed?posts.find(x=>x.id===seed):null;document.getElementById('app').innerHTML=nav()+`<main class="layout"><section class="feed"><div class="card create"><h2>🎨 Create a wallpaper</h2><div class="grid"><div><div class="label">Title</div><input id="wt" class="field" value="${esc(p?.title||'My Dream Wallpaper')}"></div><div><div class="label">Subtitle</div><input id="ws" class="field" value="${esc(p?.subtitle||'Make it yours ✨')}"></div></div><div class="label">Background</div><div class="tools"><input id="bg" class="color" type="color" value="#d9c8ff"><select id="font" class="field" style="width:auto"><option>Arial</option><option>Georgia</option><option>Verdana</option><option>Trebuchet MS</option><option>Courier New</option><option>Impact</option></select></div><div class="label">Text color</div><input id="tc" class="color" type="color" value="#493957"><div class="label">Title size</div><input id="size" class="field" type="range" min="24" max="90" value="52"><div class="label">Decorations</div><input id="dec" class="field" placeholder="✨ 🌸 🦋 ☁️ ⭐ (separate with spaces)"><div class="label">Caption</div><textarea id="cap" class="field" rows="3" placeholder="Tell people about your wallpaper..."></textarea><div class="tools"><button class="btn" onclick="randomize()">🎲 Surprise me</button><button class="btn primary" onclick="publish()">Publish wallpaper</button></div><div id="preview" style="margin-top:18px"></div></div></section></main>`;preview()}
function preview(){let e=document.getElementById('preview');if(!e)return;e.innerHTML=`<div class="wall" style="background:${document.getElementById('bg').value};color:${document.getElementById('tc').value};font-family:${document.getElementById('font').value}"><div><div class="title" style="font-size:${document.getElementById('size').value}px">${esc(document.getElementById('wt').value)}</div><div class="sub">${esc(document.getElementById('ws').value)}</div></div></div>`;['wt','ws','bg','tc','font','size','dec'].forEach(id=>document.getElementById(id)?.addEventListener('input',preview))}
function randomize(){const c=['#d9c8ff','#ffd1e5','#c9f5e8','#fff0b8','#cfe2ff','#ead7ff'];document.getElementById('bg').value=c[Math.floor(Math.random()*c.length)];document.getElementById('wt').value=['Dream Big','Good Vibes','Stay Sparkly','Dream On','You Got This'][Math.floor(Math.random()*5)];document.getElementById('dec').value='✨ 🌸 🦋';preview()}
async function publish(){let dec=document.getElementById('dec').value.split(/\s+/).filter(Boolean).map((v,i)=>({v,x:10+i*15,y:10+(i%3)*30,size:30}));let p={user_id:user.id,title:document.getElementById('wt').value,subtitle:document.getElementById('ws').value,background:document.getElementById('bg').value,text_color:document.getElementById('tc').value,font:document.getElementById('font').value,title_size:Number(document.getElementById('size').value),caption:document.getElementById('cap').value,decorations:dec};let r=await db.from('wallpapers').insert(p);if(r.error)return toast(r.error.message);await load();toast('Wallpaper published! ✨');home()}
function showPeople(){document.getElementById('app').innerHTML=nav()+`<main class="layout"><section class="people card"><div style="padding:18px"><h2>👥 DreamWall creators</h2>${people.filter(p=>p.id!==user.id).map(p=>`<div class="person">${av(p)}<div class="grow"><b>@${esc(p.username)}</b><div class="muted">${p.account_type==='ai'?'🤖 AI creator':'Real creator'}</div></div><button class="btn" onclick="showProfile('${p.id}')">View</button></div>`).join('')||'<div class="empty">No other creators yet.</div>'}</div></section></main>`}
function search(q){if(!q)return;let found=people.filter(p=>(p.username||'').toLowerCase().includes(q.toLowerCase()));toast(found.length+' creator'+(found.length===1?'':'s')+' found')}
function showProfile(id){let p=people.find(x=>x.id===id);if(!p)return;let mine=p.id===user.id,ps=posts.filter(x=>x.user_id===id);document.getElementById('app').innerHTML=nav()+`<main class="layout"><section class="feed"><div class="card" style="padding:20px"><div style="display:flex;gap:18px;align-items:center">${av(p)}<div class="grow"><h2 style="margin:0">@${esc(p.username)}</h2><div class="muted">${esc(p.real_name||'Creator')} · ${p.account_type==='ai'?'🤖 AI creator':'✨ Real creator'}</div><p>${ps.length} wallpapers</p></div>${!mine&&p.account_type!=='ai'?`<button class="btn primary" onclick="toast('Messaging will be connected here')">Message</button>`:''}</div></div>${ps.map(postHTML).join('')||'<div class="card empty">No wallpapers yet.</div>'}</section></main>`}
function recreate(id){create(id)}
window.addEventListener('error',e=>console.error('DreamWall:',e.error||e.message));start();
</script></body></html>
