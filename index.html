<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DreamWall</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#3f3150;--muted:#8c7d98;--line:#eadff0;--card:#fff;--bg:#faf7ff;--pink:#ff8fbd;--purple:#9b76ff;--mint:#79d9bf}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(135deg,#faf7ff,#f1fffb);color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.nav{max-width:1180px;margin:auto;height:64px;display:flex;align-items:center;gap:12px;padding:0 18px}.brand{font-size:27px;font-weight:900;background:linear-gradient(90deg,var(--purple),var(--pink),var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}.search{flex:1;max-width:360px;border:1px solid var(--line);border-radius:25px;padding:10px 15px;background:#f8f5fb;outline:0}.navbtn{border:0;background:transparent;color:var(--ink);font-weight:700;padding:9px 10px;border-radius:12px}.navbtn:hover{background:#f2ebf8}.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#d9c5ff,#b9f1e0);display:grid;place-items:center;font-weight:800;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.newring{padding:3px;border-radius:50%;background:linear-gradient(135deg,#ff78b4,#9a72ff,#65d9bd)}
.layout{max-width:1180px;margin:auto;display:grid;grid-template-columns:230px minmax(0,650px) 250px;gap:22px;padding:24px 18px}.panel,.post,.composer,.modalbox{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 35px rgba(75,45,95,.06)}.panel{padding:14px;height:max-content;position:sticky;top:86px}.sidebtn{width:100%;border:0;background:transparent;text-align:left;padding:12px;border-radius:12px;color:var(--ink);font-weight:700}.sidebtn.active,.sidebtn:hover{background:#f3ecfa}.sideprofile{display:flex;align-items:center;gap:10px;padding:8px}.muted{color:var(--muted)}.tiny{font-size:12px}.feedhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.stories{display:flex;gap:14px;overflow:auto;padding:4px 2px 16px}.story{min-width:70px;text-align:center;font-size:12px}.story .ring{width:58px;height:58px;margin:auto;border-radius:50%;padding:3px;background:linear-gradient(135deg,#ff75b5,#9872ff,#65d9bd)}.story .ring .avatar{width:100%;height:100%;border:3px solid white}.post{overflow:hidden;margin-bottom:18px}.posthead{display:flex;align-items:center;gap:10px;padding:13px 15px}.postuser{flex:1}.postuser b{font-size:14px}.postuser span{display:block;font-size:11px;color:var(--muted)}.more{border:0;background:transparent;font-size:20px}.wall{aspect-ratio:1/1;display:grid;place-items:center;position:relative;overflow:hidden;text-align:center;padding:30px;background-size:cover;background-position:center}.wallinner{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:1}.walltitle{font-weight:900;line-height:1.05;white-space:pre-wrap;word-break:break-word}.wallsub{margin-top:12px;white-space:pre-wrap;word-break:break-word}.decor{position:absolute;z-index:0;pointer-events:none}.postbody{padding:12px 15px}.actions{display:flex;gap:8px;align-items:center}.iconbtn{border:0;background:transparent;padding:7px 5px;font-size:22px;color:var(--ink)}.iconbtn.liked{color:#e85a91}.caption{margin:7px 0}.comments{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}.comment{font-size:13px;margin:6px 0}.comment b{margin-right:4px}.commentform{display:flex;gap:8px;margin-top:9px}.commentform input{flex:1;border:1px solid var(--line);border-radius:18px;padding:9px 12px;outline:0}.commentform button{border:0;background:#f0e8f8;border-radius:18px;padding:8px 13px;font-weight:700}.righttitle{font-weight:800;margin-bottom:10px}.person{display:flex;align-items:center;gap:10px;padding:9px 0}.person .grow{flex:1}.follow{border:0;background:#eee6ff;color:#7049a0;border-radius:10px;padding:7px 10px;font-weight:700}.composer{padding:18px;margin-bottom:18px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field,.textarea,.select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:0;color:var(--ink)}.field:focus,.textarea:focus,.select:focus{border-color:#a987e8}.label{font-size:12px;font-weight:800;margin:10px 0 5px}.colorrow{display:flex;gap:8px;align-items:center}.color{width:48px;height:40px;padding:2px;border:1px solid var(--line);border-radius:10px;background:white}.range{width:100%}.primary{border:0;border-radius:12px;padding:11px 15px;background:linear-gradient(100deg,var(--purple),var(--pink));color:#fff;font-weight:800}.secondary{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:#fff;color:var(--ink);font-weight:700}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.profilepage{max-width:800px;margin:auto}.profilehero{display:flex;gap:20px;align-items:center;padding:20px}.bigavatar{width:90px;height:90px;border-radius:50%;object-fit:cover;background:#eadfff;display:grid;place-items:center;font-size:30px;font-weight:900;overflow:hidden}.bigavatar img{width:100%;height:100%;object-fit:cover}.profileinfo{flex:1}.profileinfo h2{margin:0}.profilestats{display:flex;gap:20px;margin-top:12px}.profileposts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.profilethumb{aspect-ratio:1;background:#eee;border-radius:8px;overflow:hidden;cursor:pointer}.profilethumb .wall{height:100%;aspect-ratio:auto}.modal{position:fixed;inset:0;background:rgba(38,25,48,.45);display:grid;place-items:center;padding:18px;z-index:100}.modalbox{max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:20px}.close{float:right;border:0;background:#f2ebf7;border-radius:50%;width:34px;height:34px}.chat{height:420px;overflow:auto;background:#faf8fc;border-radius:14px;padding:14px}.bubble{max-width:75%;padding:9px 12px;border-radius:15px;margin:7px 0}.mine{margin-left:auto;background:#e8ddff}.theirs{background:#fff;border:1px solid var(--line)}.toast{position:fixed;right:18px;bottom:18px;background:#3f3150;color:#fff;padding:12px 16px;border-radius:12px;z-index:200;box-shadow:0 10px 30px #0002}.empty{text-align:center;padding:45px 20px;color:var(--muted)}.message{padding:12px;border-radius:12px;margin-top:10px}.message.error{background:#fff0f3;color:#a13d58}.message.success{background:#eafff7;color:#28745e}
@media(max-width:900px){.layout{grid-template-columns:1fr}.left,.right{display:none}.search{max-width:none}.nav{gap:6px}.brand{font-size:23px}.navbtn{font-size:12px}.layout{padding:15px 10px}.wall{aspect-ratio:4/5}}
</style>
</head>
<body><div id="app"></div>
<script>
const URL="https://kcybwrdtnlflevndmzfn.supabase.co",KEY="sb_publishable_XhOq8P5tdMgjWDKZEvgsgg_hcALWg48";const db=window.supabase.createClient(URL,KEY);let user=null,profile=null,people=[],posts=[],following=new Set(),liked=new Set(),activePage="home";
const esc=s=>String(s??"").replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const initials=p=>(p?.username||p?.real_name||"?").slice(0,1).toUpperCase();
function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
function avatar(p,big=false){let x=big?'bigavatar':'avatar';return p?.avatar_url?`<div class="${x}"><img src="${esc(p.avatar_url)}"></div>`:`<div class="${x}">${esc(initials(p))}</div>`}
function wallStyle(p){return `background:${p.background||'linear-gradient(135deg,#d8c5ff,#bff3e2)'};filter:brightness(${p.brightness||100}%) contrast(${p.contrast||100}%);font-family:${esc(p.font||'Arial')};color:${esc(p.text_color||'#493957')}`}
function decorHTML(a=[]){return a.map(d=>`<span class="decor" style="left:${d.x||10}%;top:${d.y||10}%;font-size:${d.size||40}px;transform:rotate(${d.r||0}deg)">${esc(d.v)}</span>`).join('')}
function wallpaper(p,compact=false){return `<div class="wall" style="${wallStyle(p)}">${decorHTML(p.decorations||[])}<div class="wallinner"><div class="walltitle" style="font-size:${compact?Math.min(p.title_size||52,28):p.title_size||52}px">${esc(p.title||'DreamWall')}</div><div class="wallsub" style="font-size:${compact?12:p.subtitle_size||16}px">${esc(p.subtitle||'')}</div></div></div>`}
async function boot(){let s=await db.auth.getSession();if(s.data.session){user=s.data.session.user;await loadProfile();if(!profile){await makeProfileFallback()}await loadData();render()}else{loginScreen()}}
async function loadProfile(){let r=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();profile=r.data}
async function makeProfileFallback(){let name=(user.user_metadata?.name||'Dreamer').toString(),uname=('dreamer_'+user.id.slice(0,6)).toLowerCase();let r=await db.from('profiles').insert({id:user.id,username:uname,real_name:name,account_type:'real'});if(!r.error)profile={id:user.id,username:uname,real_name:name,account_type:'real'}}
async function loadData(){let [p,l,f,w]=await Promise.all([db.from('profiles').select('*').order('created_at',{ascending:false}),db.from('likes').select('wallpaper_id').eq('user_id',user.id),db.from('follows').select('following_id').eq('follower_id',user.id),db.from('wallpapers').select('*').order('created_at',{ascending:false})]);people=p.data||[];liked=new Set((l.data||[]).map(x=>x.wallpaper_id));following=new Set((f.data||[]).map(x=>x.following_id));posts=w.data||[]}
function loginScreen(){document.getElementById('app').innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;padding:20px"><div class="card" style="max-width:440px;padding:32px"><div class="brand" style="text-align:center;font-size:40px">DreamWall</div><p class="muted" style="text-align:center">Create. Share. Dream. ✨</p><div id="authbox"></div></div></div>`;authForm('login')}
function authForm(mode){let s=mode==='signup';document.getElementById('authbox').innerHTML=`<h2 style="text-align:center">${s?'Create your account':'Welcome back'}</h2>${s?`<input id="name" class="field" placeholder="Your name"><input id="uname" class="field" placeholder="Username">`:''}<input id="email" class="field" type="email" placeholder="Email"><input id="pass" class="field" type="password" placeholder="Password"><button class="primary" style="width:100%;margin-top:10px" onclick="auth('${mode}')">${s?'Create account':'Sign in'}</button><div id="authmsg"></div><button class="secondary" style="width:100%;margin-top:10px" onclick="authForm('${s?'login':'signup'}')">${s?'Already have an account? Sign in':'New to DreamWall? Create an account'}</button>`}
function authMsg(t,good=false){document.getElementById('authmsg').innerHTML=`<div class="message ${good?'success':'error'}">${esc(t)}</div>`}
async function auth(mode){let email=document.getElementById('email').value.trim(),pass=document.getElementById('pass').value;if(!email||!pass)return authMsg('Enter your email and password.');if(mode==='signup'){let name=document.getElementById('name').value.trim(),uname=document.getElementById('uname').value.trim().toLowerCase().replace(/\s+/g,'_');if(uname.length<3)return authMsg('Username needs at least 3 characters.');let taken=await db.from('profiles').select('id').eq('username',uname).maybeSingle();if(taken.error)return authMsg(taken.error.message);if(taken.data)return authMsg('That username is already taken.');let r=await db.auth.signUp({email,password:pass});if(r.error)return authMsg(r.error.message);if(!r.data.session)return authMsg('Account created! If email confirmation is enabled, confirm your email first, then sign in.',true);user=r.data.user;let pr=await db.from('profiles').insert({id:user.id,username:uname,real_name:name,account_type:'real'});if(pr.error)return authMsg(pr.error.message);profile={id:user.id,username:uname,real_name:name,account_type:'real'};await loadData();render()}else{let r=await db.auth.signInWithPassword({email,password:pass});if(r.error)return authMsg(r.error.message);user=r.data.user;await loadProfile();if(!profile)await makeProfileFallback();await loadData();render()}}
function nav(){return `<header class="top"><div class="nav"><div class="brand">DreamWall</div><input class="search" placeholder="Search creators" oninput="searchPeople(this.value)"><button class="navbtn" onclick="page('home')">Home</button><button class="navbtn" onclick="page('create')">＋ Create</button><button class="navbtn" onclick="page('people')">People</button><button class="navbtn" onclick="page('messages')">Messages</button><button class="navbtn" onclick="page('profile')">${avatar(profile)}</button></div></header>`}
function render(){document.getElementById('app').innerHTML=nav()+`<div class="layout"><aside class="left panel"><div class="sideprofile">${avatar(profile)}<div><b>@${esc(profile?.username)}</b><div class="tiny muted">${esc(profile?.real_name||'Creator')}</div></div></div><hr style="border:0;border-top:1px solid var(--line)"><button class="sidebtn active" onclick="page('home')">🏠 Home</button><button class="sidebtn" onclick="page('create')">🎨 Create wallpaper</button><button class="sidebtn" onclick="page('people')">👥 People</button><button class="sidebtn" onclick="page('messages')">💬 Messages</button><button class="sidebtn" onclick="page('profile')">👤 My profile</button><button class="sidebtn" onclick="logout()">↪ Sign out</button></aside><main id="main"></main><aside class="right panel"><div class="righttitle">Creators on DreamWall</div><div id="suggestions"></div></aside></div>`;drawSuggestions();page(activePage)}
function drawSuggestions(){let el=document.getElementById('suggestions');if(!el)return;let a=people.filter(p=>p.id!==user.id).slice(0,7);el.innerHTML=a.length?a.map(p=>`<div class="person">${avatar(p)}<div class="grow"><b>@${esc(p.username)}</b><div class="tiny muted">${p.account_type==='ai'?'AI creator':'Creator'}</div></div><button class="follow" onclick="toggleFollow('${p.id}')">${following.has(p.id)?'Following':'Follow'}</button></div>`).join(''):'<div class="muted tiny">No other creators yet.</div>'}
async function page(n){activePage=n;await loadData();let m=document.getElementById('main');if(n==='home')m.innerHTML=homeHTML();if(n==='create')m.innerHTML=createHTML();if(n==='people')m.innerHTML=peopleHTML();if(n==='profile')m.innerHTML=profileHTML(profile);if(n==='messages')await messagesPage();drawSuggestions()}
function stories(){return `<div class="stories">${people.filter(p=>p.id!==user.id).slice(0,12).map(p=>`<div class="story" onclick="openProfile('${p.id}')"><div class="ring">${avatar(p)}</div><div>@${esc(p.username)}</div></div>`).join('')}</div>`}
function homeHTML(){let h=`<div class="feedhead"><div><h2 style="margin:0">Home</h2><span class="muted tiny">Real posts from DreamWall creators</span></div><button class="secondary" onclick="page('create')">＋ New wallpaper</button></div>${stories()}`;return h+(posts.length?posts.map(postCard).join(''):`<div class="empty panel">No wallpapers yet.<br><br><button class="primary" onclick="page('create')">Create the first one ✨</button></div>`)}
async function counts(id){let r=await db.from('likes').select('*',{count:'exact',head:true}).eq('wallpaper_id',id);return r.count||0}
function postCard(p){let o=people.find(x=>x.id===p.user_id)||{username:'creator'},mine=p.user_id===user.id;return `<article class="post"><div class="posthead"><div onclick="openProfile('${o.id}')" style="cursor:pointer">${avatar(o)}</div><div class="postuser"><b>@${esc(o.username)} ${o.account_type==='ai'?'🤖':''}</b><span>${o.account_type==='ai'?'AI creator':'Creator'} · ${new Date(p.created_at).toLocaleDateString()}</span></div>${mine?`<button class="more" onclick="deletePost('${p.id}')">⋯</button>`:''}</div>${wallpaper(p)}<div class="postbody"><div class="actions"><button class="iconbtn ${liked.has(p.id)?'liked':''}" onclick="toggleLike('${p.id}')">${liked.has(p.id)?'♥':'♡'}</button><button class="iconbtn" onclick="openComments('${p.id}')">💬</button><button class="iconbtn" onclick="recreate('${p.id}')">🔄</button><button class="iconbtn" onclick="sharePost('${p.id}')">↗</button></div><div class="caption">${p.caption?esc(p.caption):''}</div><div id="comments-${p.id}" class="comments">${commentsHTML(p.id)}</div></div></article>`}
function commentsHTML(id){return `<div class="commentform"><input id="comment-${id}" placeholder="Add a comment..."><button onclick="comment('${id}')">Post</button></div>`}
async function toggleLike(id){let r=liked.has(id)?await db.from('likes').delete().eq('user_id',user.id).eq('wallpaper_id',id):await db.from('likes').insert({user_id:user.id,wallpaper_id:id});if(r.error)return toast(r.error.message);await loadData();page('home')}
async function comment(id){let e=document.getElementById('comment-'+id),text=e?.value.trim();if(!text)return;let r=await db.from('comments').insert({wallpaper_id:id,user_id:user.id,text});if(r.error)return toast(r.error.message);e.value='';await openComments(id)}
async function openComments(id){let r=await db.from('comments').select('*').eq('wallpaper_id',id).order('created_at',{ascending:true}),html=(r.data||[]).map(c=>{let p=people.find(x=>x.id===c.user_id)||{};return `<div class="comment"><b>@${esc(p.username||'creator')}</b>${esc(c.text)}</div>`}).join('');let e=document.getElementById('comments-'+id);if(e)e.innerHTML=html+commentsHTML(id)}
function createHTML(){return `<div class="composer"><div class="feedhead"><div><h2 style="margin:0">Create a wallpaper</h2><span class="muted tiny">Choose colors, gradients, patterns, fonts, sizes, effects and decorations.</span></div><button class="secondary" onclick="page('home')">Cancel</button></div><div id="preview" style="overflow:hidden;border-radius:20px;margin:10px 0">${wallpaper(defaultWall())}</div><div class="grid2"><div><div class="label">Title</div><input id="ctitle" class="field" value="Your DreamWall"></div><div><div class="label">Subtitle</div><input id="csub" class="field" value="Make something beautiful"></div></div><div class="label">Caption</div><textarea id="ccap" class="textarea" rows="2" placeholder="Tell people about your wallpaper..."></textarea><div class="label">Background</div><select id="cbg" class="select" onchange="updatePreview()"><option value="linear-gradient(135deg,#d9c6ff,#baf2e1)">Lavender Mint</option><option value="linear-gradient(135deg,#ffb4d5,#ffd5a8)">Pink Peach</option><option value="linear-gradient(135deg,#9fdcff,#d4c2ff)">Sky Dream</option><option value="linear-gradient(135deg,#222,#704b9b)">Midnight</option><option value="radial-gradient(circle at 20% 20%,#ff9fc5,#9b76ff 45%,#65d9bd)">Rainbow Glow</option><option value="repeating-linear-gradient(45deg,#fff 0 12px,#f0e7ff 12px 24px)">Candy Stripes</option><option value="custom">My two colors</option></select><div class="label">Pick any colors</div><div class="colorrow"><input id="c1" class="color" type="color" value="#d9c6ff" onchange="updatePreview()"><input id="c2" class="color" type="color" value="#baf2e1" onchange="updatePreview()"></div><div class="grid2"><div><div class="label">Text color</div><input id="ctext" class="color" type="color" value="#493957" onchange="updatePreview()"></div><div><div class="label">Font</div><select id="cfont" class="select" onchange="updatePreview()"><option>Arial</option><option>Georgia</option><option>Trebuchet MS</option><option>Courier New</option><option>Impact</option><option>Verdana</option></select></div></div><div class="grid2"><div><div class="label">Title size</div><input id="tsize" class="range" type="range" min="20" max="100" value="52" oninput="updatePreview()"></div><div><div class="label">Subtitle size</div><input id="ssize" class="range" type="range" min="10" max="40" value="16" oninput="updatePreview()"></div></div><div class="grid2"><div><div class="label">Brightness</div><input id="bright" class="range" type="range" min="60" max="140" value="100" oninput="updatePreview()"></div><div><div class="label">Contrast</div><input id="contrast" class="range" type="range" min="60" max="140" value="100" oninput="updatePreview()"></div></div><div class="grid2"><div><div class="label">Blur</div><input id="blur" class="range" type="range" min="0" max="6" value="0" oninput="updatePreview()"></div><div><div class="label">Decorations</div><select id="deco" class="select" onchange="updatePreview()"><option value="none">None</option><option value="sparkles">✨ Sparkles</option><option value="hearts">♥ Hearts</option><option value="stars">★ Stars</option><option value="clouds">☁ Clouds</option><option value="flowers">🌸 Flowers</option><option value="mix">✨ ♥ ★ 🌸 Mix</option></select></div></div><div class="toolbar" style="margin-top:15px"><button class="primary" onclick="publishWallpaper()">Publish wallpaper</button><button class="secondary" onclick="randomize()">🎲 Surprise me</button></div></div>`}
function defaultWall(){return {title:'Your DreamWall',subtitle:'Make something beautiful',background:'linear-gradient(135deg,#d9c6ff,#baf2e1)',text_color:'#493957',font:'Arial',title_size:52,subtitle_size:16,decorations:[],brightness:100,contrast:100,blur:0}}
function decorations(){let v=document.getElementById('deco').value,map={sparkles:['✦','✧','✨','⋆'],hearts:['♥','♡','♥'],stars:['★','☆','✦'],clouds:['☁','☁','☁'],flowers:['🌸','✿','❀'],mix:['✨','♥','★','🌸']};return v==='none'?[]:(map[v]||[]).map((x,i)=>({v:x,x:10+i*21,y:10+(i%3)*25,size:30+(i%2)*18,r:i%2?12:-12}))}
function readWallpaper(){let bg=document.getElementById('cbg').value;if(bg==='custom')bg=`linear-gradient(135deg,${document.getElementById('c1').value},${document.getElementById('c2').value})`;return {title:document.getElementById('ctitle').value,subtitle:document.getElementById('csub').value,caption:document.getElementById('ccap').value,background:bg,text_color:document.getElementById('ctext').value,font:document.getElementById('cfont').value,title_size:+document.getElementById('tsize').value,subtitle_size:+document.getElementById('ssize').value,brightness:+document.getElementById('bright').value,contrast:+document.getElementById('contrast').value,blur:+document.getElementById('blur').value,decorations:decorations()}}
function updatePreview(){document.getElementById('preview').innerHTML=wallpaper(readWallpaper())}
function randomize(){let colors=[['#ffd0e3','#c8b3ff'],['#b7f2e1','#b8d9ff'],['#ffe29a','#ff9fc5'],['#25233a','#7653a8'],['#c6ffdd','#fbd786']];let c=colors[Math.floor(Math.random()*colors.length)];document.getElementById('c1').value=c[0];document.getElementById('c2').value=c[1];document.getElementById('cbg').value='custom';document.getElementById('ctitle').value=['Dream Big','Good Vibes','Create Magic','Stay Dreamy','Hello, Beautiful'][Math.floor(Math.random()*5)];document.getElementById('deco').value=['sparkles','hearts','stars','flowers','mix'][Math.floor(Math.random()*5)];updatePreview()}
async function publishWallpaper(){let p=readWallpaper();if(!p.title.trim())return toast('Give your wallpaper a title.');p.user_id=user.id;let r=await db.from('wallpapers').insert(p);if(r.error)return toast(r.error.message);toast('Wallpaper published! ✨');page('home')}
async function deletePost(id){if(!confirm('Delete your wallpaper?'))return;let r=await db.from('wallpapers').delete().eq('id',id);if(r.error)return toast(r.error.message);toast('Wallpaper deleted');page('home')}
function recreate(id){let p=posts.find(x=>x.id===id);if(!p)return;page('create').then(()=>setTimeout(()=>{document.getElementById('ctitle').value=p.title+' — my version';document.getElementById('csub').value=p.subtitle||'';document.getElementById('ccap').value='My version inspired by a DreamWall post';document.getElementById('ctext').value=p.text_color||'#493957';document.getElementById('cfont').value=p.font||'Arial';document.getElementById('tsize').value=p.title_size||52;document.getElementById('ssize').value=p.subtitle_size||16;document.getElementById('bright').value=p.brightness||100;document.getElementById('contrast').value=p.contrast||100;document.getElementById('blur').value=p.blur||0;updatePreview()},80))}
async function sharePost(id){let url=location.href.split('#')[0]+'#wallpaper='+id;try{await navigator.clipboard.writeText(url);toast('Wallpaper link copied!')}catch{toast(url)}}
function peopleHTML(){return `<div class="panel" style="padding:18px"><div class="feedhead"><div><h2 style="margin:0">People</h2><span class="muted tiny">Everyone who has a DreamWall profile</span></div></div><div id="peoplelist">${people.map(personRow).join('')}</div></div>`}
function personRow(p){if(p.id===user.id)return `<div class="person">${avatar(p)}<div class="grow"><b>@${esc(p.username)}</b><div class="tiny muted">You</div></div></div>`;return `<div class="person"><div onclick="openProfile('${p.id}')">${avatar(p)}</div><div class="grow" onclick="openProfile('${p.id}')"><b>@${esc(p.username)}</b><div class="tiny muted">${p.account_type==='ai'?'🤖 AI creator':'Real creator'}</div></div><button class="follow" onclick="toggleFollow('${p.id}')">${following.has(p.id)?'Following':'Follow'}</button>${p.account_type==='real'?`<button class="secondary" onclick="openChat('${p.id}')">Message</button>`:''}</div>`}
function searchPeople(q){if(activePage!=='people'){activePage='people';page('people');return}let list=document.getElementById('peoplelist');if(list){let a=people.filter(p=>(p.username+' '+p.real_name).toLowerCase().includes(q.toLowerCase()));list.innerHTML=a.map(personRow).join('')}}
async function toggleFollow(id){if(following.has(id)){await db.from('follows').delete().eq('follower_id',user.id).eq('following_id',id);following.delete(id)}else{let r=await db.from('follows').insert({follower_id:user.id,following_id:id});if(r.error)return toast(r.error.message);following.add(id)}drawSuggestions();if(activePage==='people')page('people')}
async function openProfile(id){let p=people.find(x=>x.id===id);if(p)document.getElementById('main').innerHTML=profileHTML(p)}
function profileHTML(p){let mine=p.id===user.id,arr=posts.filter(x=>x.user_id===p.id);return `<div class="profilepage panel"><div class="profilehero">${avatar(p,true)}<div class="profileinfo"><h2>@${esc(p.username)} ${p.account_type==='ai'?'🤖':''}</h2><div>${esc(p.real_name||'')}</div><p class="muted">${esc(p.bio||'')}</p><div class="profilestats"><span><b>${arr.length}</b> posts</span></div><div class="toolbar" style="margin-top:12px">${mine?`<button class="secondary" onclick="editProfile()">Edit profile</button>`:`<button class="follow" onclick="toggleFollow('${p.id}')">${following.has(p.id)?'Following':'Follow'}</button>${p.account_type==='real'?`<button class="secondary" onclick="openChat('${p.id}')">Message</button>`:''}`}</div></div></div><div class="profileposts">${arr.map(x=>`<div class="profilethumb" onclick="showPostModal('${x.id}')">${wallpaper(x,true)}</div>`).join('')}</div></div>`}
function editProfile(){document.getElementById('main').innerHTML=`<div class="panel" style="padding:20px"><h2>Edit profile</h2><input id="ename" class="field" value="${esc(profile.real_name||'')}"><input id="ebio" class="field" value="${esc(profile.bio||'')}" placeholder="Bio"><input id="eavatar" class="field" value="${esc(profile.avatar_url||'')}" placeholder="Profile picture URL"><div class="label">Accent</div><input id="eaccent" class="color" type="color" value="${profile.accent||'#c9a4ff'}"><button class="primary" style="margin-top:15px" onclick="saveProfile()">Save changes</button></div>`}
async function saveProfile(){let patch={real_name:document.getElementById('ename').value,bio:document.getElementById('ebio').value,avatar_url:document.getElementById('eavatar').value,accent:document.getElementById('eaccent').value};let r=await db.from('profiles').update(patch).eq('id',user.id);if(r.error)return toast(r.error.message);Object.assign(profile,patch);render()}
async function openChat(id){let p=people.find(x=>x.id===id);if(!p||p.account_type==='ai')return toast('AI creators cannot be messaged.');document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="chatmodal"><div class="modalbox"><button class="close" onclick="document.getElementById('chatmodal').remove()">×</button><h2>Chat with @${esc(p.username)}</h2><div id="chatbox" class="chat"></div><div class="commentform"><input id="chatinput" placeholder="Message about wallpapers..."><button class="primary" onclick="sendMessage('${p.id}')">Send</button></div></div></div>`);await loadChat(id)}
async function loadChat(id){let r=await db.from('messages').select('*').or(`and(sender_id.eq.${user.id},receiver_id.eq.${id}),and(sender_id.eq.${id},receiver_id.eq.${user.id})`).order('created_at',{ascending:true});let box=document.getElementById('chatbox');if(!box)return;box.innerHTML=(r.data||[]).map(m=>`<div class="bubble ${m.sender_id===user.id?'mine':'theirs'}">${esc(m.text)}</div>`).join('');box.scrollTop=box.scrollHeight}
async function sendMessage(id){let i=document.getElementById('chatinput'),text=i.value.trim();if(!text)return;let r=await db.from('messages').insert({sender_id:user.id,receiver_id:id,text});if(r.error)return toast(r.error.message);i.value='';await loadChat(id)}
async function messagesPage(){let rec=people.filter(p=>p.id!==user.id&&p.account_type==='real');document.getElementById('main').innerHTML=`<div class="panel" style="padding:20px"><h2>Messages</h2><p class="muted">Message real creators about wallpapers. AI creators cannot be messaged.</p>${rec.map(p=>`<div class="person">${avatar(p)}<div class="grow"><b>@${esc(p.username)}</b></div><button class="primary" onclick="openChat('${p.id}')">Open chat</button></div>`).join('')||'<div class="empty">No other real creators yet.</div>'}</div>`}
function showPostModal(id){let p=posts.find(x=>x.id===id);if(!p)return;document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="postmodal"><div class="modalbox"><button class="close" onclick="document.getElementById('postmodal').remove()">×</button>${wallpaper(p)}</div></div>`)}
async function logout(){await db.auth.signOut();user=null;profile=null;loginScreen()}
boot();
</script></body></html>
