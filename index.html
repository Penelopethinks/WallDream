<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DreamWall</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fbf7ff,#effff9);color:#493957}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:10;background:#ffffffed;backdrop-filter:blur(14px);border-bottom:1px solid #eadff0}.nav{max-width:1100px;margin:auto;min-height:64px;display:flex;gap:10px;align-items:center;padding:10px 16px}.brand{font-size:27px;font-weight:900;background:linear-gradient(90deg,#9872ff,#ff8fbd,#69d8bc);-webkit-background-clip:text;color:transparent;white-space:nowrap}.search{flex:1;min-width:80px;border:1px solid #e2d8e8;border-radius:22px;padding:10px 14px;background:#faf8fc}.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700;background:#eee5ff;color:#5f4088}.primary{background:linear-gradient(100deg,#9872ff,#ff8fbd);color:white}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#dccaff,#b9f0df);font-weight:800;overflow:hidden;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.layout{max-width:1100px;margin:auto;padding:22px 16px}.feed{max-width:650px;margin:auto}.card{background:white;border:1px solid #eadff0;border-radius:20px;box-shadow:0 8px 28px #5b396010;margin-bottom:18px;overflow:hidden}.head{display:flex;align-items:center;gap:10px;padding:13px}.grow{flex:1}.muted{color:#8c7d98;font-size:13px}.wall{min-height:390px;display:grid;place-items:center;position:relative;padding:35px;text-align:center;overflow:hidden}.wall>div{position:relative;z-index:1}.title{font-weight:900;line-height:1.05;white-space:pre-wrap;word-break:break-word}.sub{margin-top:12px;white-space:pre-wrap}.decor{position:absolute;z-index:0}.body{padding:12px 15px}.actions{display:flex;gap:8px}.icon{border:0;background:transparent;font-size:22px;padding:5px}.liked{color:#e65391}.comment{display:flex;gap:8px;margin-top:9px}.comment input{flex:1;border:1px solid #eadff0;border-radius:20px;padding:9px 12px}.comment button{border:0;border-radius:20px;padding:8px 13px;background:#eee5ff}.stories{display:flex;gap:12px;overflow:auto;padding:5px 2px 18px}.story{text-align:center;min-width:64px;font-size:11px}.ring{width:58px;height:58px;padding:3px;border-radius:50%;margin:auto;background:linear-gradient(135deg,#ff72b5,#9872ff,#69d8bc)}.ring .avatar{width:100%;height:100%;border:3px solid white}.create{padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{width:100%;padding:11px;border:1px solid #e2d8e8;border-radius:12px;margin:5px 0}.label{font-size:12px;font-weight:800;margin-top:9px}.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.color{width:52px;height:40px;padding:2px}.people{max-width:700px;margin:auto}.person{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid #eee5f0}.empty{text-align:center;padding:45px;color:#8c7d98}.toast{position:fixed;bottom:18px;right:18px;background:#493957;color:white;padding:12px 16px;border-radius:12px;z-index:50}
.messages{max-width:900px;margin:auto;display:grid;grid-template-columns:280px 1fr;min-height:650px;background:white;border:1px solid #eadff0;border-radius:22px;overflow:hidden;box-shadow:0 10px 35px #5b396010}.conversation-list{border-right:1px solid #eadff0;background:#fff}.conversation-title{padding:20px;font-size:21px;font-weight:900;border-bottom:1px solid #eee5f0}.conversation-search{padding:12px;border-bottom:1px solid #eee5f0}.conversation-search input{width:100%;padding:10px 12px;border:1px solid #eadff0;border-radius:18px;outline:none}.conversation{display:flex;gap:10px;align-items:center;padding:12px 14px;border:0;background:white;width:100%;text-align:left;border-bottom:1px solid #f2edf4}.conversation:hover,.conversation.active{background:#f7f2fb}.conversation-info{min-width:0;flex:1}.conversation-name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.conversation-preview{font-size:12px;color:#8c7d98;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.chat-panel{display:flex;flex-direction:column;min-width:0;min-height:650px}.chat-empty{height:100%;display:grid;place-items:center;text-align:center;padding:30px;color:#8c7d98}.chat-header{height:72px;border-bottom:1px solid #eadff0;display:flex;align-items:center;gap:11px;padding:12px 16px}.chat-header-name{font-weight:900}.chat-header-type{font-size:12px;color:#8c7d98;margin-top:3px}.chat-header button{margin-left:auto}.chat-body{flex:1;overflow-y:auto;padding:18px;background:#fbf9fd}.bubble-row{display:flex;margin:7px 0}.bubble-row.mine{justify-content:flex-end}.bubble{max-width:72%;padding:10px 13px;border-radius:18px;line-height:1.35;word-break:break-word}.bubble.mine{background:linear-gradient(100deg,#9872ff,#b88fff);color:white;border-bottom-right-radius:5px}.bubble.theirs{background:white;border:1px solid #eadff0;border-bottom-left-radius:5px}.bubble-time{font-size:10px;opacity:.65;margin-top:4px}.chat-composer{display:flex;gap:9px;padding:12px;border-top:1px solid #eadff0;background:white}.chat-composer textarea{flex:1;resize:none;height:44px;max-height:110px;border:1px solid #ddd3e8;border-radius:22px;padding:11px 15px;outline:none}.chat-composer textarea:focus{border-color:#9872ff}.send{width:48px;height:44px;border:0;border-radius:22px;background:linear-gradient(100deg,#9872ff,#ff8fbd);color:white;font-size:19px;font-weight:900}.message-note{font-size:12px;color:#8c7d98;text-align:center;padding:7px}.profile{max-width:700px;margin:auto}
@media(max-width:700px){.nav button{font-size:11px;padding:8px}.brand{font-size:22px}.grid{grid-template-columns:1fr}.wall{min-height:350px}.messages{grid-template-columns:1fr;min-height:calc(100vh - 110px)}.conversation-list{display:none}.chat-panel{min-height:calc(100vh - 110px)}.chat-body{min-height:300px}.search{display:none}}
</style>
</head>
<body><div id="app"></div>
<script>
const SUPABASE_URL='https://kcybwrdtnlflevndmzfn.supabase.co';
const SUPABASE_KEY='sb_publishable_XhOq8P5tdMgjWDKZEvgsgg_hcALWg48';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null,me=null,people=[],posts=[],liked=new Set(),activeChat=null,messageTimer=null;
const esc=x=>String(x??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
function toast(x){const d=document.createElement('div');d.className='toast';d.textContent=x;document.body.appendChild(d);setTimeout(()=>d.remove(),2500)}
function av(p){return p&&p.avatar_url?`<div class="avatar"><img src="${esc(p.avatar_url)}"></div>`:`<div class="avatar">${esc((p?.username||p?.real_name||'?')[0].toUpperCase())}</div>`}
async function start(){const s=await db.auth.getSession();if(!s.data.session){login();return}user=s.data.session.user;await load();render()}
async function load(){let a=await db.from('profiles').select('*').order('created_at',{ascending:false});people=a.data||[];me=people.find(x=>x.id===user.id)||null;let w=await db.from('wallpapers').select('*').order('created_at',{ascending:false});posts=w.data||[];let l=await db.from('likes').select('wallpaper_id').eq('user_id',user.id);liked=new Set((l.data||[]).map(x=>x.wallpaper_id))}
function login(){document.getElementById('app').innerHTML=`<main style="min-height:100vh;display:grid;place-items:center;padding:18px"><section class="card" style="width:min(430px,100%);padding:30px"><div class="brand" style="text-align:center;font-size:40px">DreamWall</div><p style="text-align:center;color:#8c7d98">Create. Share. Dream. ✨</p><div id="auth"></div></section></main>`;authForm(false)}
function authForm(sign){document.getElementById('auth').innerHTML=`<h2 style="text-align:center">${sign?'Create account':'Welcome back'}</h2>${sign?'<input id="name" class="field" placeholder="Your name"><input id="username" class="field" placeholder="Username">':''}<input id="email" class="field" type="email" placeholder="Email"><input id="password" class="field" type="password" placeholder="Password"><button class="btn primary" style="width:100%;margin-top:8px" onclick="auth(${sign})">${sign?'Create account':'Sign in'}</button><p id="msg" style="font-size:13px"></p><button class="btn" style="width:100%" onclick="authForm(${!sign})">${sign?'Already have an account? Sign in':'New here? Create an account'}</button>`}
async function auth(sign){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password)return msg('Enter your email and password.');if(sign){const name=document.getElementById('name').value.trim(),username=document.getElementById('username').value.trim().toLowerCase().replace(/\s+/g,'_');if(username.length<3)return msg('Username needs at least 3 characters.');let q=await db.from('profiles').select('id').eq('username',username).maybeSingle();if(q.data)return msg('That username is already taken.');if(q.error)return msg(q.error.message);let r=await db.auth.signUp({email,password});if(r.error)return msg(r.error.message);if(!r.data.session)return msg('Account created. If email confirmation is enabled, confirm the email and then sign in.');user=r.data.user;let p=await db.from('profiles').insert({id:user.id,username,real_name:name,account_type:'real'});if(p.error)return msg(p.error.message)}else{let r=await db.auth.signInWithPassword({email,password});if(r.error)return msg(r.error.message);user=r.data.user}await load();render()}
function msg(x){document.getElementById('msg').textContent=x;document.getElementById('msg').style.color='#a13d58'}
function nav(){return `<header class="top"><div class="nav"><div class="brand">DreamWall</div><input class="search" placeholder="Search creators" oninput="search(this.value)"><button class="btn" onclick="home()">Home</button><button class="btn" onclick="create()">＋ Create</button><button class="btn" onclick="showPeople()">People</button><button class="btn" onclick="showMessages()">Messages</button><button class="btn" onclick="showProfile(me.id)">${av(me)}</button></div></header>`}
function render(){home()}
function home(){document.getElementById('app').innerHTML=nav()+`<main class="layout"><div class="feed"><div class="stories">${people.slice(0,12).map(p=>`<div class="story" onclick="showProfile('${p.id}')"><div class="ring">${av(p)}</div>@${esc(p.username)}</div>`).join('')}</div>${posts.length?posts.map(postHTML).join(''):'<div class="card empty">No wallpapers yet.<br><br>Be the first person to create one! 🎨</div>'}</div></main>`}
function postHTML(p){const owner=people.find(x=>x.id===p.user_id)||{username:'Dreamer'};return `<article class="card"><div class="head" onclick="showProfile('${owner.id}')">${av(owner)}<div class="grow"><b>@${esc(owner.username)}</b><div class="muted">${owner.account_type==='ai'?'🤖 AI creator':'Real creator'}</div></div>${owner.id!==user.id&&owner.account_type!=='ai'?`<button class="btn" onclick="event.stopPropagation();openChat('${owner.id}')">Message</button>`:''}</div><div class="wall" style="background:${esc(p.background||'#e7ddff')};color:${esc(p.text_color||'#493957')};font-family:${esc(p.font||'Arial')}">${(p.decorations||[]).map(d=>`<span class="decor" style="left:${d.x||10}%;top:${d.y||10}%;font-size:${d.size||30}px">${esc(d.v)}</span>`).join('')}<div><div class="title" style="font-size:${Math.min(p.title_size||52,65)}px">${esc(p.title||'DreamWall')}</div><div class="sub">${esc(p.subtitle||'')}</div></div></div><div class="body"><div class="actions"><button class="icon ${liked.has(p.id)?'liked':''}" onclick="likePost('${p.id}')">${liked.has(p.id)?'♥':'♡'}</button><button class="icon" onclick="comment('${p.id}')">💬</button><button class="icon" onclick="recreate('${p.id}')">↗</button>${p.user_id===user.id?`<button class="icon" onclick="deletePost('${p.id}')">🗑️</button>`:''}</div><div>${esc(p.caption||'')}</div><div class="comment"><input id="c-${p.id}" placeholder="Add a comment..."><button onclick="addComment('${p.id}')">Post</button></div></div></article>`}
async function likePost(id){if(liked.has(id)){let r=await db.from('likes').delete().eq('wallpaper_id',id).eq('user_id',user.id);if(r.error)return toast(r.error.message);liked.delete(id)}else{let r=await db.from('likes').insert({wallpaper_id:id,user_id:user.id});if(r.error)return toast(r.error.message);liked.add(id)}await load();home()}
async function addComment(id){let e=document.getElementById('c-'+id),text=e.value.trim();if(!text)return;let r=await db.from('comments').insert({wallpaper_id:id,user_id:user.id,text});if(r.error)toast(r.error.message);else{e.value='';toast('Comment posted!')}}
async function deletePost(id){if(!confirm('Delete this wallpaper?'))return;let r=await db.from('wallpapers').delete().eq('id',id).eq('user_id',user.id);if(r.error)return toast(r.error.message);await load();home()}
function create(seed=null){let p=seed?posts.find(x=>x.id===seed):null;document.getElementById('app').innerHTML=nav()+`<main class="layout"><section class="feed"><div class="card create"><h2>🎨 Create a wallpaper</h2><div class="grid"><div><div class="label">Title</div><input id="wt" class="field" value="${esc(p?.title||'My Dream Wallpaper')}"></div><div><div class="label">Subtitle</div><input id="ws" class="field" value="${esc(p?.subtitle||'Make it yours ✨')}"></div></div><div class="label">Background</div><input id="bg" class="color" type="color" value="#d9c8ff"><div class="label">Text color</div><input id="tc" class="color" type="color" value="#493957"><div class="label">Font</div><select id="font" class="field"><option>Arial</option><option>Georgia</option><option>Verdana</option><option>Trebuchet MS</option><option>Courier New</option><option>Impact</option></select><div class="label">Title size</div><input id="size" class="field" type="range" min="24" max="90" value="52"><div class="label">Decorations</div><input id="dec" class="field" placeholder="✨ 🌸 🦋 ☁️ ⭐"><div class="label">Caption</div><textarea id="cap" class="field" rows="3" placeholder="Tell people about your wallpaper..."></textarea><div class="tools"><button class="btn" onclick="randomize()">🎲 Surprise me</button><button class="btn primary" onclick="publish()">Publish wallpaper</button></div><div id="preview" style="margin-top:18px"></div></div></section></main>`;preview()}
function preview(){let e=document.getElementById('preview');if(!e)return;e.innerHTML=`<div class="wall" style="background:${document.getElementById('bg').value};color:${document.getElementById('tc').value};font-family:${document.getElementById('font').value}"><div><div class="title" style="font-size:${document.getElementById('size').value}px">${esc(document.getElementById('wt').value)}</div><div class="sub">${esc(document.getElementById('ws').value)}</div></div></div>`;['wt','ws','bg','tc','font','size','dec'].forEach(id=>document.getElementById(id)?.addEventListener('input',preview))}
function randomize(){const c=['#d9c8ff','#ffd1e5','#c9f5e8','#fff0b8','#cfe2ff','#ead7ff'];document.getElementById('bg').value=c[Math.floor(Math.random()*c.length)];document.getElementById('wt').value=['Dream Big','Good Vibes','Stay Sparkly','Dream On','You Got This'][Math.floor(Math.random()*5)];document.getElementById('dec').value='✨ 🌸 🦋';preview()}
async function publish(){let dec=document.getElementById('dec').value.split(/\s+/).filter(Boolean).map((v,i)=>({v,x:10+i*15,y:10+(i%3)*30,size:30}));let p={user_id:user.id,title:document.getElementById('wt').value,subtitle:document.getElementById('ws').value,background:document.getElementById('bg').value,text_color:document.getElementById('tc').value,font:document.getElementById('font').value,title_size:Number(document.getElementById('size').value),caption:document.getElementById('cap').value,decorations:dec};let r=await db.from('wallpapers').insert(p);if(r.error)return toast(r.error.message);await load();toast('Wallpaper published! ✨');home()}
function showPeople(){document.getElementById('app').innerHTML=nav()+`<main class="layout"><section class="people card"><div style="padding:18px"><h2>👥 DreamWall creators</h2>${people.filter(p=>p.id!==user.id).map(p=>`<div class="person">${av(p)}<div class="grow"><b>@${esc(p.username)}</b><div class="muted">${p.account_type==='ai'?'🤖 AI creator':'Real creator'}</div></div>${p.account_type!=='ai'?`<button class="btn primary" onclick="openChat('${p.id}')">Message</button>`:''}</div>`).join('')||'<div class="empty">No other creators yet.</div>'}</div></section></main>`}
function showProfile(id){let p=people.find(x=>x.id===id);if(!p)return;let ps=posts.filter(x=>x.user_id===id);document.getElementById('app').innerHTML=nav()+`<main class="layout"><section class="feed"><div class="card" style="padding:20px"><div style="display:flex;gap:18px;align-items:center">${av(p)}<div class="grow"><h2 style="margin:0">@${esc(p.username)}</h2><div class="muted">${esc(p.real_name||'Creator')} · ${p.account_type==='ai'?'🤖 AI creator':'✨ Real creator'}</div><p>${ps.length} wallpapers</p></div>${p.id!==user.id&&p.account_type!=='ai'?`<button class="btn primary" onclick="openChat('${p.id}')">Message</button>`:''}</div></div>${ps.map(postHTML).join('')||'<div class="card empty">No wallpapers yet.</div>'}</section></main>`}
function recreate(id){create(id)}
function comment(id){document.getElementById('c-'+id)?.focus()}
function search(q){if(!q.trim())return;let found=people.filter(p=>(p.username||'').toLowerCase().includes(q.toLowerCase()));if(found.length===1)showProfile(found[0].id);else toast(found.length+' creators found')}

/* ========================= FULL MESSAGING ========================= */
async function getConversationUsers(){const {data,error}=await db.from('messages').select('sender_id,receiver_id,created_at').or(`sender_id.eq.${user.id},receiver_id.eq.${user.id}`).order('created_at',{ascending:false});if(error)return [];const ids=[];for(const m of data||[]){const id=m.sender_id===user.id?m.receiver_id:m.sender_id;if(!ids.includes(id))ids.push(id)}return ids.map(id=>people.find(p=>p.id===id)).filter(Boolean).filter(p=>p.account_type!=='ai')}
async function showMessages(selectedId=null){clearInterval(messageTimer);const users=await getConversationUsers();activeChat=selectedId||activeChat||users[0]?.id||null;document.getElementById('app').innerHTML=nav()+`<main class="layout"><section class="messages"><aside class="conversation-list" id="conversationList"><div class="conversation-title">Messages</div><div class="conversation-search"><input placeholder="Search people..." oninput="filterChats(this.value)"></div><div id="conversationItems"></div><div class="message-note">Messages are only for real creators.</div></aside><section class="chat-panel" id="chatPanel"></section></section></main>`;renderConversationList(users);if(activeChat)await renderChat(activeChat);else showEmptyChat()}
function renderConversationList(users){const el=document.getElementById('conversationItems');if(!el)return;el.innerHTML=users.map(p=>`<button class="conversation ${p.id===activeChat?'active':''}" data-name="${esc((p.username+' '+p.real_name).toLowerCase())}" onclick="openChat('${p.id}')">${av(p)}<div class="conversation-info"><div class="conversation-name">@${esc(p.username)}</div><div class="conversation-preview">${esc(p.real_name||'Real creator')}</div></div></button>`).join('')||'<div class="empty" style="padding:25px">No conversations yet.<br><br>Go to <b>People</b> and tap Message.</div>'}
function filterChats(q){document.querySelectorAll('.conversation').forEach(e=>e.style.display=e.dataset.name.includes(q.toLowerCase())?'flex':'none')}
function showEmptyChat(){document.getElementById('chatPanel').innerHTML=`<div class="chat-empty"><div><div style="font-size:55px">💬</div><h2>Your messages</h2><p>Choose a real creator to start a conversation.</p></div></div>`}
async function openChat(id){const p=people.find(x=>x.id===id);if(!p||p.id===user.id)return;if(p.account_type==='ai'){toast('AI creators cannot receive messages.');return}activeChat=id;if(!document.getElementById('conversationList')){await showMessages(id);return}document.querySelectorAll('.conversation').forEach(e=>e.classList.toggle('active',e.getAttribute('onclick')?.includes(id)));await renderChat(id)}
async function renderChat(id){const p=people.find(x=>x.id===id);if(!p)return;const panel=document.getElementById('chatPanel');if(!panel)return;clearInterval(messageTimer);panel.innerHTML=`<div class="chat-header">${av(p)}<div class="grow"><div class="chat-header-name">@${esc(p.username)}</div><div class="chat-header-type">Real creator · Direct messages</div></div><button class="btn" onclick="showProfile('${p.id}')">View profile</button></div><div class="chat-body" id="chatBody"><div class="empty">Loading messages...</div></div><div class="chat-composer"><textarea id="messageInput" placeholder="Message @${esc(p.username)}..." onkeydown="messageKey(event)"></textarea><button class="send" onclick="sendMessage()">➤</button></div>`;await loadChatMessages(id);messageTimer=setInterval(()=>loadChatMessages(id,true),2500);setTimeout(()=>document.getElementById('messageInput')?.focus(),50)}
async function loadChatMessages(id,silent=false){const body=document.getElementById('chatBody');if(!body)return;const {data,error}=await db.from('messages').select('*').or(`and(sender_id.eq.${user.id},receiver_id.eq.${id}),and(sender_id.eq.${id},receiver_id.eq.${user.id})`).order('created_at',{ascending:true});if(error){if(!silent)body.innerHTML=`<div class="empty">${esc(error.message)}</div>`;return}const wasBottom=body.scrollHeight-body.scrollTop-body.clientHeight<80;body.innerHTML=(data||[]).map(m=>`<div class="bubble-row ${m.sender_id===user.id?'mine':''}"><div class="bubble ${m.sender_id===user.id?'mine':'theirs'}">${esc(m.text)}<div class="bubble-time">${new Date(m.created_at).toLocaleString([], {hour:'numeric',minute:'2-digit'})}</div></div></div>`).join('')||'<div class="empty">No messages yet.<br>Say hello! 👋</div>';if(wasBottom||!silent)body.scrollTop=body.scrollHeight}
function messageKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}}
async function sendMessage(){const input=document.getElementById('messageInput');if(!input||!activeChat)return;const text=input.value.trim();if(!text)return;const target=people.find(p=>p.id===activeChat);if(!target||target.account_type==='ai')return toast('You can only message real creators.');input.disabled=true;const {error}=await db.from('messages').insert({sender_id:user.id,receiver_id:activeChat,text});input.disabled=false;if(error){toast(error.message);return}input.value='';await loadChatMessages(activeChat,false)}
window.addEventListener('beforeunload',()=>clearInterval(messageTimer));
start();
</script>
</body>
</html>
