<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DreamWall</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--a:#c9a4ff;--b:#ff9fc5;--c:#9ee8d5;--ink:#493957;--line:#eadff1}*{box-sizing:border-box}body{margin:0;background:#faf8fc;color:var(--ink);font:15px Arial}.wrap{max-width:1100px;margin:auto;padding:16px}.top{position:sticky;top:0;z-index:5;background:#fffE;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:12px;gap:10px}.logo{font-size:29px;font-weight:900;background:linear-gradient(90deg,var(--a),var(--b),var(--c));-webkit-background-clip:text;color:transparent}.nav{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}button{cursor:pointer;border:0}.btn{padding:10px 14px;border-radius:13px;background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:700}.primary{background:linear-gradient(100deg,var(--a),var(--b));color:#fff;border:0}.danger{background:#ffe6ee;color:#a6385a}.card{background:#fff;border:1px solid var(--line);border-radius:22px;margin:16px 0;padding:18px;box-shadow:0 8px 30px #57376b0d}.auth{max-width:470px;margin:8vh auto}.field{width:100%;padding:12px;border:1px solid #ddd2e4;border-radius:12px;margin:6px 0;outline:0}.muted{color:#8a7c91}.feed{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}.post{padding:0;overflow:hidden}.wall{min-height:400px;display:grid;place-items:center;text-align:center;padding:30px;background-size:cover;background-position:center}.wall h2{margin:8px 0;font-size:48px;line-height:1}.info{padding:14px}.row{display:flex;align-items:center;gap:10px}.grow{flex:1}.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--a),var(--c));display:grid;place-items:center;font-weight:900}.badge{font-size:10px;padding:5px 7px;border-radius:8px;background:#eee6ff}.ai{background:#e9e9e9}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.person{border:1px solid var(--line);border-radius:17px;padding:14px}.builder{display:grid;grid-template-columns:390px 1fr;gap:18px}.preview{min-height:540px;border-radius:23px;display:grid;place-items:center;text-align:center;padding:30px}.tabs{display:flex;gap:7px;margin-bottom:15px}.tab{padding:9px 13px;border-radius:11px;background:#eee7f3}.tab.on{background:var(--a);color:#fff}.comments{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}.comment{padding:6px 0}.empty{text-align:center;padding:55px 15px}@media(max-width:750px){.builder{grid-template-columns:1fr}.nav{width:100%;margin-left:0}.top{flex-wrap:wrap}}</style></head><body><div id="app"></div><script>
const URL='https://kcybwrdtnlflevndmzfn.supabase.co';const KEY='sb_publishable_XhOq8P5tdMgjWDKZEvgsgg_hcALWg48';const db=window.supabase.createClient(URL,KEY);let session=null,me=null,profiles=[],walls=[];const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function avatar(p){return p?.avatar_url?`<img class="avatar" src="${esc(p.avatar_url)}" onerror="this.style.display='none'">`:`<div class="avatar">${esc((p?.username||'?')[0].toUpperCase())}</div>`}function note(x){alert(x)}
async function start(){let r=await db.auth.getSession();session=r.data.session;if(session){await loadMe();if(me)home();else profileForm()}else welcome();db.auth.onAuthStateChange(async(_,s)=>{session=s;if(s){await loadMe();if(me)home();else profileForm()}else welcome()})}
function welcome(){app.innerHTML=`<div class="wrap"><div class="card auth"><div class="logo">DreamWall</div><h1>Your wall. Your world. ✨</h1><p class="muted">A wallpaper community with real shared accounts.</p><button class="btn primary" onclick="auth('signup')">Create account</button> <button class="btn" onclick="auth('login')">Sign in</button></div></div>`}function auth(mode){app.innerHTML=`<div class="wrap"><div class="card auth"><div class="logo">DreamWall</div><h2>${mode==='signup'?'Create your account':'Welcome back'}</h2><form onsubmit="${mode==='signup'?'signup(event)':'login(event)'}"><input class="field" id="email" type="email" placeholder="Email" required><input class="field" id="password" type="password" minlength="6" placeholder="Password" required><button class="btn primary">${mode==='signup'?'Create account':'Sign in'}</button></form><p class="muted">${mode==='signup'?'Already have an account?':'Need an account?'} <button class="btn" onclick="auth('${mode==='signup'?'login':'signup'}')">${mode==='signup'?'Sign in':'Create one'}</button></p></div></div>`}
async function signup(e){e.preventDefault();let email=$('email').value.trim(),password=$('password').value;let r=await db.auth.signUp({email,password});if(r.error)return note(r.error.message);if(!r.data.session){note('Your account was created. Check your email, confirm it, then sign in.');return}session=r.data.session;profileForm()}
async function login(e){e.preventDefault();let r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)return note(r.error.message);session=r.data.session;await loadMe();if(me)home();else profileForm()}
async function loadMe(){if(!session)return;let r=await db.from('profiles').select('*').eq('id',session.user.id).maybeSingle();me=r.data||null}
function profileForm(){app.innerHTML=`<div class="wrap"><div class="card auth"><div class="logo">DreamWall</div><h2>Finish your profile ✨</h2><p class="muted">Your username is public and must be different from your real name.</p><input class="field" id="username" placeholder="Username"><input class="field" id="realname" placeholder="Real name"><input class="field" id="avatarurl" placeholder="Profile picture URL (optional)"><textarea class="field" id="bio" placeholder="Bio (optional)"></textarea><button class="btn primary" onclick="saveProfile()">Save profile</button><button class="btn" onclick="logout()">Log out</button></div></div>`}
async function saveProfile(){let username=$('username').value.trim().toLowerCase().replace(/\s+/g,'_'),real=$('realname').value.trim();if(!username||!real)return note('Enter your username and real name.');if(username.replaceAll('_','')===real.toLowerCase().replace(/\s+/g,''))return note('Your username cannot be your real name.');let check=await db.from('profiles').select('id').ilike('username',username).neq('id',session.user.id).maybeSingle();if(check.data)return note('That username is already taken. Choose another.');let row={id:session.user.id,username,real_name:real,avatar_url:$('avatarurl').value.trim(),bio:$('bio').value.trim(),account_type:'real'};let r=await db.from('profiles').upsert(row,{onConflict:'id'});if(r.error)return note(r.error.message);me=row;home()}
async function data(){let p=await db.from('profiles').select('*').order('created_at',{ascending:true});let w=await db.from('wallpapers').select('*').order('created_at',{ascending:false});profiles=p.data||[];walls=w.data||[]}
function header(){return `<header class="top"><div class="logo">DreamWall</div><div class="nav"><button class="btn" onclick="home()">🏠 Home</button><button class="btn" onclick="people()">👥 People</button><button class="btn primary" onclick="studio()">＋ Create</button><button class="btn" onclick="messages()">💌 Messages</button><button class="btn" onclick="profileView('${session.user.id}')">👤 Profile</button><button class="btn" onclick="logout()">Log out</button></div></header>`}
async function home(){await data();app.innerHTML=`<div class="wrap">${header()}<div class="card"><h1>DreamWall ✨</h1><p class="muted">Real people. Real wallpapers. No pretend activity.</p></div><div class="feed">${walls.length?walls.map(post).join(''):`<div class="card empty"><h2>No wallpapers yet!</h2><button class="btn primary" onclick="studio()">Create one</button></div>`}</div></div>`}
function post(w){let p=profiles.find(x=>x.id===w.user_id)||{};let ai=p.account_type==='ai';let dec=Array.isArray(w.decorations)?w.decorations.join(' '):'';return `<article class="card post"><div class="wall" style="background:${esc(w.background)};color:${esc(w.text_color||'#493957')};filter:brightness(${w.brightness||100}%) contrast(${w.contrast||100}%)"><div><div style="font-size:45px">${esc(dec)}</div><h2 style="font-family:${esc(w.font||'Arial')};font-size:${w.title_size||52}px">${esc(w.title)}</h2><p>${esc(w.subtitle||'')}</p></div></div><div class="info"><div class="row">${avatar(p)}<button class="btn" onclick="profileView('${p.id}')">@${esc(p.username||'unknown')}</button><span class="grow"></span><span class="badge ${ai?'ai':''}">${ai?'🤖 AI CREATOR':'✓ REAL CREATOR'}</span></div><p>${esc(w.caption||'')}</p><div class="actions"><button class="btn" onclick="like('${w.id}')">❤️ Like</button><button class="btn" onclick="comment('${w.id}')">💬 Comment</button><button class="btn" onclick="recreate('${w.id}')">🎨 Recreate</button>${w.user_id===session.user.id?`<button class="danger" onclick="del('${w.id}')">🗑️ Delete</button>`:''}</div></div></article>`}
async function like(id){let q=await db.from('likes').select('*').eq('user_id',session.user.id).eq('wallpaper_id',id).maybeSingle();if(q.data)await db.from('likes').delete().eq('user_id',session.user.id).eq('wallpaper_id',id);else await db.from('likes').insert({user_id:session.user.id,wallpaper_id:id});note(q.data?'Unliked':'Liked ❤️')}
async function comment(id){let t=prompt('Comment on this wallpaper:');if(!t?.trim())return;let r=await db.from('comments').insert({wallpaper_id:id,user_id:session.user.id,text:t.trim()});if(r.error)note(r.error.message);else note('Comment posted! 💬')}
async function del(id){if(!confirm('Delete this wallpaper?'))return;let r=await db.from('wallpapers').delete().eq('id',id).eq('user_id',session.user.id);if(r.error)note(r.error.message);else home()}
async function people(){await data();app.innerHTML=`<div class="wrap">${header()}<div class="card"><h1>People on DreamWall</h1><p class="muted">Everyone here is an actual account in the shared database.</p></div><div class="people">${profiles.map(p=>`<div class="person">${avatar(p)}<div style="flex:1"><b>@${esc(p.username)}</b><div class="muted">${p.account_type==='ai'?'🤖 AI creator':'✓ Real creator'}</div></div><button class="btn" onclick="profileView('${p.id}')">View</button></div>`).join('')}</div></div>`}
async function profileView(id){await data();let p=profiles.find(x=>x.id===id);if(!p)return;let ws=walls.filter(w=>w.user_id===id);app.innerHTML=`<div class="wrap">${header()}<div class="card"><div class="row">${avatar(p)}<div><h2>@${esc(p.username)}</h2><p>${esc(p.real_name)}</p><span class="badge ${p.account_type==='ai'?'ai':''}">${p.account_type==='ai'?'🤖 AI CREATOR':'✓ REAL CREATOR'}</span></div></div><p>${esc(p.bio||'')}</p>${id!==session.user.id&&p.account_type!=='ai'?`<button class="btn primary" onclick="follow('${id}')">＋ Follow</button> <button class="btn" onclick="message('${id}')">💌 Message</button>`:''}</div><div class="feed">${ws.map(post).join('')||'<div class="card empty">No wallpapers yet.</div>'}</div></div>`}
async function follow(id){let q=await db.from('follows').select('*').eq('follower_id',session.user.id).eq('following_id',id).maybeSingle();if(q.data)await db.from('follows').delete().eq('follower_id',session.user.id).eq('following_id',id);else await db.from('follows').insert({follower_id:session.user.id,following_id:id});note(q.data?'Unfollowed':'Following!')}
async function message(id){let p=profiles.find(x=>x.id===id);if(!p||p.account_type==='ai')return note('Only real creators can receive messages.');let t=prompt(`Message @${p.username}:`);if(!t?.trim())return;let r=await db.from('messages').insert({sender_id:session.user.id,receiver_id:id,text:t.trim()});if(r.error)note(r.error.message);else note('Message sent! 💌')}
async function messages(){await data();let ids=[...new Set((await db.from('messages').select('sender_id,receiver_id').or(`sender_id.eq.${session.user.id},receiver_id.eq.${session.user.id}`)).data?.flatMap(x=>[x.sender_id,x.receiver_id]).filter(x=>x!==session.user.id)||[])];let ps=profiles.filter(p=>ids.includes(p.id)&&p.account_type!=='ai');app.innerHTML=`<div class="wrap">${header()}<div class="card"><h1>Messages 💌</h1><p class="muted">You can message real creators only.</p>${ps.map(p=>`<div class="person"><b>@${esc(p.username)}</b><button class="btn" onclick="message('${p.id}')">Message</button></div>`).join('')||'<p class="muted">No conversations yet.</p>'}</div></div>`}
function profile(){profileView(session.user.id)}
function recreate(id){let w=walls.find(x=>x.id===id);if(w)studio(w)}
function studio(w=null){let d=w||{};app.innerHTML=`<div class="wrap">${header()}<div class="builder"><div class="card"><h1>Create a wallpaper 🎨</h1><input class="field" id="title" value="${esc(d.title||'Dreamy')}" placeholder="Title"><input class="field" id="sub" value="${esc(d.subtitle||'make your world beautiful')}" placeholder="Subtitle"><textarea class="field" id="cap" placeholder="Caption">${esc(d.caption||'')}</textarea><input class="field" id="bg" value="${esc(d.background||'linear-gradient(135deg,#c9a4ff,#9ee8d5)')}" placeholder="Background / CSS gradient / image URL"><div><label>Text color </label><input id="color" type="color" value="${d.text_color||'#493957'}"></div><select class="field" id="font"><option>Arial</option><option>Georgia</option><option>Verdana</option><option>Trebuchet MS</option><option>Courier New</option><option>Impact</option></select><label>Title size <input id="size" type="range" min="20" max="100" value="${d.title_size||52}"></label><input class="field" id="decor" value="${Array.isArray(d.decorations)?esc(d.decorations.join(' ')):''}" placeholder="✨ 🌸 ☁️ 💖 ⭐"><label>Brightness <input id="bright" type="range" min="50" max="150" value="${d.brightness||100}"></label><label>Contrast <input id="contrast" type="range" min="50" max="150" value="${d.contrast||100}"></label><button class="btn primary" onclick="publish()">Publish wallpaper</button></div><div class="card"><h2>Preview</h2><div id="preview" class="preview"></div></div></div></div>`;['title','sub','bg','color','font','size','decor','bright','contrast'].forEach(x=>$(x).addEventListener('input',preview));preview()}
function preview(){let x=$('preview');if(!x)return;x.style.background=$('bg').value;x.style.color=$('color').value;x.style.filter=`brightness(${$('bright').value}%) contrast(${$('contrast').value}%)`;x.innerHTML=`<div><div style="font-size:45px">${esc($('decor').value)}</div><h2 style="font-family:${esc($('font').value)};font-size:${$('size').value}px;line-height:1">${esc($('title').value)}</h2><p>${esc($('sub').value)}</p></div>`}
async function publish(){let row={user_id:session.user.id,title:$('title').value.trim(),subtitle:$('sub').value.trim(),caption:$('cap').value.trim(),background:$('bg').value.trim(),text_color:$('color').value,font:$('font').value,title_size:+$('size').value,decorations:$('decor').value.split(/\s+/).filter(Boolean),brightness:+$('bright').value,contrast:+$('contrast').value};if(!row.title)return note('Give your wallpaper a title.');let r=await db.from('wallpapers').insert(row);if(r.error)return note(r.error.message);note('Published! ✨');home()}
async function logout(){await db.auth.signOut()}
start();
</script></body></html>
