<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DreamWall</title>
<style>
:root{--a:#c9a4ff;--b:#9ee8d5;--p:#ff9fc5;--bg:#faf8fc;--card:#fff;--ink:#30283a;--muted:#8d8298;--line:#e9e0ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{height:70px;position:sticky;top:0;z-index:50;background:#ffffffed;backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}.logo{font-size:28px;font-weight:900;background:linear-gradient(90deg,var(--a),var(--p),var(--b));-webkit-background-clip:text;color:transparent}.search{width:35%;border:0;background:#f3eff6;border-radius:25px;padding:11px 16px;outline:0}.topBtns{display:flex;gap:8px}.round{border:0;background:#f1ebf6;border-radius:50%;width:42px;height:42px;font-size:19px}.layout{max-width:1200px;margin:auto;display:grid;grid-template-columns:190px minmax(0,650px) 230px;gap:25px;padding:25px 18px 70px}.nav{position:sticky;top:95px;display:flex;flex-direction:column;gap:5px}.nav button{border:0;background:transparent;text-align:left;padding:13px;border-radius:14px;font-weight:800}.nav button:hover,.nav button.active{background:#eee5f6;color:#8051b5}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px #5b436e10;margin-bottom:18px;overflow:hidden}.empty{text-align:center;padding:70px 25px;color:var(--muted)}.empty h2{color:var(--ink)}.primary{border:0;border-radius:13px;padding:11px 17px;background:linear-gradient(135deg,var(--a),var(--p));color:#fff;font-weight:800}.secondary{border:1px solid var(--line);border-radius:13px;padding:10px 15px;background:#fff;font-weight:700}.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--a);cursor:pointer}.postHead{display:flex;align-items:center;gap:10px;padding:14px}.postHead .info{flex:1}.postHead small,.muted{color:var(--muted)}.badge{font-size:10px;color:#fff;border-radius:50%;padding:3px 5px;margin-left:4px}.real{background:#7563e7}.aib{background:#9a67bd}.wall{position:relative;aspect-ratio:9/14;display:flex;align-items:center;justify-content:center;overflow:hidden}.wallContent{text-align:center;z-index:2;padding:25px}.wallTitle{font-size:46px;font-weight:900;line-height:.95}.wallSub{margin-top:12px;font-size:14px}.orb{position:absolute;border-radius:50%;background:#fff4;filter:blur(1px)}.orb1{width:270px;height:270px;right:-80px;top:-50px}.orb2{width:190px;height:190px;left:-70px;bottom:-40px}.actions{display:flex;gap:14px;padding:11px 15px}.actions button{border:0;background:none;font-size:23px}.liked{color:#ff579b}.body{padding:2px 15px 15px}.comment{font-size:14px;margin-top:7px}.commentRow{display:flex;border-top:1px solid var(--line);padding:9px 13px}.commentRow input{border:0;outline:0;flex:1}.commentRow button{border:0;background:none;color:#8051b5;font-weight:800}.stories{display:flex;gap:17px;overflow:auto;padding:5px 2px 20px}.story{text-align:center;font-size:11px;font-weight:800;min-width:68px}.ring{width:62px;height:62px;border-radius:50%;padding:3px;margin:auto auto 4px;background:#ddd}.ring.new{background:linear-gradient(135deg,var(--a),var(--p),var(--b))}.ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid white}.side{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:15px}.profile{text-align:center}.banner{height:145px;border-radius:20px;background:linear-gradient(135deg,var(--a),var(--p),var(--b))}.bigAvatar{width:105px;height:105px;border-radius:50%;object-fit:cover;border:6px solid white;margin-top:-53px}.stats{display:flex;justify-content:center;gap:35px;margin:20px}.stats strong{display:block;font-size:20px}.stats span{font-size:11px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:22px}.gridItem{aspect-ratio:1;overflow:hidden;border-radius:11px;position:relative}.gridItem .wall{height:100%;min-height:0}.gridItem .wallTitle{font-size:18px}.modalBg{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:#30203b88;padding:18px}.modalBg.open{display:flex}.modal{background:#fff;border-radius:25px;width:min(760px,100%);max-height:92vh;overflow:auto;padding:24px}.modalTop{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#f0eaf5;border-radius:50%;width:38px;height:38px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px;margin:9px 0}.field.full{grid-column:1/-1}.field input,.field textarea,.field select{border:1px solid var(--line);border-radius:12px;padding:10px;outline:0}.field textarea{min-height:80px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tool{border:1px solid var(--line);border-radius:15px;padding:13px}.tool h4{margin:0 0 8px}.peopleGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.person{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:17px;padding:13px;background:white}.person .grow{flex:1}.delete{border:0;background:#fff0f4;color:#d34f79;border-radius:10px;padding:7px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,100px);background:#30283a;color:#fff;padding:12px 18px;border-radius:25px;transition:.25s;z-index:200}.toast.show{transform:translate(-50%,0)}@media(max-width:950px){.layout{grid-template-columns:70px minmax(0,650px);justify-content:center}.right{display:none}.nav button span:not(.ico){display:none}}@media(max-width:650px){.search{display:none}.layout{display:block;padding:15px 10px 75px}.nav{position:fixed;bottom:0;left:0;right:0;z-index:60;height:60px;background:white;border-top:1px solid var(--line);display:flex;flex-direction:row;justify-content:space-around}.nav button{padding:7px}.fields,.tools,.peopleGrid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<header class="top"><div class="logo">DreamWall</div><input id="search" class="search" placeholder="Search people and wallpapers"><div class="topBtns"><button class="round" onclick="messages()">💬</button><button class="round" onclick="create()">＋</button><button class="round" onclick="profile()">●</button></div></header>
<div class="layout"><aside><nav class="nav"><button class="active" onclick="home()"><span class="ico">⌂</span><span> Home</span></button><button onclick="people()"><span class="ico">👥</span><span> People</span></button><button onclick="explore()"><span class="ico">⌕</span><span> Explore</span></button><button onclick="create()"><span class="ico">＋</span><span> Create</span></button><button onclick="profile()"><span class="ico">●</span><span> Profile</span></button></nav></aside><main id="main"></main><aside class="right"><div class="side"><b>DreamWall</b><p class="muted">A wallpaper community for real creators and clearly labeled AI creators.</p></div><div class="side"><b>Your account</b><p id="accountSide" class="muted">No profile yet.</p><button class="primary" onclick="editProfile()">Edit profile</button></div></aside></div>
<div id="modalBg" class="modalBg"><div id="modal" class="modal"></div></div><div id="toast" class="toast"></div>
<script>
const KEY='dreamwall_v2';let data=JSON.parse(localStorage.getItem(KEY)||'null')||{me:null,people:[],posts:[],messages:[]};const placeholder='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="#eee7f5"/><text x="50" y="60" text-anchor="middle" font-size="42">☁</text></svg>');const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const esc=x=>String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function toast(x){let t=document.getElementById('toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}function openModal(x){document.getElementById('modal').innerHTML=x;document.getElementById('modalBg').classList.add('open')}function closeModal(){document.getElementById('modalBg').classList.remove('open')}document.getElementById('modalBg').onclick=e=>{if(e.target===e.currentTarget)closeModal()};function setNav(n){document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('active',i===n))}function sync(){document.getElementById('accountSide').textContent=data.me?'@'+data.me.username:'No profile yet.';document.documentElement.style.setProperty('--a',data.me?.accent||'#c9a4ff');document.documentElement.style.setProperty('--b',data.me?.accent2||'#9ee8d5')}
function home(){setNav(0);sync();let m=document.getElementById('main');m.innerHTML='<div class="stories"><div class="story"><div class="ring"><img src="'+(data.me?.avatar||placeholder)+'"></div>You</div>'+data.people.filter(p=>p.id!==data.me?.id).map(p=>'<div class="story" onclick="viewPerson(\''+p.id+'\')"><div class="ring '+(p.new?'new':'')+'"><img src="'+(p.avatar||placeholder)+'"></div>'+esc(p.username)+'</div>').join('')+'</div>';if(!data.posts.length){m.innerHTML+='<div class="card"><div class="empty"><div style="font-size:55px">🌙</div><h2>Your DreamWall is empty</h2><p>Create a wallpaper to start your feed.</p><button class="primary" onclick="create()">＋ Create wallpaper</button></div></div>';return}m.innerHTML+=data.posts.map(renderPost).join('')}
function wallpaper(p){return '<div class="wall" style="background:'+p.bg+';color:'+p.color+'"><div class="orb orb1"></div><div class="orb orb2"></div><div class="wallContent"><div class="wallTitle">'+esc(p.title)+'</div><div class="wallSub">'+esc(p.subtitle)+'</div></div></div>'}
function renderPost(p){return '<article class="card"><div class="postHead"><img class="avatar" src="'+(p.avatar||placeholder)+'" onclick="viewPerson(\''+p.owner+'\')"><div class="info"><b onclick="viewPerson(\''+p.owner+'\')">'+esc(p.creator)+(p.type==='ai'?'<span class="badge aib">AI</span>':'<span class="badge real">✓</span>')+'</b><small>'+ (p.type==='ai'?'AI creator':'Real creator')+'</small></div>'+(p.owner===data.me?.id?'<button class="delete" onclick="deletePost(\''+p.id+'\')">🗑</button>':'')+'</div>'+wallpaper(p)+'<div class="actions"><button class="'+(p.liked?'liked':'')+'" onclick="like(\''+p.id+'\')">'+(p.liked?'♥':'♡')+'</button><button onclick="commentPrompt(\''+p.id+'\')">💬</button><button onclick="share(\''+p.id+'\')">⤴</button><button onclick="remake(\''+p.id+'\')">✦</button></div><div class="body"><b>'+p.likes+' likes</b><div class="comment"><b>'+esc(p.creator)+'</b> '+esc(p.caption)+'</div>'+p.comments.map(c=>'<div class="comment"><b>'+esc(c.user)+'</b> '+esc(c.text)+'</div>').join('')+'</div></article>'}
function people(){setNav(1);sync();let m=document.getElementById('main');m.innerHTML='<div class="card" style="padding:20px"><h1>People</h1><p class="muted">Profiles that have signed up in this DreamWall data store.</p><div class="peopleGrid">'+data.people.map(p=>'<div class="person"><img class="avatar" src="'+(p.avatar||placeholder)+'" onclick="viewPerson(\''+p.id+'\')"><div class="grow"><b>'+esc(p.username)+'</b><div class="muted">'+esc(p.realName)+'</div></div><button class="secondary" onclick="viewPerson(\''+p.id+'\')">View</button></div>').join('')+'</div></div>'}
function explore(){setNav(2);let m=document.getElementById('main');m.innerHTML='<div class="card"><div class="empty"><div style="font-size:55px">✨</div><h2>Explore</h2><p>Browse wallpapers made by creators.</p></div></div>'+data.posts.map(renderPost).join('')}
function profile(){setNav(4);if(!data.me){editProfile();return}viewPerson(data.me.id)}
function viewPerson(id){let p=data.people.find(x=>x.id===id);if(!p)return;let posts=data.posts.filter(x=>x.owner===id);document.getElementById('main').innerHTML='<div class="card profile"><div class="banner"></div><img class="bigAvatar" src="'+(p.avatar||placeholder)+'"><h1>'+esc(p.realName||p.username)+(p.type==='ai'?'<span class="badge aib">AI</span>':'<span class="badge real">✓</span>')+'</h1><div class="muted">@'+esc(p.username)+'</div><p>'+esc(p.bio||'')+'</p><div class="stats"><div><strong>'+posts.length+'</strong><span>WALLPAPERS</span></div><div><strong>'+p.followers+'</strong><span>FOLLOWERS</span></div></div>'+(p.id===data.me?.id?'<button class="secondary" onclick="editProfile()">Edit profile</button>':'<button class="primary" onclick="follow(\''+p.id+'\')">Follow</button>')+'<div class="grid">'+posts.map(x=>'<div class="gridItem">'+wallpaper(x)+'</div>').join('')+'</div></div>'}
function editProfile(){let p=data.me||{username:'',realName:'',password:'',avatar:'',bio:'',accent:'#c9a4ff',accent2:'#9ee8d5',type:'real',id:'u'+Date.now(),followers:0};openModal('<div class="modalTop"><h2>'+ (data.me?'Edit profile':'Create your DreamWall profile')+'</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted">Your username must be unique and cannot be your real name.</p><div class="fields"><div class="field"><label>Username</label><input id="u" value="'+esc(p.username)+'"></div><div class="field"><label>Real name</label><input id="r" value="'+esc(p.realName)+'"></div><div class="field"><label>Password</label><input id="pw" type="password" value="'+esc(p.password)+'"></div><div class="field"><label>Profile picture</label><input id="av" type="url" placeholder="Paste an image URL" value="'+esc(p.avatar)+'"></div><div class="field full"><label>Bio</label><textarea id="bio">'+esc(p.bio)+'</textarea></div><div class="field"><label>Accent color</label><input id="ac" type="color" value="'+p.accent+'"></div><div class="field"><label>Second color</label><input id="ac2" type="color" value="'+p.accent2+'"></div></div><button class="primary" onclick="saveProfile(\''+p.id+'\')">Save profile</button>');}
function saveProfile(id){let u=document.getElementById('u').value.trim(),r=document.getElementById('r').value.trim();if(!u||!r){toast('Username and real name are required');return}if(u.toLowerCase()===r.toLowerCase()){toast('Username cannot be your real name');return}let taken=data.people.some(p=>p.username.toLowerCase()===u.toLowerCase()&&p.id!==id);if(taken){toast('That username is already taken');return}let p={id,username:u,realName:r,password:document.getElementById('pw').value,avatar:document.getElementById('av').value,bio:document.getElementById('bio').value,accent:document.getElementById('ac').value,accent2:document.getElementById('ac2').value,type:'real',followers:data.people.find(x=>x.id===id)?.followers||0};let old=data.people.findIndex(x=>x.id===id);if(old>=0)data.people[old]=p;else data.people.push(p);data.me=p;save();closeModal();sync();home();toast('Profile saved!')}
function create(){if(!data.me){toast('Create your profile first');editProfile();return}openModal('<div class="modalTop"><h2>Create wallpaper ✨</h2><button class="close" onclick="closeModal()">×</button></div><div class="tools"><div class="tool"><h4>Background</h4><div class="field"><label>Color 1</label><input id="c1" type="color" value="#ffc9e1"></div><div class="field"><label>Color 2</label><input id="c2" type="color" value="#cfc2ff"></div><div class="field"><label>Color 3</label><input id="c3" type="color" value="#bdeee1"></div><div class="field"><label>Style</label><select id="style"><option>linear</option><option>radial</option><option>solid</option><option>conic</option></select></div><div class="field"><label>Angle</label><input id="ang" type="range" min="0" max="360" value="135"></div></div><div class="tool"><h4>Text</h4><div class="field"><label>Title</label><input id="title" value="Dreamy"></div><div class="field"><label>Subtitle</label><input id="sub" value="make your world beautiful"></div><div class="field"><label>Text color</label><input id="tc" type="color" value="#4d3d59"></div><div class="field"><label>Title size</label><input id="size" type="range" min="20" max="80" value="46"></div></div></div><div id="creatorPreview" class="creator-preview">'+wallpaper({bg:'linear-gradient(135deg,#ffc9e1,#cfc2ff,#bdeee1)',color:'#4d3d59',title:'Dreamy',subtitle:'make your world beautiful'})+'</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="secondary" onclick="previewCreator()">Preview</button><button class="primary" onclick="publishWallpaper()">Publish</button></div>');}
function previewCreator(){let bg=makeBg();document.getElementById('creatorPreview').innerHTML=wallpaper({bg,color:document.getElementById('tc').value,title:document.getElementById('title').value,subtitle:document.getElementById('sub').value})}
function makeBg(){let a=c1.value,b=c2.value,c=c3.value,s=style.value,g=ang.value;if(s==='solid')return a;if(s==='radial')return 'radial-gradient(circle,'+a+','+b+','+c+')';if(s==='conic')return 'conic-gradient(from '+g+'deg,'+a+','+b+','+c+','+a+')';return 'linear-gradient('+g+'deg,'+a+','+b+','+c+')'}
function publishWallpaper(){if(!data.me)return;let p={id:'p'+Date.now(),owner:data.me.id,creator:data.me.username,avatar:data.me.avatar||placeholder,type:'real',bg:makeBg(),color:document.getElementById('tc').value,title:document.getElementById('title').value,subtitle:document.getElementById('sub').value,caption:'My new DreamWall!',likes:0,liked:false,comments:[],new:true};data.posts.unshift(p);save();closeModal();home();toast('Your wallpaper is published!')}
function deletePost(id){if(!data.me)return;let p=data.posts.find(x=>x.id===id);if(!p||p.owner!==data.me.id)return;if(confirm('Delete this wallpaper?')){data.posts=data.posts.filter(x=>x.id!==id);save();home();toast('Wallpaper deleted')}}
function like(id){let p=data.posts.find(x=>x.id===id);if(!p)return;p.liked=!p.liked;p.likes+=p.liked?1:-1;save();home()}function commentPrompt(id){let text=prompt('Write a comment:');if(!text||!data.me)return;let p=data.posts.find(x=>x.id===id);p.comments.push({user:data.me.username,text});save();home()}function share(id){navigator.clipboard?.writeText(location.href+'#wallpaper-'+id);toast('Wallpaper link copied!')}function remake(id){let p=data.posts.find(x=>x.id===id);if(!p)return;toast('Opening a recreatable copy');create()}
function follow(id){let p=data.people.find(x=>x.id===id);if(p){p.followers++;save();viewPerson(id);toast('Following @'+p.username)}}function messages(){if(!data.me){editProfile();return}openModal('<div class="modalTop"><h2>Messages 💬</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted">Messaging is reserved for real creators.</p><div>'+data.people.filter(p=>p.id!==data.me.id&&p.type==='real').map(p=>'<button class="secondary" style="margin:5px" onclick="messagePerson(\''+p.id+'\')">'+esc(p.username)+'</button>').join('')+'</div>')}function messagePerson(id){let p=data.people.find(x=>x.id===id);let text=prompt('Message @'+p.username+':');if(!text)return;data.messages.push({from:data.me.id,to:id,text,at:new Date().toISOString()});save();toast('Message saved');closeModal()}
function searchPeople(){let q=document.getElementById('search').value.toLowerCase();if(!q){home();return}setNav(1);let found=data.people.filter(p=>p.username.toLowerCase().includes(q)||p.realName.toLowerCase().includes(q));document.getElementById('main').innerHTML='<div class="card" style="padding:20px"><h2>Search results</h2><div class="peopleGrid">'+found.map(p=>'<div class="person"><img class="avatar" src="'+(p.avatar||placeholder)+'"><div class="grow"><b>'+esc(p.username)+'</b><div class="muted">'+esc(p.realName)+'</div></div><button class="secondary" onclick="viewPerson(\''+p.id+'\')">View</button></div>').join('')+'</div></div>'}document.getElementById('search').addEventListener('input',searchPeople);sync();home();
</script>
</body></html>
